    :root {
        --red: #ff2020;
        --red-dim: rgba(255,32,32,0.15);
        --white: #ffffff;
        --dim: rgba(255,255,255,0.08);
        --glow: 0 0 12px rgba(255,32,32,0.6);
        --mono: 'Share Tech Mono', monospace;
        --sans: 'Rajdhani', sans-serif;
    }

    body {
        margin: 0; background: #000;
        overflow: hidden;
        font-family: var(--mono);
        user-select: none;
        cursor: crosshair;
    }

    #container { position: relative; width: 100vw; height: 100vh; }

    video {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
        filter: brightness(0.45) contrast(1.3) saturate(0.1) hue-rotate(180deg);
    }

    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ── SCANLINES overlay ── */
    #scanlines {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: repeating-linear-gradient(
            0deg,
            transparent, transparent 3px,
            rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
        );
        animation: scanScroll 8s linear infinite;
    }
    @keyframes scanScroll { from { background-position: 0 0; } to { background-position: 0 100px; } }

    /* ── VIGNETTE ── */
    #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 4;
        background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
    }

    /* ── TOP BAR ── */
    #topbar {
        position: absolute; top: 0; left: 0; right: 0; height: 36px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 18px; z-index: 15; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .tb-left, .tb-right { display: flex; gap: 20px; align-items: center; }
    .tb-label {
        font-family: var(--sans); font-size: 10px; font-weight: 700;
        letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.4);
    }
    .tb-val {
        font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.7);
        letter-spacing: 1px;
    }
    #sysId { color: #fff; font-size: 11px; letter-spacing: 4px; font-family: var(--sans); font-weight: 700; }

    /* ── BOTTOM BAR ── */
    #botbar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
        background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 18px; z-index: 15; border-top: 1px solid rgba(255,255,255,0.07);
    }
    .coords { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; }

    /* ── TERMINAL ── */
    #terminal {
        position: absolute; bottom: 50px; left: 15px;
        width: 300px; max-height: 200px;
        overflow: hidden; z-index: 15;
    }
    .log-entry {
        font-size: 10px; letter-spacing: 1.5px; line-height: 1.8;
        text-transform: uppercase; color: rgba(255,255,255,0.5);
        display: flex; gap: 8px; align-items: baseline;
        animation: fadeIn 0.3s ease;
    }
    .log-entry.threat { color: var(--red); }
    .log-entry.info { color: rgba(255,255,255,0.6); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    .log-ts { color: rgba(255,255,255,0.2); flex-shrink: 0; }
    .log-prefix { color: rgba(255,255,255,0.25); }

    /* Cursor blink */
    #cursor {
        display: inline-block; width: 7px; height: 12px;
        background: rgba(255,255,255,0.5);
        animation: blink 0.8s steps(1) infinite;
        vertical-align: middle; margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── STATUS PANEL (right) ── */
    #statusPanel {
        position: absolute; top: 50px; right: 15px;
        width: 200px; z-index: 15;
        display: flex; flex-direction: column; gap: 6px;
    }
    .sp-row {
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        padding-bottom: 4px;
    }
    .sp-key {
        font-family: var(--sans); font-size: 9px; font-weight: 700;
        letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3);
    }
    .sp-val {
        font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.65);
        letter-spacing: 1px;
    }
    .sp-val.active { color: var(--red); text-shadow: 0 0 8px var(--red); }

    /* ── BAR INDICATORS ── */
    .bar-wrap { width: 80px; height: 3px; background: rgba(255,255,255,0.1); position: relative; }
    .bar-fill {
        height: 100%; background: rgba(255,255,255,0.5);
        transition: width 0.3s ease;
    }
    .bar-fill.danger { background: var(--red); box-shadow: 0 0 6px var(--red); }

    /* ── START BUTTON ── */
    #startBtn {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: none; border: none; color: #fff;
        font-family: var(--sans); font-size: 11px; font-weight: 700;
        letter-spacing: 5px; text-transform: uppercase;
        cursor: pointer; z-index: 20; outline: none;
        padding: 0;
    }
    #startBtn .btn-inner {
        display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    #startBtn .btn-ring {
        width: 80px; height: 80px; position: relative;
        display: flex; align-items: center; justify-content: center;
    }
    .ring-svg { position: absolute; inset: 0; animation: spinRing 4s linear infinite; }
    .ring-svg2 { position: absolute; inset: 6px; animation: spinRing 7s linear infinite reverse; }
    @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #startBtn .btn-text { letter-spacing: 6px; opacity: 0.7; }
    #startBtn:hover .btn-text { opacity: 1; }
    #startBtn:hover .ring-svg { animation-duration: 1.5s; }

    /* ── COMPASS ── */
    #compass {
        position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
        z-index: 15; display: flex; align-items: center; gap: 2px;
    }
    .comp-tick { width: 1px; height: 8px; background: rgba(255,255,255,0.15); }
    .comp-tick.major { height: 14px; background: rgba(255,255,255,0.35); }
    .comp-label { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1px; padding: 0 3px; font-family: var(--sans); font-weight: 700; }
    #compassN { color: var(--red) !important; }

    /* ── THREAT BOX ── */
    #threatBox {
        position: absolute; top: 50%; right: 15px;
        transform: translateY(-50%);
        z-index: 15; width: 180px;
        opacity: 0; transition: opacity 0.4s;
    }
    #threatBox.show { opacity: 1; }
    .tb-header {
        font-family: var(--sans); font-size: 9px; font-weight: 700;
        letter-spacing: 3px; color: var(--red); border-bottom: 1px solid rgba(255,32,32,0.3);
        padding-bottom: 6px; margin-bottom: 8px; text-transform: uppercase;
    }
    .tbi { font-size: 10px; color: rgba(255,255,255,0.65); letter-spacing: 1px; line-height: 2; }
    .tbi-key { color: rgba(255,255,255,0.3); font-size: 9px; }

    /* ── EW ALERT ── */
    #ewAlert {
        position: absolute; top: 50px; right: 220px;
        font-family: var(--sans); font-size: 9px; font-weight: 700;
        letter-spacing: 3px; color: var(--red);
        opacity: 0; transition: opacity 0.2s;
        z-index: 15; text-transform: uppercase;
    }
    #ewAlert.show { opacity: 1; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
/* ─────────────────────────────────────────────────
   COCO-SSD detects 80 classes. We split them into
   threat tiers for color-coded HUD response.
───────────────────────────────────────────────── */
const THREAT = {
    HIGH:   ['person','car','truck','bus','motorcycle','airplane','boat','train'],
    MEDIUM: ['bicycle','horse','cow','dog','cat','bird','sheep','bear','elephant','zebra','giraffe'],
    LOW:    ['backpack','handbag','suitcase','bottle','wine glass','cup','fork','knife',
             'scissors','laptop','cell phone','remote','keyboard','mouse','chair','couch',
             'tv','clock','book','umbrella','fire hydrant','stop sign','parking meter',
             'bench','potted plant','dining table','toilet','bed','refrigerator',
             'oven','microwave','toaster','sink','baseball bat','baseball glove',
             'skateboard','surfboard','tennis racket','sports ball','frisbee',
             'snowboard','skis','kite','skateboard','vase','tie','hair drier',
             'toothbrush','teddy bear','traffic light','orange','apple','sandwich',
             'broccoli','carrot','hot dog','pizza','donut','cake','banana']
};
function getThreat(cls) {
    if (THREAT.HIGH.includes(cls)) return 'HIGH';
    if (THREAT.MEDIUM.includes(cls)) return 'MED';
    return 'LOW';
}

/* ── DOM ── */
const video    = document.getElementById('video');
const canvas   = document.getElementById('hudCanvas');
const ctx      = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const terminal = document.getElementById('terminal');
const cursor   = document.getElementById('cursor');

/* ── State ── */
let model;
let allPredictions = [];
let primaryTarget = null;
let currentPos  = { x: window.innerWidth/2,  y: window.innerHeight/2 };
let targetPos   = { x: window.innerWidth/2,  y: window.innerHeight/2, active: false };
let isLocked    = false;
let lockFactor  = 0;
let pulseTime   = 0;
let scanAngle   = 0;
let textTick    = 0;
let infoLines   = [];
let glitchActive = 0;

/* ── EW State ── */
let ewIntensity = 0;
let ewTimer     = 0;
let ewDecay     = 0;

/* ── Terminal ── */
function ts() {
    const n = new Date();
    return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}

const logQueue = [];
let logBusy = false;

async function typeLog(msg, cls = 'info') {
    await new Promise(res => {
        logQueue.push({ msg, cls, res });
        if (!logBusy) drainLog();
    });
}

async function drainLog() {
    if (logQueue.length === 0) { logBusy = false; return; }
    logBusy = true;
    const { msg, cls, res } = logQueue.shift();
    const entry = document.createElement('div');
    entry.className = `log-entry ${cls}`;

    const tsSpan = document.createElement('span');
    tsSpan.className = 'log-ts';
    tsSpan.textContent = ts();

    const pre = document.createElement('span');
    pre.className = 'log-prefix';
    pre.textContent = '›';

    const txt = document.createElement('span');
    entry.appendChild(tsSpan);
    entry.appendChild(pre);
    entry.appendChild(txt);

    terminal.insertBefore(entry, cursor);
    while (terminal.querySelectorAll('.log-entry').length > 12)
        terminal.removeChild(terminal.querySelector('.log-entry'));

    for (let i = 0; i <= msg.length; i++) {
        txt.textContent = msg.substring(0, i);
        await new Promise(r => setTimeout(r, 18));
    }
    res();
    drainLog();
}

/* ── Clock ── */
setInterval(() => {
    const n = new Date();
    document.getElementById('clockVal').textContent = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}, 1000);

/* ── Fake coords drift ── */
let lat = 55.7558 + (Math.random()-0.5)*0.01;
let lon = 37.6173 + (Math.random()-0.5)*0.01;
setInterval(() => {
    lat += (Math.random()-0.5)*0.00005;
    lon += (Math.random()-0.5)*0.00005;
    const latStr = `${Math.floor(Math.abs(lat))}°${String(Math.floor((Math.abs(lat)%1)*60)).padStart(2,'0')}'${String(((Math.abs(lat)%1*60)%1*60)|0).padStart(2,'0')}"${lat>0?'N':'S'}`;
    const lonStr = `${Math.floor(Math.abs(lon))}°${String(Math.floor((Math.abs(lon)%1)*60)).padStart(2,'0')}'${String(((Math.abs(lon)%1*60)%1*60)|0).padStart(2,'0')}"${lon>0?'E':'W'}`;
    document.getElementById('coordsL').textContent = `LAT ${latStr}  LON ${lonStr}`;
    const hdg = (360 + Math.round(45 + Math.sin(Date.now()/10000)*20)) % 360;
    document.getElementById('coordsR').textContent = `ALT ${180 + Math.round(Math.sin(Date.now()/7000)*5)}m  SPD ${Math.round(12+Math.random()*2)}kts  HDG ${hdg}°`;
}, 1500);

/* ── START ── */
startBtn.onclick = async () => {
    startBtn.style.opacity = '0';
    startBtn.style.transition = 'opacity 0.5s';
    setTimeout(() => startBtn.style.display = 'none', 500);

    document.getElementById('statusPanel').style.display = 'flex';
    document.getElementById('compass').style.display    = 'flex';
    document.getElementById('botbar').style.display     = 'flex';

    await typeLog('BOOT SEQUENCE INITIATED', 'info');
    await typeLog('REQUESTING SENSOR ACCESS..', 'info');

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        await typeLog('OPTICAL SENSOR OK', 'info');
    } catch {
        await typeLog('SENSOR LINK FAILED', 'threat');
        return;
    }

    await typeLog('LOADING NEURAL NETWORK..', 'info');
    model = await cocoSsd.load();
    document.getElementById('modelStat').textContent = 'COCO-SSD';
    document.getElementById('modeVal').textContent   = 'ACTIVE';
    await typeLog('MODEL ONLINE -- 80 CLASS DETECTION', 'info');
    await typeLog('SCANNING...', 'info');

    resize();
    detectLoop();
    draw();
};

/* ── RESIZE ── */
function resize() {
    canvas.width  = window.innerWidth  * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}
window.onresize = resize;

/* ── DETECT ── */
async function detectLoop() {
    if (model && video.readyState >= 3) {
        try {
            allPredictions = await model.detect(video);
            primaryTarget  = allPredictions.length > 0 ? allPredictions[0] : null;
        } catch { /* ignore */ }
    }

    if (primaryTarget) {
        const p = primaryTarget;
        const [x, y, w, h] = p.bbox;
        const sX = window.innerWidth  / (video.videoWidth  || 1);
        const sY = window.innerHeight / (video.videoHeight || 1);
        targetPos.x = (x + w/2) * sX;
        targetPos.y = (y + h/2) * sY;
        targetPos.active = true;

        const dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
        const wasLocked = isLocked;
        isLocked = dist < 130;

        if (isLocked && !wasLocked) {
            textTick = 0;
            buildInfo(p);
            document.getElementById('threatBox').classList.add('show');
            document.getElementById('lockStat').textContent  = p.class.toUpperCase();
            document.getElementById('lockStat').className    = 'sp-val active';
            glitchActive = 12;
            typeLog(`LOCK -- ${p.class.toUpperCase()} [${getThreat(p.class.toLowerCase())}]`, 'threat');
        }
        if (!isLocked && wasLocked) {
            document.getElementById('threatBox').classList.remove('show');
            document.getElementById('lockStat').textContent = '--';
            document.getElementById('lockStat').className   = 'sp-val';
        }

        document.getElementById('objCount').textContent = String(allPredictions.length).padStart(2,'0');
        document.getElementById('targStat').textContent = allPredictions.length;
        document.getElementById('confBar').style.width  = Math.round(p.score*100)+'%';
        document.getElementById('confBar').className    = 'bar-fill' + (isLocked ? ' danger' : '');

    } else {
        targetPos.active = false;
        isLocked = false;
        document.getElementById('objCount').textContent = '00';
        document.getElementById('targStat').textContent = '0';
        document.getElementById('confBar').style.width  = '0%';
        document.getElementById('threatBox').classList.remove('show');
        document.getElementById('lockStat').textContent = '--';
        document.getElementById('lockStat').className   = 'sp-val';
    }
    setTimeout(detectLoop, 80);
}

function buildInfo(p) {
    const tier = getThreat(p.class.toLowerCase());
    infoLines = [
        { k: 'CLASS',    v: p.class.toUpperCase() },
        { k: 'THREAT',   v: tier },
        { k: 'CONF',     v: Math.round(p.score*100)+'%' },
        { k: 'ID',       v: '0x'+Math.random().toString(16).slice(2,8).toUpperCase() },
        { k: 'SECTOR',   v: `${String.fromCharCode(65+Math.floor(Math.random()*6))}${Math.floor(Math.random()*9+1)}` },
        { k: 'STATUS',   v: 'LOCKED' },
    ];
    const tl = document.getElementById('threatLines');
    tl.innerHTML = '';
    infoLines.forEach(l => {
        const row = document.createElement('div');
        row.className = 'tbi';
        row.innerHTML = `<span class="tbi-key">${l.k}</span>  ${l.v}`;
        tl.appendChild(row);
    });
}

/* ─────────────────────────────────────────────────
   DRAW LOOP
───────────────────────────────────────────────── */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;
    const W = canvas.width, H = canvas.height;

    /* Smooth tracking */
    const destX = targetPos.active ? targetPos.x : window.innerWidth/2;
    const destY = targetPos.active ? targetPos.y : window.innerHeight/2;
    currentPos.x += (destX - currentPos.x) * 0.12;
    currentPos.y += (destY - currentPos.y) * 0.12;

    /* Lock factor */
    lockFactor = isLocked
        ? Math.min(1, lockFactor + 0.08)
        : Math.max(0, lockFactor - 0.04);

    pulseTime += 0.05;
    scanAngle += 0.02;

    /* Determine color theme */
    const tier = primaryTarget ? getThreat(primaryTarget.class.toLowerCase()) : null;
    let rr = 255, rg = 255, rb = 255;
    if (isLocked) {
        if (tier === 'HIGH')   { rr=255; rg=20; rb=20; }
        else if (tier==='MED') { rr=255; rg=140; rb=0; }
        else                   { rr=255; rg=220; rb=50; }
    } else {
        rr=200; rg=220; rb=255;
    }
    const alpha = 0.6 + 0.4 * lockFactor;
    const mainColor = `rgba(${rr},${rg},${rb},${alpha})`;

    /* EW effect */
    ewTimer++;
    if (ewTimer % 220 === 0) { ewIntensity = 20; ewDecay = 20; }
    if (ewIntensity > 0) {
        ewIntensity = Math.max(0, ewIntensity - 0.7);
        document.getElementById('ewAlert').classList.add('show');
        document.getElementById('ewBar').style.width = (ewIntensity/20*100)+'%';
        document.getElementById('ewBar').classList.add('danger');
    } else {
        document.getElementById('ewAlert').classList.remove('show');
        document.getElementById('ewBar').style.width = '0%';
        document.getElementById('ewBar').classList.remove('danger');
    }

    ctx.save();

    /* Glitch translation */
    if (glitchActive > 0) {
        ctx.translate((Math.random()-0.5)*12*dpr, (Math.random()-0.5)*6*dpr);
        glitchActive--;
    }
    if (ewIntensity > 5) {
        ctx.translate((Math.random()-0.5)*8*dpr*(ewIntensity/20), 0);
    }

    ctx.strokeStyle = mainColor;
    ctx.fillStyle   = mainColor;
    ctx.shadowBlur  = 8 + 12*lockFactor;
    ctx.shadowColor = mainColor;

    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;

    /* ── ALL secondary detections (dim boxes) ── */
    if (allPredictions.length > 1) {
        ctx.save();
        ctx.shadowBlur = 3;
        for (let i = 1; i < allPredictions.length; i++) {
            const p = allPredictions[i];
            const [bx,by,bw,bh] = p.bbox;
            const sX = window.innerWidth/(video.videoWidth||1);
            const sY = window.innerHeight/(video.videoHeight||1);
            const rx = bx*sX*dpr, ry = by*sY*dpr, rw = bw*sX*dpr, rh = bh*sY*dpr;

            const t = getThreat(p.class.toLowerCase());
            ctx.strokeStyle = t==='HIGH' ? 'rgba(255,80,80,0.4)'
                            : t==='MED'  ? 'rgba(255,160,0,0.35)'
                                         : 'rgba(200,200,255,0.25)';
            ctx.shadowColor = ctx.strokeStyle;
            ctx.lineWidth = 1*dpr;
            ctx.setLineDash([4*dpr,4*dpr]);
            ctx.strokeRect(rx, ry, rw, rh);
            ctx.setLineDash([]);

            ctx.fillStyle = ctx.strokeStyle;
            ctx.font = `${9*dpr}px 'Share Tech Mono'`;
            ctx.fillText(p.class.toUpperCase(), rx+4*dpr, ry-4*dpr);
        }
        ctx.restore();
    }

    /* ── Primary target bounding box ── */
    if (primaryTarget && targetPos.active) {
        const p = primaryTarget;
        const [bx,by,bw,bh] = p.bbox;
        const sX = window.innerWidth/(video.videoWidth||1);
        const sY = window.innerHeight/(video.videoHeight||1);
        const rx=bx*sX*dpr, ry=by*sY*dpr, rw=bw*sX*dpr, rh=bh*sY*dpr;

        ctx.save();
        ctx.strokeStyle = mainColor;
        ctx.shadowColor = mainColor;
        ctx.lineWidth   = 1.5*dpr;
        ctx.shadowBlur  = 10*lockFactor;

        /* Corner bracket box */
        const cLen = Math.min(rw,rh)*0.22;
        ctx.beginPath();
        // TL
        ctx.moveTo(rx, ry+cLen); ctx.lineTo(rx, ry); ctx.lineTo(rx+cLen, ry);
        // TR
        ctx.moveTo(rx+rw-cLen, ry); ctx.lineTo(rx+rw, ry); ctx.lineTo(rx+rw, ry+cLen);
        // BR
        ctx.moveTo(rx+rw, ry+rh-cLen); ctx.lineTo(rx+rw, ry+rh); ctx.lineTo(rx+rw-cLen, ry+rh);
        // BL
        ctx.moveTo(rx+cLen, ry+rh); ctx.lineTo(rx, ry+rh); ctx.lineTo(rx, ry+rh-cLen);
        ctx.stroke();

        /* Dim fill */
        ctx.fillStyle = `rgba(${rr},${rg},${rb},${0.03+0.04*lockFactor})`;
        ctx.fillRect(rx,ry,rw,rh);

        /* Measurement lines */
        if (lockFactor > 0.4) {
            ctx.setLineDash([3*dpr,5*dpr]);
            ctx.lineWidth = 0.5*dpr;
            ctx.strokeStyle = `rgba(${rr},${rg},${rb},0.3)`;
            ctx.beginPath();
            ctx.moveTo(rx-20*dpr, ry); ctx.lineTo(rx-20*dpr, ry+rh);
            ctx.moveTo(rx, ry-12*dpr); ctx.lineTo(rx+rw, ry-12*dpr);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = `rgba(${rr},${rg},${rb},0.5)`;
            ctx.font = `${8*dpr}px 'Share Tech Mono'`;
            ctx.fillText(`${Math.round(rh/dpr)}px`, rx-18*dpr, ry+rh/2, 16*dpr);
            ctx.fillText(`${Math.round(rw/dpr)}px`, rx+rw/2-12*dpr, ry-14*dpr);
        }
        ctx.restore();
    }

    /* ── MAIN RETICLE ── */
    ctx.strokeStyle = mainColor;
    ctx.fillStyle   = mainColor;
    ctx.shadowColor = mainColor;
    ctx.shadowBlur  = 8 + 14*lockFactor;

    drawReticle(cx, cy, dpr, lockFactor, mainColor, rr, rg, rb);

    /* ── Data readout ── */
    if (lockFactor > 0.05) {
        ctx.globalAlpha = lockFactor;
        drawDataBlock(cx, cy, dpr, mainColor);
        ctx.globalAlpha = 1;
    }

    /* ── EW noise ── */
    if (ewIntensity > 3) {
        const n = Math.round(ewIntensity * 0.8);
        for (let i=0; i<n; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.15})`;
            ctx.fillRect(Math.random()*W, Math.random()*H, (1+Math.random()*2)*dpr, dpr);
        }
        /* Random horizontal bars */
        for (let i=0; i<3; i++) {
            const hy = Math.random()*H;
            ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.08})`;
            ctx.fillRect(0, hy, W, (0.5+Math.random())*dpr);
        }
    }

    /* ── Screen-edge corner decorations ── */
    drawCornerDeco(W, H, dpr);

    ctx.restore();
    requestAnimationFrame(draw);
}

/* ─────────────────────────────────────────────────
   RETICLE -- detailed, multi-layer
───────────────────────────────────────────────── */
function drawReticle(cx, cy, dpr, lf, mainColor, rr, rg, rb) {
    ctx.save();
    ctx.translate(cx, cy);

    /* ── 1. Outer thin ring (always) ── */
    ctx.strokeStyle = `rgba(${rr},${rg},${rb},0.2)`;
    ctx.lineWidth   = 0.5 * dpr;
    ctx.shadowBlur  = 0;
    ctx.beginPath();
    ctx.arc(0, 0, 110*dpr, 0, Math.PI*2);
    ctx.stroke();

    /* ── 2. Range rings (pulsing) ── */
    if (lf > 0.1) {
        const pulse = 0.5 + 0.5*Math.sin(pulseTime*2);
        ctx.strokeStyle = `rgba(${rr},${rg},${rb},${0.08 + 0.1*pulse*lf})`;
        ctx.lineWidth   = 0.5*dpr;
        for (const r of [60, 80, 100]) {
            ctx.beginPath();
            ctx.arc(0, 0, r*dpr, 0, Math.PI*2);
            ctx.stroke();
        }
    }

    /* ── 3. Spinning dashed arc ── */
    if (lf > 0.15) {
        ctx.save();
        ctx.rotate(pulseTime * 1.5);
        ctx.strokeStyle = `rgba(${rr},${rg},${rb},${0.3+0.3*lf})`;
        ctx.lineWidth   = 1.5*dpr;
        ctx.shadowBlur  = 6*lf;
        ctx.shadowColor = mainColor;
        ctx.setLineDash([18*dpr, 50*dpr]);
        ctx.beginPath();
        ctx.arc(0, 0, 95*dpr, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
    }

    /* ── 4. Counter-rotating dashed arc ── */
    if (lf > 0.3) {
        ctx.save();
        ctx.rotate(-pulseTime * 0.8);
        ctx.strokeStyle = `rgba(${rr},${rg},${rb},${0.15+0.15*lf})`;
        ctx.lineWidth   = 0.8*dpr;
        ctx.setLineDash([6*dpr, 20*dpr]);
        ctx.beginPath();
        ctx.arc(0, 0, 75*dpr, 0, Math.PI*2);
        ctx.stroke();
        ctx.restore();
    }
    ctx.setLineDash([]);

    /* ── 5. Cardinal brackets (4 corners) ── */
    const bracketSize  = (28 - 8*lf) * dpr;
    const bracketDepth = (8  + 14*lf) * dpr;
    ctx.strokeStyle = mainColor;
    ctx.lineWidth   = 2.5 * dpr;
    ctx.shadowBlur  = 10 * lf;
    ctx.shadowColor = mainColor;

    for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI/2);
        ctx.beginPath();
        ctx.moveTo(bracketSize, -bracketSize + bracketDepth);
        ctx.lineTo(bracketSize, -bracketSize);
        ctx.lineTo(bracketSize - bracketDepth, -bracketSize);
        ctx.stroke();
        ctx.restore();
    }

    /* ── 6. Central cross ── */
    ctx.lineWidth   = 1.5 * dpr;
    ctx.shadowBlur  = 6;
    const c = 7 * dpr;
    const gap = 4 * dpr;
    ctx.beginPath();
    ctx.moveTo(-c, 0); ctx.lineTo(-gap, 0);
    ctx.moveTo(gap, 0); ctx.lineTo(c, 0);
    ctx.moveTo(0, -c); ctx.lineTo(0, -gap);
    ctx.moveTo(0, gap); ctx.lineTo(0, c);
    ctx.stroke();

    /* ── 7. Center dot ── */
    ctx.shadowBlur = 12*lf;
    ctx.beginPath();
    ctx.arc(0, 0, 2.5*dpr, 0, Math.PI*2);
    ctx.fill();

    /* ── 8. Cardinal tick marks ── */
    ctx.strokeStyle = `rgba(${rr},${rg},${rb},0.5)`;
    ctx.lineWidth   = 1 * dpr;
    ctx.shadowBlur  = 0;
    for (let a=0; a<360; a+=15) {
        const rad = a * Math.PI/180;
        const inner = a%90===0 ? 115*dpr : a%45===0 ? 112*dpr : 110.5*dpr;
        const outer = 118*dpr;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rad)*inner, Math.sin(rad)*inner);
        ctx.lineTo(Math.cos(rad)*outer, Math.sin(rad)*outer);
        ctx.stroke();
    }

    /* ── 9. Lock burst lines ── */
    if (lf > 0.5) {
        const burst = (lf-0.5)*2;
        ctx.strokeStyle = `rgba(${rr},${rg},${rb},${0.15*burst})`;
        ctx.lineWidth   = 0.5*dpr;
        for (let a=0; a<360; a+=30) {
            const rad = a * Math.PI/180;
            ctx.beginPath();
            ctx.moveTo(Math.cos(rad)*120*dpr, Math.sin(rad)*120*dpr);
            ctx.lineTo(Math.cos(rad)*(120+30*burst)*dpr, Math.sin(rad)*(120+30*burst)*dpr);
            ctx.stroke();
        }
    }

    /* ── 10. Scan sweep ── */
    const sweepGrad = ctx.createConicalGradient
        ? null
        : null; // fallback: manual arc
    if (lf < 0.8) {
        ctx.save();
        ctx.rotate(scanAngle);
        const sg = ctx.createLinearGradient(0, -100*dpr, 0, 0);
        sg.addColorStop(0, `rgba(${rr},${rg},${rb},0.0)`);
        sg.addColorStop(1, `rgba(${rr},${rg},${rb},${0.08*(1-lf)})`);
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0, 0, 108*dpr, -0.5, 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    ctx.restore();
}

/* ─────────────────────────────────────────────────
   DATA READOUT
───────────────────────────────────────────────── */
function drawDataBlock(cx, cy, dpr, mainColor) {
    textTick += 0.6;
    const fs = 11*dpr;
    ctx.font = `${fs}px 'Share Tech Mono'`;
    ctx.shadowBlur = 4;
    ctx.shadowColor = mainColor;

    infoLines.forEach((l, i) => {
        const chars = Math.floor(textTick - i*4);
        if (chars <= 0) return;
        let line = (l.k+': '+l.v).substring(0, chars);

        /* EW corruption */
        if (ewIntensity > 8 && Math.random() > 0.6) {
            line = line.replace(/[A-Z0-9]/g, c => Math.random()>0.6
                ? String.fromCharCode(33+Math.random()*20) : c);
        }

        ctx.fillText('› '+line, cx + 120*dpr, cy - 30*dpr + i*fs*1.6);
    });

    /* Random glitch line */
    if (Math.random() > 0.85) {
        ctx.globalAlpha = 0.3;
        ctx.fillRect(cx+115*dpr, cy+40*dpr, Math.random()*50*dpr, 1.5*dpr);
        ctx.globalAlpha = 1;
    }
}

/* ─────────────────────────────────────────────────
   CORNER DECORATIONS
───────────────────────────────────────────────── */
function drawCornerDeco(W, H, dpr) {
    const s = 30*dpr, t = 1*dpr;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth   = t;
    ctx.shadowBlur  = 0;
    ctx.setLineDash([]);

    const corners = [[0,0,1,1],[W,0,-1,1],[W,H,-1,-1],[0,H,1,-1]];
    for (const [x,y,sx,sy] of corners) {
        ctx.beginPath();
        ctx.moveTo(x+sx*s, y);
        ctx.lineTo(x, y);
        ctx.lineTo(x, y+sy*s);
        ctx.stroke();
    }

    /* Center horizontal crosshair lines (faint) */
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth   = 0.5*dpr;
    ctx.setLineDash([5*dpr,15*dpr]);
    ctx.beginPath();
    ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
    ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);
}
