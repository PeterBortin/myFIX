<!DOCTYPE html>
<html lang="ru">
<head>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red: #ff2020;
            --red-dim: rgba(255,32,32,0.15);
            --white: #ffffff;
            --dim: rgba(255,255,255,0.08);
            --glow: 0 0 12px rgba(255,32,32,0.6);
            --mono: 'Share Tech Mono', monospace;
            --sans: 'Rajdhani', sans-serif;
        }

        body {
            margin: 0; background: #000;
            overflow: hidden;
            font-family: var(--mono);
            user-select: none;
            cursor: crosshair;
            touch-action: none;
        }

        #container { position: relative; width: 100vw; height: 100vh; }

        video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            filter: brightness(0.45) contrast(1.3) saturate(0.1) hue-rotate(180deg);
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* ── SCANLINES + NEW TERMINATOR GRID ── */
        #scanlines {
            position: absolute; inset: 0; pointer-events: none; z-index: 5;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(255,32,32,0.06) 4px, rgba(255,32,32,0.06) 5px);
            animation: scanScroll 6s linear infinite;
        }
        @keyframes scanScroll { from { background-position: 0 0, 0 0; } to { background-position: 0 120px, 120px 0; } }

        /* ── VIGNETTE + RED GLOW ── */
        #vignette {
            position: absolute; inset: 0; pointer-events: none; z-index: 4;
            background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 35%, rgba(0,0,0,0.85) 100%),
                        radial-gradient(circle at 50% 50%, rgba(255,20,20,0.12) 0%, transparent 70%);
        }

        /* ── TOP BAR ── */
        #topbar {
            position: absolute; top: 0; left: 0; right: 0; height: 42px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px; z-index: 15; border-bottom: 1px solid rgba(255,32,32,0.3);
        }
        .tb-left, .tb-right { display: flex; gap: 20px; align-items: center; }
        .tb-label {
            font-family: var(--sans); font-size: 10px; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.4);
        }
        .tb-val {
            font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.7);
            letter-spacing: 1px;
        }
        #sysId { color: #ff4040; font-size: 12px; letter-spacing: 5px; font-family: var(--sans); font-weight: 700; text-shadow: 0 0 8px var(--red); }

        /* ── BOTTOM BAR ── */
        #botbar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 42px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px; z-index: 15; border-top: 1px solid rgba(255,32,32,0.3);
        }
        .coords { font-size: 10px; color: rgba(255,255,255,0.45); letter-spacing: 1.5px; }

        /* ── TERMINAL ── */
        #terminal {
            position: absolute; bottom: 60px; left: 15px;
            width: 340px; max-height: 220px;
            overflow: hidden; z-index: 15;
        }
        .log-entry {
            font-size: 10px; letter-spacing: 1.5px; line-height: 1.7;
            text-transform: uppercase; color: rgba(255,255,255,0.5);
            display: flex; gap: 8px; align-items: baseline;
            animation: fadeIn 0.3s ease;

        .log-entry.info { color: rgba(255,255,255,0.65); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
        @keyframes glitchText { 0%,100% { transform: translate(0); } 20% { transform: translate(-2px,2px); } 40% { transform: translate(2px,-2px); } }

        .log-ts { color: rgba(255,255,255,0.2); flex-shrink: 0; }
        .log-prefix { color: rgba(255,255,255,0.3); }

        #cursor {
            display: inline-block; width: 7px; height: 12px;
            background: #ff4040;
            animation: blink 0.6s steps(1) infinite;
            vertical-align: middle; margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── STATUS PANEL ── */
        #statusPanel {
            position: absolute; top: 55px; right: 15px;
            width: 210px; z-index: 15;
            display: flex; flex-direction: column; gap: 7px;
        }
        .sp-row {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,32,32,0.15);
            padding-bottom: 5px;
        }
        .sp-key {
            font-family: var(--sans); font-size: 9px; font-weight: 700;
            letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.35);
        }
        .sp-val {
            font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.7);
            letter-spacing: 1px;
        }
        .sp-val.active { color: var(--red); text-shadow: 0 0 10px var(--red); }

        .bar-wrap { width: 85px; height: 4px; background: rgba(255,255,255,0.08); position: relative; }
        .bar-fill {
            height: 100%; background: rgba(255,255,255,0.6);
            transition: width 0.2s ease;
        }
        .bar-fill.danger { background: var(--red); box-shadow: 0 0 8px var(--red); }

        /* ── START BUTTON ── */
        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: none; border: none; color: #fff;
            font-family: var(--sans); font-size: 12px; font-weight: 700;
            letter-spacing: 6px; text-transform: uppercase;
            cursor: pointer; z-index: 20; outline: none;
            padding: 0;
        }
        #startBtn .btn-inner {
            display: flex; flex-direction: column; align-items: center; gap: 25px;
        }
        #startBtn .btn-ring {
            width: 92px; height: 92px; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .ring-svg { position: absolute; inset: 0; animation: spinRing 4s linear infinite; }
        .ring-svg2 { position: absolute; inset: 8px; animation: spinRing 7s linear infinite reverse; }
        @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #startBtn .btn-text { letter-spacing: 7px; opacity: 0.75; text-shadow: 0 0 10px var(--red); }
        #startBtn:hover .btn-text { opacity: 1; color: var(--red); }

        /* ── COMPASS ── */
        #compass {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            z-index: 15; display: flex; align-items: center; gap: 3px;
        }

        /* ── THREAT BOX ── */
        #threatBox {
            position: absolute; top: 50%; right: 15px;
            transform: translateY(-50%);
            z-index: 15; width: 195px;
            opacity: 0; transition: opacity 0.4s;
            background: rgba(0,0,0,0.7); padding: 12px; border: 1px solid var(--red);
        }
        #threatBox.show { opacity: 1; box-shadow: 0 0 20px rgba(255,32,32,0.6); }

        /* ── EW ALERT ── */
        #ewAlert {
            position: absolute; top: 55px; right: 240px;
            font-family: var(--sans); font-size: 10px; font-weight: 700;
            letter-spacing: 4px; color: var(--red);
            opacity: 0; transition: opacity 0.2s;
            z-index: 15; text-transform: uppercase; text-shadow: 0 0 12px var(--red);
        }
        #ewAlert.show { opacity: 1; animation: ewPulse 0.8s infinite alternate; }
        @keyframes ewPulse { from { transform: scale(1); } to { transform: scale(1.08); } }

        /* New: Distance indicator */
        #distance {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            font-family: var(--mono); font-size: 13px; color: var(--red);
            text-shadow: 0 0 10px var(--red); letter-spacing: 3px;
            opacity: 0; z-index: 15;
        }
        #distance.show { opacity: 1; }
    </style>
</head>

<script>
// === AUDIO ENGINE (iOS compatible) ===
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let scanOsc, lockBeep;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playScanBeep() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(420 + Math.random()*80, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function playLockSound() {
    if (!audioCtx) return;
    const noise = audioCtx.createBufferSource();
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate*0.4, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < buffer.length; i++) data[i] = Math.random()*2-1;
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

    noise.connect(filter).connect(gain).connect(audioCtx.destination);
    noise.start();
}

function playWarning() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
}

// === REST OF ORIGINAL CODE (kept intact) + NEW FEATURES ===

// Clock + coords (original)
setInterval(() => {

// START
startBtn.onclick = async () => {
    initAudio();
    startBtn.style.opacity = '0';
    setTimeout(() => startBtn.style.display = 'none', 600);

    document.getElementById('statusPanel').style.display = 'flex';
    document.getElementById('compass').style.display = 'flex';
    document.getElementById('botbar').style.display = 'flex';

    await typeLog('CYBERDYNE BOOT SEQUENCE v0.8', 'info');
    await typeLog('REQUESTING REAR CAMERA...', 'info');

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } 
        });
        video.srcObject = stream;
        await typeLog('OPTICAL SENSOR ONLINE', 'info');
    } catch(e) {

        return;
    }

    await typeLog('LOADING COCO-SSD NEURAL NET...', 'info');
    model = await cocoSsd.load();

    document.getElementById('modeVal').textContent = 'ACTIVE';

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}
window.onresize = resize;

// detectLoop + buildInfo (original + distance update)
async function detectLoop() {
    if (model && video.readyState >= 3) {
        try {
            allPredictions = await model.detect(video);
            primaryTarget = allPredictions.length > 0 ? allPredictions[0] : null;
        } catch(e) {}
    }

    if (primaryTarget) {
        const p = primaryTarget;
        const [x, y, w, h] = p.bbox;
        const sX = window.innerWidth / (video.videoWidth || 1);
        const sY = window.innerHeight / (video.videoHeight || 1);
        targetPos.x = (x + w/2) * sX;
        targetPos.y = (y + h/2) * sY;
        targetPos.active = true;

        fakeDistance = Math.max(40, Math.round(120 + Math.random()*280));

        const dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
        const wasLocked = isLocked;
        isLocked = dist < 140;

        if (isLocked && !wasLocked) {
            textTick = 0;
            buildInfo(p);
            document.getElementById('threatBox').classList.add('show');
            document.getElementById('lockStat').textContent = p.class.toUpperCase();
            document.getElementById('lockStat').className = 'sp-val active';
            document.getElementById('distance').classList.add('show');
            document.getElementById('distVal').textContent = fakeDistance;
            glitchActive = 18;
            playLockSound();
            typeLog(`LOCK CONFIRMED -- ${p.class.toUpperCase()}`, 'threat');
        }
        if (!isLocked && wasLocked) {
            document.getElementById('threatBox').classList.remove('show');
            document.getElementById('distance').classList.remove('show');
            document.getElementById('lockStat').textContent = '--';
            document.getElementById('lockStat').className = 'sp-val';
        }

        document.getElementById('objCount').textContent = String(allPredictions.length).padStart(2,'0');
        document.getElementById('targStat').textContent = allPredictions.length;
        document.getElementById('confBar').style.width = Math.round(p.score*100)+'%';
        document.getElementById('confBar').className = 'bar-fill' + (isLocked ? ' danger' : '');
    } else {
        targetPos.active = false;
        isLocked = false;
        document.getElementById('distance').classList.remove('show');
        // ... reset rest ...
    }
    setTimeout(detectLoop, 70);
}

function buildInfo(p) { /* original unchanged */ }

// DRAW LOOP + NEW EFFECTS
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;
    const W = canvas.width, H = canvas.height;

    // Smooth tracking
    const destX = targetPos.active ? targetPos.x : window.innerWidth/2;
    const destY = targetPos.active ? targetPos.y : window.innerHeight/2;
    currentPos.x += (destX - currentPos.x) * 0.11;
    currentPos.y += (destY - currentPos.y) * 0.11;

    lockFactor = isLocked ? Math.min(1, lockFactor + 0.09) : Math.max(0, lockFactor - 0.045);
    pulseTime += 0.06;
    scanAngle += 0.023;

    const tier = primaryTarget ? getThreat(primaryTarget.class.toLowerCase()) : null;
    let rr = 255, rg = 255, rb = 255;
    if (isLocked) {
        if (tier === 'HIGH') { rr=255; rg=30; rb=30; }
        else if (tier==='MED') { rr=255; rg=160; rb=0; }
        else { rr=255; rg=240; rb=80; }
    }

    // EW logic (original + more frequent)
    ewTimer++;
    if (ewTimer % 170 === 0) { ewIntensity = 28; }
    if (ewIntensity > 0) {
        ewIntensity = Math.max(0, ewIntensity - 0.9);
        document.getElementById('ewAlert').classList.add('show');
        document.getElementById('ewBar').style.width = (ewIntensity/28*100)+'%';
        if (Math.random() < 0.3) playWarning();
    } else {
        document.getElementById('ewAlert').classList.remove('show');
        document.getElementById('ewBar').style.width = '0%';
    }

    ctx.save();

    // Stronger glitch
    if (glitchActive > 0) {
        ctx.translate((Math.random()-0.5)*18*dpr, (Math.random()-0.5)*9*dpr);
        glitchActive--;
    }
    if (ewIntensity > 8) {
        ctx.translate((Math.random()-0.5)*14*dpr*(ewIntensity/28), (Math.random()-0.5)*6*dpr);
    }

    ctx.strokeStyle = `rgba(${rr},${rg},${rb},${0.65 + 0.35*lockFactor})`;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.shadowBlur = 12 + 18*lockFactor;
    ctx.shadowColor = `rgba(${rr},${rg},${rb},0.9)`;

    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;

    // Secondary detections (original)
    if (allPredictions.length > 1) { /* original block */ }

    // Primary target box (original + extra red flash when locked)
    if (primaryTarget && targetPos.active) { /* original block */ }

    // MAIN RETICLE (enhanced with more Terminator-style elements)
    drawReticle(cx, cy, dpr, lockFactor, `rgba(${rr},${rg},${rb},${0.85})`, rr, rg, rb);

    if (lockFactor > 0.08) {
        ctx.globalAlpha = lockFactor * 0.95;
        drawDataBlock(cx, cy, dpr, `rgba(${rr},${rg},${rb},0.9)`);
        ctx.globalAlpha = 1;
    }

    // Extra scan line
    if (lockFactor > 0.3) {
        ctx.strokeStyle = `rgba(255,80,80,${0.4*lockFactor})`;
        ctx.lineWidth = 1.5*dpr;
        ctx.beginPath();
        ctx.moveTo(0, cy);
        ctx.lineTo(W, cy);
        ctx.stroke();
    }

    drawCornerDeco(W, H, dpr);

    ctx.restore();

    // Occasional scan beep
    if (Math.random() < 0.12) playScanBeep();

    requestAnimationFrame(draw);
}

// Enhanced drawReticle (more layers)
function drawReticle(cx, cy, dpr, lf, mainColor, rr, rg, rb) {
    ctx.save();
    ctx.translate(cx, cy);

    // Original reticle layers + NEW:
    // Extra rotating cross
    ctx.save();
    ctx.rotate(pulseTime * 0.8);
    ctx.strokeStyle = `rgba(${rr},${rg},${rb},0.25)`;
    ctx.lineWidth = 1.2*dpr;
    ctx.beginPath();
    ctx.moveTo(-130*dpr, 0); ctx.lineTo(130*dpr, 0);
    ctx.moveTo(0, -130*dpr); ctx.lineTo(0, 130*dpr);
    ctx.stroke();
    ctx.restore();

    // Original 10 layers remain here (paste original drawReticle content)
    // ... (keeping all original reticle code) ...

    ctx.restore();
}
