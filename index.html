<!DOCTYPE html>
<!-- myFIX v2 // T-800 + PREDATOR + MONO-HALFTONE + 8-BIT GB // gallery, WebM rec, pinch-zoom, freeze // MediaPipe ObjectDetector + Pose + Face // single-file, CDN-only, mobile-first -->
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>myFIX v2</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --red: #ff2020;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
}
html, body { overscroll-behavior: none; height: 100%; }
body {
    margin: 0; background: #000; overflow: hidden;
    font-family: var(--mono); user-select: none; -webkit-user-select: none; cursor: crosshair;
}
#container { position: relative; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }

/* Відео — fallback-шар, коли WebGL живий, ховається (opacity 0), але грає як texture source */
video {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: brightness(0.45) contrast(1.3) saturate(0.1) hue-rotate(180deg);
    transition: opacity 0.4s;
}
#glCanvas  { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; background: #000; }
#hudCanvas { position: absolute; inset: 0; z-index: 6; width: 100%; height: 100%; pointer-events: none; }

#scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
    animation: scanScroll 8s linear infinite;
}
@keyframes scanScroll { from{background-position:0 0} to{background-position:0 100px} }

#vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
}

/* BOTTOM BAR */
#botbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
    z-index: 16; border-top: 1px solid rgba(255,255,255,0.07);
}
#botLeft  { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
#botRight { display: flex; gap: 8px; flex-shrink: 0; }
.coords { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hudBtn {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.7); font-family: var(--sans);
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    padding: 8px 12px; cursor: pointer; text-transform: uppercase; touch-action: manipulation;
}
.hudBtn.on { border-color: var(--red); color: var(--red); text-shadow: 0 0 8px var(--red); box-shadow: inset 0 0 10px rgba(255,32,32,0.2); }
.hudBtn.off { opacity: 0.35; text-decoration: line-through; }
.hudBtn:disabled { opacity: 0.15; }

/* TERMINAL */
#terminal {
    position: absolute; bottom: calc(78px + env(safe-area-inset-bottom)); left: 15px;
    width: 280px; max-height: 180px; overflow: hidden; z-index: 15; pointer-events: none;
}
.log-entry {
    font-size: 10px; letter-spacing: 1.5px; line-height: 1.8;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    display: flex; gap: 8px; align-items: baseline; animation: fadeIn 0.3s ease;
}
.log-entry.threat { color: var(--red); }
.log-entry.info   { color: rgba(255,255,255,0.6); }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1} }
.log-ts     { color: rgba(255,255,255,0.2); flex-shrink: 0; }
.log-prefix { color: rgba(255,255,255,0.25); }
#cursor {
    display: inline-block; width: 7px; height: 12px;
    background: rgba(255,255,255,0.5); animation: blink 0.8s steps(1) infinite;
    vertical-align: middle; margin-left: 2px;
}
@keyframes blink { 50%{opacity:0} }

/* STATUS PANEL */
#statusPanel {
    position: absolute; top: 15px; right: 15px;
    width: 185px; z-index: 15; display: flex; flex-direction: column; gap: 5px;
}
.sp-row {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 4px;
}
.sp-key {
    font-family: var(--sans); font-size: 9px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3);
}
.sp-val { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.65); letter-spacing: 1px; }
.sp-val.active { color: var(--red); text-shadow: 0 0 8px var(--red); }
.bar-wrap { width: 80px; height: 3px; background: rgba(255,255,255,0.1); }
.bar-fill { height: 100%; background: rgba(255,255,255,0.5); transition: width 0.3s; }
.bar-fill.danger { background: var(--red); box-shadow: 0 0 6px var(--red); }

/* START */
#startBtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: none; border: none; color: #fff;
    font-family: var(--sans); font-size: 11px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase;
    cursor: pointer; z-index: 20; outline: none; padding: 0;
}
#startBtn .btn-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }
#startBtn .btn-ring  { width: 80px; height: 80px; position: relative; display: flex; align-items: center; justify-content: center; }
.ring-svg  { position: absolute; inset: 0;   animation: spinRing 4s linear infinite; }
.ring-svg2 { position: absolute; inset: 6px; animation: spinRing 7s linear infinite reverse; }
@keyframes spinRing { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
#startBtn .btn-text { letter-spacing: 6px; opacity: 0.7; }
#startBtn:hover .btn-text { opacity: 1; }
#startBtn:hover .ring-svg  { animation-duration: 1.5s; }

/* EW */
#ewAlert {
    position: absolute; top: 15px; right: 210px;
    font-family: var(--sans); font-size: 9px; font-weight: 700;
    letter-spacing: 3px; color: var(--red);
    opacity: 0; transition: opacity 0.2s; z-index: 15; text-transform: uppercase;
}
#ewAlert.show { opacity: 1; }

/* THREAT / COMPOSITE BOX */
#threatBox {
    position: absolute; top: 50%; right: 15px; transform: translateY(-50%);
    z-index: 15; width: 175px; opacity: 0; transition: opacity 0.4s; pointer-events: none;
}
#threatBox.show { opacity: 1; }
.tb-header {
    font-family: var(--sans); font-size: 9px; font-weight: 700;
    letter-spacing: 3px; color: var(--red);
    border-bottom: 1px solid rgba(255,32,32,0.3);
    padding-bottom: 6px; margin-bottom: 8px; text-transform: uppercase;
}
.tbi { font-size: 10px; color: rgba(255,255,255,0.65); letter-spacing: 1px; line-height: 1.9; display: flex; justify-content: space-between; gap: 8px; }
.tbi-key { color: rgba(255,255,255,0.3); font-size: 9px; }
.tbi-red { color: var(--red); text-shadow: 0 0 5px var(--red); }
.tb-sub {
    font-family: var(--sans); font-size: 8px; font-weight: 700; letter-spacing: 2px;
    color: rgba(255,255,255,0.28); text-transform: uppercase;
    margin: 7px 0 3px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 5px;
}

/* CAPTURE CARD */
#captureCard {
    position: absolute; top: 14px; left: 14px;
    z-index: 20; display: flex; flex-direction: row;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    filter: drop-shadow(0 0 8px rgba(255,32,32,0.35));
}
#captureCard.show { opacity: 1; pointer-events: auto; }
#portraitWrap {
    position: relative; width: 130px; height: 130px; flex-shrink: 0;
    background: #000; border: 1px solid rgba(255,32,32,0.5); overflow: hidden;
}
#portraitCanvas { width: 100%; height: 100%; display: block; }
#portraitCanvas.rawlook { filter: brightness(1.1) contrast(1.25) saturate(0.12) hue-rotate(180deg); }
.pcorner {
    position: absolute; width: 9px; height: 9px;
    border-color: var(--red); border-style: solid; z-index: 2;
}
.pcorner.tl { top:3px;    left:3px;   border-width: 1.5px 0 0 1.5px; }
.pcorner.tr { top:3px;    right:3px;  border-width: 1.5px 1.5px 0 0; }
.pcorner.bl { bottom:3px; left:3px;   border-width: 0 0 1.5px 1.5px; }
.pcorner.br { bottom:3px; right:3px;  border-width: 0 1.5px 1.5px 0; }
#pScanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.22) 2px, rgba(0,0,0,0.22) 3px);
}
#pCross {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
}
#pCross::before {
    content: ''; width: 16px; height: 16px;
    border: 1px solid rgba(255,32,32,0.5); border-radius: 50%;
}
#pStamp {
    position: absolute; bottom: 4px; left: 4px; right: 4px; z-index: 5;
    font-size: 7px; font-family: var(--mono);
    color: rgba(255,32,32,0.65); letter-spacing: 0.8px;
    display: flex; justify-content: space-between;
}
#capturedFlash {
    position: absolute; inset: 0; z-index: 6;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    letter-spacing: 4px; color: var(--red); text-transform: uppercase;
    opacity: 0; pointer-events: none;
}
#capturedFlash.flash { animation: capFlash 0.9s ease forwards; }
@keyframes capFlash { 0%{opacity:1} 60%{opacity:0.7} 100%{opacity:0} }
#captureMeta {
    width: 158px; background: rgba(0,0,0,0.82);
    border: 1px solid rgba(255,32,32,0.25); border-left: none;
    padding: 7px 9px; display: flex; flex-direction: column; gap: 0;
}
.cm-header {
    font-family: var(--sans); font-size: 8px; font-weight: 700;
    letter-spacing: 3px; color: var(--red);
    border-bottom: 1px solid rgba(255,32,32,0.3);
    padding-bottom: 5px; margin-bottom: 5px; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
}
.cm-blink { width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: blink 0.6s steps(1) infinite; }
.cm-row {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid rgba(255,255,255,0.04); padding: 2.5px 0;
}
.cm-key {
    font-family: var(--sans); font-size: 8px; font-weight: 700;
    letter-spacing: 1.8px; color: rgba(255,255,255,0.25);
    text-transform: uppercase; flex-shrink: 0;
}
.cm-val { font-family: var(--mono); font-size: 9px; color: rgba(255,255,255,0.65); letter-spacing: 0.8px; text-align: right; }
.cm-val.red { color: var(--red); text-shadow: 0 0 5px var(--red); }

/* TAP HINT */
#tapHint {
    position: absolute; bottom: calc(140px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.32);
    z-index: 15; pointer-events: none; opacity: 0; transition: opacity 0.4s;
    white-space: nowrap; animation: hintPulse 2s ease-in-out infinite;
}
#tapHint.show { opacity: 1; }
@keyframes hintPulse { 0%,100%{opacity:0.32} 50%{opacity:0.65} }
#tapHint::before { content: '[ '; color: var(--red); }
#tapHint::after  { content: ' ]'; color: var(--red); }

/* FLASH */
#flashOverlay { position: absolute; inset: 0; z-index: 50; background: rgba(255,255,255,0); pointer-events: none; }
#flashOverlay.flash { animation: scrFlash 0.25s ease forwards; }
@keyframes scrFlash { 0%{background:rgba(255,255,255,0.2)} 100%{background:rgba(255,255,255,0)} }

/* MONO: світлий LCD 90-х */
body.mono { --red: #14110b; background: #eceae2; }
body.mono .sp-key { color: rgba(38,34,24,0.5); }
body.mono .sp-val { color: rgba(38,34,24,0.85); }
body.mono .sp-val.active { text-shadow: none; }
body.mono .bar-wrap { background: rgba(38,34,24,0.15); }
body.mono .bar-fill { background: rgba(38,34,24,0.7); }
body.mono .bar-fill.danger { box-shadow: none; }
body.mono .log-entry, body.mono .log-entry.info { color: rgba(38,34,24,0.75); }
body.mono .log-ts { color: rgba(38,34,24,0.35); }
body.mono .log-prefix { color: rgba(38,34,24,0.4); }
body.mono #cursor { background: rgba(38,34,24,0.7); }
body.mono .coords { color: rgba(38,34,24,0.55); }
body.mono .hudBtn { border-color: rgba(38,34,24,0.4); color: rgba(38,34,24,0.85); background: rgba(236,234,226,0.6); }
body.mono .hudBtn.on { text-shadow: none; box-shadow: none; }
body.mono #botbar { background: linear-gradient(to top, rgba(236,234,226,0.85), transparent); border-top-color: rgba(38,34,24,0.2); }
body.mono #scanlines { background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(38,34,24,0.07) 3px, rgba(38,34,24,0.07) 4px); }
body.mono #vignette { opacity: 0.3; }
body.mono #tapHint { color: rgba(38,34,24,0.6); }
body.mono .tbi { color: rgba(38,34,24,0.8); }
body.mono .tbi-key { color: rgba(38,34,24,0.4); }
body.mono .tbi-red { text-shadow: none; }
body.mono .tb-sub { color: rgba(38,34,24,0.45); border-top-color: rgba(38,34,24,0.15); }
body.mono .tb-header { border-bottom-color: rgba(38,34,24,0.3); }
body.mono #captureCard { filter: drop-shadow(0 0 6px rgba(38,34,24,0.3)); }
body.mono #portraitWrap { border-color: rgba(38,34,24,0.55); }
body.mono #pScanlines { background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(38,34,24,0.1) 2px, rgba(38,34,24,0.1) 3px); }
body.mono #pCross::before { border-color: rgba(38,34,24,0.5); }
body.mono #pStamp { color: rgba(38,34,24,0.8); }
body.mono #captureMeta { background: rgba(236,234,226,0.92); border-color: rgba(38,34,24,0.35); }
body.mono .cm-header { border-bottom-color: rgba(38,34,24,0.3); }
body.mono .cm-key { color: rgba(38,34,24,0.45); }
body.mono .cm-val { color: rgba(38,34,24,0.85); }
body.mono .cm-val.red { text-shadow: none; }

/* ГАЛЕРЕЯ */
#galleryPanel { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.9); display: none; flex-direction: column; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
#galleryPanel.show { display: flex; }
.gp-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: 3px; color: var(--red); border-bottom: 1px solid rgba(255,32,32,0.3); padding-bottom: 8px; margin-bottom: 12px; text-transform: uppercase; }
#galGrid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; align-content: start; }
.gp-cell { display: flex; flex-direction: column; gap: 4px; }
.gp-cell img, .gp-cell video { width: 100%; aspect-ratio: 1 / 1.09; object-fit: cover; border: 1px solid rgba(255,32,32,0.35); display: block; background: #000; }
.gp-row { display: flex; gap: 4px; }
.gp-btn { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.75); font-family: var(--sans); font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 6px 0; cursor: pointer; }
.gp-empty { grid-column: 1 / -1; font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 2px; padding: 30px 0; text-align: center; }
#recBtn.rec { border-color: var(--red); color: var(--red); animation: blink 1s steps(1) infinite; }

/* 8-BIT: піксельний шрифт і GB-зелень для DOM */
body.gb { --red: #9bbc0f; }
body.gb .log-entry, body.gb .log-entry.info { color: rgba(139,172,15,0.85); }
body.gb .sp-key { color: rgba(139,172,15,0.5); }
body.gb .sp-val { color: rgba(155,188,15,0.9); }
body.gb .coords { color: rgba(139,172,15,0.6); }
body.gb .log-entry, body.gb .sp-key, body.gb .sp-val, body.gb .coords, body.gb .hudBtn, body.gb .tb-header, body.gb .tbi, body.gb .tbi-key, body.gb .cm-key, body.gb .cm-val, body.gb #tapHint, body.gb .gp-head, body.gb .gp-btn { font-family: 'Press Start 2P', var(--mono); }
body.gb .log-entry { font-size: 8px; letter-spacing: 0; line-height: 2.1; }
body.gb .sp-key, body.gb .tbi-key, body.gb .cm-key { font-size: 6px; letter-spacing: 0.5px; }
body.gb .sp-val, body.gb .cm-val, body.gb .tbi { font-size: 7px; letter-spacing: 0; }
body.gb .coords { font-size: 6px; letter-spacing: 0; }
body.gb .hudBtn, body.gb #tapHint { font-size: 8px; letter-spacing: 0; }

@media (max-width: 560px) { #botLeft { display: none; } }

@media (max-width: 480px) {
    #coordsR { display: none; }
    #statusPanel { width: 160px; }
    #threatBox { width: 150px; right: 10px; }
    #captureMeta { width: 146px; }
}
</style>
</head>
<body>
<div id="container">

    <video id="video" autoplay playsinline muted></video>
    <canvas id="glCanvas"></canvas>
    <canvas id="hudCanvas"></canvas>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <button id="startBtn">
        <div class="btn-inner">
            <div class="btn-ring">
                <svg class="ring-svg" viewBox="0 0 80 80" fill="none">
                    <circle cx="40" cy="40" r="36" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="8 4"/>
                    <circle cx="40" cy="40" r="36" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-dasharray="20 160" stroke-linecap="round"/>
                </svg>
                <svg class="ring-svg2" viewBox="0 0 68 68" fill="none">
                    <circle cx="34" cy="34" r="30" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="3 6"/>
                </svg>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="2" fill="white" opacity="0.9"/>
                    <line x1="12" y1="4"  x2="12" y2="8"  stroke="white" stroke-width="1.5" opacity="0.6"/>
                    <line x1="12" y1="16" x2="12" y2="20" stroke="white" stroke-width="1.5" opacity="0.6"/>
                    <line x1="4"  y1="12" x2="8"  y2="12" stroke="white" stroke-width="1.5" opacity="0.6"/>
                    <line x1="16" y1="12" x2="20" y2="12" stroke="white" stroke-width="1.5" opacity="0.6"/>
                </svg>
            </div>
            <span class="btn-text">initialize system</span>
        </div>
    </button>

    <div id="flashOverlay"></div>

    <div id="captureCard">
        <div id="portraitWrap">
            <canvas id="portraitCanvas"></canvas>
            <div class="pcorner tl"></div>
            <div class="pcorner tr"></div>
            <div class="pcorner bl"></div>
            <div class="pcorner br"></div>
            <div id="pScanlines"></div>
            <div id="pCross"></div>
            <div id="pStamp">
                <span id="pStampTime">--:--:--</span>
                <span id="pStampId">ID:------</span>
            </div>
            <div id="capturedFlash">CAPTURED</div>
        </div>
        <div id="captureMeta">
            <div class="cm-header"><span>SUBJ DATA</span><div class="cm-blink"></div></div>
            <div id="cmRows"></div>
        </div>
    </div>

    <div id="tapHint">TAP TO CAPTURE</div>

    <div id="galleryPanel">
        <div class="gp-head"><span>// captures</span><button class="hudBtn" id="galClose">X</button></div>
        <div id="galGrid"></div>
    </div>

    <div id="statusPanel" style="display:none">
        <div class="sp-row"><span class="sp-key">network</span><span class="sp-val active">ONLINE</span></div>
        <div class="sp-row"><span class="sp-key">model</span><span class="sp-val" id="modelStat">LOADING</span></div>
        <div class="sp-row"><span class="sp-key">vision</span><span class="sp-val" id="visVal">T-800</span></div>
        <div class="sp-row"><span class="sp-key">mode</span><span class="sp-val" id="modeVal">PASSIVE</span></div>
        <div class="sp-row"><span class="sp-key">objects</span><span class="sp-val" id="objCount">00</span></div>
        <div class="sp-row"><span class="sp-key">lock</span><span class="sp-val" id="lockStat">--</span></div>
        <div class="sp-row"><span class="sp-key">conf</span><div class="bar-wrap"><div class="bar-fill" id="confBar" style="width:0%"></div></div></div>
        <div class="sp-row"><span class="sp-key">ew</span><div class="bar-wrap"><div class="bar-fill" id="ewBar" style="width:0%"></div></div></div>
        <div class="sp-row"><span class="sp-key">captures</span><span class="sp-val" id="captureStat">0</span></div>
    </div>

    <div id="ewAlert">⚠ EW INTERFERENCE</div>

    <div id="threatBox">
        <div class="tb-header">// target acquired</div>
        <div id="threatLines"></div>
    </div>

    <div id="terminal"><span id="cursor"></span></div>

        this.nz(t + 0.05, 0.85, 0.06, 'bandpass', on ? 4200 : 900, on ? 900 : 4200, 3);
        this.osc('sine', 95, 42, t + 0.8, 0.3, 0.09);
    },
    triPing(){
        if (!this.ctx) return; const t = this.now();
        [620, 830, 1080].forEach((f, i) => this.osc('square', f, f, t + i * 0.09, 0.055, 0.05));
    },
    monoSwap(){
        /* матричний принтер: черга тіків + дзвіночок каретки */
        if (!this.ctx) return; const t = this.now();
        for (let i = 0; i < 9; i++) this.osc('square', 2400 - i * 90, 2400 - i * 90, t + i * 0.045, 0.02, 0.04);
        this.osc('sine', 1568, 1568, t + 0.48, 0.25, 0.06);
    },
    gbBoot(){
        /* клік картриджа + фірмове "по-лінь" */
        if (!this.ctx) return; const t = this.now();
        this.nz(t, 0.03, 0.06, 'highpass', 2000, 0, 1);
        this.osc('square', 587, 587, t + 0.06, 0.08, 0.07);
        this.osc('square', 1175, 1175, t + 0.16, 0.22, 0.07);
    },
    coin(){
        if (!this.ctx) return; const t = this.now();
        this.osc('square', 988, 988, t, 0.06, 0.05);
        this.osc('square', 1319, 1319, t + 0.06, 0.16, 0.05);
    },
    inkTick(){
        if (!this.ctx) return; const t = this.now();
        this.osc('square', 1900, 1900, t, 0.02, 0.04);
        this.osc('square', 1300, 1300, t + 0.09, 0.03, 0.035);
    },
    scoreJingle(){
        if (!this.ctx) return; const t = this.now();
        [784, 988, 1319].forEach((f, i) => this.osc('square', f, f, t + i * 0.06, 0.05, 0.06));
    },
    bossJingle(){
        if (!this.ctx) return; const t = this.now();
        [392, 392, 311, 466].forEach((f, i) => this.osc('square', f, f, t + i * 0.11, 0.09, 0.07));
    },
    freezeSnd(on){
        if (!this.ctx) return; const t = this.now();
        if (on){ this.osc('sawtooth', 420, 70, t, 0.22, 0.06); this.nz(t, 0.03, 0.05, 'highpass', 2500, 0, 1); }
        else this.osc('sawtooth', 70, 420, t, 0.2, 0.05);
    },
    recSnd(on){
        if (!this.ctx) return; const t = this.now();
        if (on){ this.osc('square', 900, 900, t, 0.05, 0.05); this.osc('square', 1200, 1200, t + 0.08, 0.06, 0.05); }
        else this.osc('square', 600, 600, t, 0.09, 0.05);
    },
    swapFor(v){
        if (v === 1) this.visionSwap(true);
        else if (v === 2) this.monoSwap();
        else if (v === 3) this.gbBoot();
        else this.visionSwap(false);
    },
    pingFor(v){
        if (v === 1) this.triPing();
        else if (v === 2) this.inkTick();
        else if (v === 3) this.coin();
        else this.ping();
    },
    humStart(){
        if (!this.ctx || this.hum) return;
        const g = this.ctx.createGain(); g.gain.value = 0.012;
        const o1 = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
        o1.frequency.value = 55; o2.frequency.value = 55.7;
        o1.connect(g); o2.connect(g); g.connect(this.master);
        o1.start(); o2.start(); this.hum = g;
    },
    droneSet(on){
        if (!this.ctx) return;
        if (!this.drone){
            const o = this.ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 48;
            const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
            const g = this.ctx.createGain(); g.gain.value = 0;
            o.connect(f); f.connect(g); g.connect(this.master); o.start();
            this.drone = g;
        }
        this.drone.gain.setTargetAtTime(on ? 0.03 : 0, this.now(), 0.4);
    },
    setMute(m){ if (!this.ctx) return; this.on = !m; this.master.gain.setTargetAtTime(m ? 0 : 0.6, this.now(), 0.05); }
};

}
const logQ = []; let logBusy = false;

}
async function drainLog(){
    if (!logQ.length){ logBusy = false; return; }

    const { msg, cls, res } = logQ.shift();
    AU.tick();
    const e = document.createElement('div'); e.className = 'log-entry ' + cls;
    const t = document.createElement('span'); t.className = 'log-ts'; t.textContent = ts();

        await new Promise(r => setTimeout(r, 16));
    }
    res(); drainLog();
}

/* ── WebGL: OPTICAL/THERMAL в одному шейдері + wipe-перехід ── */
const FRAG = `
precision mediump float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uUVScale;
uniform vec2 uUVOff;
uniform float uA;
uniform float uB;
uniform float uWipe;
uniform float uTime;
uniform float uEW;
uniform vec2 uRes;
uniform vec2 uPixels; /* x: mono halftone, y: 8bit */
uniform float uSob;   /* крок градієнта контурів, px */
uniform float uZoom;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

vec3 palette(float t){
    vec3 c = mix(vec3(0.02, 0.0, 0.16), vec3(0.16, 0.0, 0.43), smoothstep(0.0, 0.18, t));
    c = mix(c, vec3(0.51, 0.0, 0.63), smoothstep(0.18, 0.35, t));
    c = mix(c, vec3(0.86, 0.08, 0.24), smoothstep(0.35, 0.50, t));
    c = mix(c, vec3(1.0, 0.35, 0.0),  smoothstep(0.50, 0.65, t));
    c = mix(c, vec3(1.0, 0.75, 0.0),  smoothstep(0.65, 0.80, t));
    c = mix(c, vec3(1.0, 1.0, 0.47),  smoothstep(0.80, 0.92, t));
    c = mix(c, vec3(1.0, 1.0, 1.0),   smoothstep(0.92, 1.0, t));
    return c;
}

float Bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
float Bayer4(vec2 a){ return Bayer2(0.5 * a) * 0.25 + Bayer2(a); }

/* екранна норм-координата -> текстурна, з урахуванням цифрового зуму */
vec2 zuv(vec2 s){ return ((s - 0.5) / uZoom + 0.5) * uUVScale + uUVOff; }
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

vec3 modePick(float m, vec3 o, vec3 t, vec3 mo, vec3 g){
    vec3 c = mix(o, t, clamp(m, 0.0, 1.0));
    c = mix(c, mo, clamp(m - 1.0, 0.0, 1.0));
    c = mix(c, g,  clamp(m - 2.0, 0.0, 1.0));
    return c;
}

void main(){
    float band = step(0.965, hash(vec2(floor(vUV.y * 48.0), floor(uTime * 9.0)))) * uEW;
    float off = (hash(vec2(floor(vUV.y * 48.0), floor(uTime * 31.0))) - 0.5) * 0.09 * band;
    vec2 uv = zuv(vUV);
    uv.x += off;
    vec3 c = texture2D(uTex, uv).rgb;
    float l = lum(c);

    /* 0 T-800: червоний градинг, легкий, з тінями */
    vec3 ob = mix(vec3(l), c, 0.15);
    ob = clamp((ob - 0.5) * 1.3 + 0.5, 0.0, 1.0);
    vec3 opt = ob * vec3(0.86, 0.30, 0.26) + vec3(0.05, 0.0, 0.0);

    /* 1 PREDATOR */
    float lt = pow(clamp(l * 1.15, 0.0, 1.0), 0.8);
    lt += (hash(vUV * vec2(431.0, 917.0) + uTime * 3.0) - 0.5) * 0.05;
    vec3 thr = palette(clamp(lt, 0.0, 1.0));

    /* 2 MONO: газетний halftone під 45 + градієнтні контури (Sobel-хрест) */
    mat2 Rf = mat2(0.7071, 0.7071, -0.7071, 0.7071);
    mat2 Ri = mat2(0.7071, -0.7071, 0.7071, 0.7071);
    vec2 pr = Rf * gl_FragCoord.xy;
    vec2 cM = floor(pr / uPixels.x);
    vec2 ctr = Ri * ((cM + 0.5) * uPixels.x);
    vec2 um = zuv(ctr / uRes);
    um.x += off;
    float lq = lum(texture2D(uTex, um).rgb);
    lq = clamp((lq - 0.5) * 1.25 + 0.56, 0.0, 1.0);
    float dk = 1.0 - lq;
    vec2 fM = pr / uPixels.x - (cM + 0.5);
    float dotInk = step(length(fM), sqrt(dk) * 0.72);
    vec2 e = vec2(uSob) / uRes;
    float gx = lum(texture2D(uTex, zuv(vUV + vec2(e.x, 0.0))).rgb) - lum(texture2D(uTex, zuv(vUV - vec2(e.x, 0.0))).rgb);
    float gy = lum(texture2D(uTex, zuv(vUV + vec2(0.0, e.y))).rgb) - lum(texture2D(uTex, zuv(vUV - vec2(0.0, e.y))).rgb);
    float edge = smoothstep(0.13, 0.32, length(vec2(gx, gy)));
    float ink = max(dotInk, edge);
    vec3 mono = mix(vec3(0.93, 0.92, 0.88), vec3(0.20, 0.18, 0.13), ink);

    /* 3 8-BIT: Game Boy DMG — 4 зелені + LCD-сітка */
    vec2 cG = floor(gl_FragCoord.xy / uPixels.y);
    vec2 uvG = zuv((cG * uPixels.y + uPixels.y * 0.5) / uRes);
    uvG.x += off;
    float l8 = lum(texture2D(uTex, uvG).rgb);
    l8 = clamp((l8 - 0.5) * 1.25 + 0.55, 0.0, 1.0);
    float lv = clamp(floor(l8 * 4.0 + Bayer4(cG) * 0.9), 0.0, 3.0);
    vec3 gb = mix(mix(vec3(0.06, 0.22, 0.06), vec3(0.19, 0.38, 0.19), step(0.5, lv)),
                  mix(vec3(0.55, 0.67, 0.06), vec3(0.61, 0.74, 0.06), step(2.5, lv)),
                  step(1.5, lv));
    vec2 fG = fract(gl_FragCoord.xy / uPixels.y);
    gb *= 1.0 - 0.16 * step(0.9, max(fG.x, fG.y));

    /* wipe зліва направо */
    float edgeN = (hash(vec2(vUV.y * 23.0, floor(uTime * 20.0))) - 0.5) * 0.05;
    float xb = 1.16 * uWipe - 0.08;
    float k = 1.0 - smoothstep(xb - 0.05, xb + 0.05, vUV.x + edgeN);
    vec3 colA = modePick(uA, opt, thr, mono, gb);
    vec3 colB = modePick(uB, opt, thr, mono, gb);
    vec3 col = mix(colA, colB, k);

    float tr = step(0.001, uWipe) * (1.0 - step(0.999, uWipe));
    float band2 = exp(-pow((vUV.x - xb) * 26.0, 2.0)) * tr;
    float mEdge = max(clamp(1.0 - abs(uA - 2.0), 0.0, 1.0), clamp(1.0 - abs(uB - 2.0), 0.0, 1.0));
    vec3 edgeCol = mix(vec3(1.0, 0.85, 0.5), vec3(-0.6, -0.6, -0.6), mEdge);
    col += edgeCol * band2 * 0.55;

    float d = length(vUV - vec2(0.5, 0.5));
    float vig = smoothstep(0.95, 0.35, d) * 0.35 + 0.65;
    float mScal = mix(uA, uB, k);
    float monoW = clamp(1.0 - abs(mScal - 2.0), 0.0, 1.0);
    col *= mix(vig, 1.0, monoW * 0.7);
    gl_FragColor = vec4(col, 1.0);
}
`;

const GL = {
    gl: null, uni: null, ok: false, cv: null,
    init(cv){
        this.cv = cv;
        const gl = cv.getContext('webgl', { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
        if (!gl) return false;
        const mk = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); return null; }
            return s;
        };
        const vs = mk(gl.VERTEX_SHADER, 'attribute vec2 aPos; varying vec2 vUV; void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }');
        const fs = mk(gl.FRAGMENT_SHADER, FRAG);
        if (!vs || !fs) return false;
        const pr = gl.createProgram();
        gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
        if (!gl.getProgramParameter(pr, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(pr)); return false; }
        gl.useProgram(pr);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(pr, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        const U = n => gl.getUniformLocation(pr, n);
        this.uni = { uUVScale: U('uUVScale'), uUVOff: U('uUVOff'), uA: U('uA'), uB: U('uB'), uWipe: U('uWipe'), uTime: U('uTime'), uEW: U('uEW'), uRes: U('uRes'), uPixels: U('uPixels'), uSob: U('uSob'), uZoom: U('uZoom') };
        gl.uniform1i(U('uTex'), 0);
        this.gl = gl; this.ok = true;
        cv.addEventListener('webglcontextlost', () => { this.ok = false; }, false);
        return true;
    },
    render(now){
        if (!this.ok || video.readyState < 2) return;
        const gl = this.gl, cv = this.cv;
        const dpr = Math.min(devicePixelRatio || 1, CFG.glMaxDpr);
        const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
        if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; gl.viewport(0, 0, W, H); }
        if (!ST.frozen) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
        const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
        const va = vw / vh, ca = innerWidth / innerHeight;
        let sx = 1, sy = 1, ox = 0, oy = 0;
        if (va > ca){ sx = ca / va; ox = (1 - sx) / 2; }
        else        { sy = va / ca; oy = (1 - sy) / 2; }
        gl.uniform2f(this.uni.uUVScale, sx, sy);
        gl.uniform2f(this.uni.uUVOff, ox, oy);
        const p = Math.min(1, (now - ST.wipeStart) / CFG.wipeMs);
        gl.uniform1f(this.uni.uA, ST.wipeFrom);
        gl.uniform1f(this.uni.uB, ST.wipeTo);
        gl.uniform1f(this.uni.uWipe, easeWipe(p));
        gl.uniform1f(this.uni.uTime, now / 1000);
        gl.uniform1f(this.uni.uEW, ST.ew);
        gl.uniform2f(this.uni.uRes, W, H);
        gl.uniform2f(this.uni.uPixels, Math.max(4, Math.round(3 * dpr)), Math.max(5, Math.round(6 * dpr)));
        gl.uniform1f(this.uni.uSob, Math.max(2, Math.round(1.5 * dpr)));
        gl.uniform1f(this.uni.uZoom, ST.zoom);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
};

function setVision(v){
    if (!ST.running) return;
    if (!GL.ok){ typeLog('WEBGL НЕМА — ТІЛЬКИ ОПТИКА', 'threat'); return; }

    ST.wipeFrom = ST.vis; ST.wipeTo = v; ST.vis = v;

/* ── Цикл детекції: obj 8 Гц, pose/face — тільки коли є людина, зі своїм тактом ── */
function tsFor(o){ o._ts = Math.max((o._ts || 0) + 1, performance.now()); return o._ts; }

async function detectLoop(){
    if (!ST.running) return;
    if (document.hidden){ setTimeout(detectLoop, 400); return; }
    if (ST.frozen){ setTimeout(detectLoop, 120); return; }
    const now = performance.now();
    try {
        if (video.readyState >= 2){
            if (objDet && now - lastObj >= CFG.objMs){
                lastObj = now;
                ingestObjects(objDet.detectForVideo(video, tsFor(objDet)), now);
            }
            const person = ST.primary && ST.primary.cls === 'person';
            if (poseDet && person && now - lastPose >= CFG.poseMs){
                lastPose = now;
                ingestPose(poseDet.detectForVideo(video, tsFor(poseDet)));
            }
            if (faceDet && person && ST.locked && now - lastFace >= CFG.faceMs){
                lastFace = now;
                ingestFace(faceDet.detectForVideo(video, tsFor(faceDet)));
            }
        }
    } catch (e) {}
    setTimeout(detectLoop, 33);
}

function ingestObjects(res, now){
    const dets = ((res && res.detections) || []).map(d => ({
        box: { x: d.boundingBox.originX, y: d.boundingBox.originY, w: d.boundingBox.width, h: d.boundingBox.height },
        cls: ((d.categories[0] && d.categories[0].categoryName) || '?').toLowerCase(),
        score: (d.categories[0] && d.categories[0].score) || 0
    }));
    ST.tracks = updateTracks(ST.tracks, dets, now, { iouThr: CFG.iouThr, ttl: CFG.trackTTL, smooth: CFG.smooth });
    const prim = pickPrimary(ST.tracks, ST.primaryId);
    ST.primary = prim;
    ST.primaryId = prim ? prim.id : null;
    ST.items = attachItems(prim, ST.tracks);
    for (const it of ST.items){
        if (it.alert){
            const last = alertLog.get(it.track.cls) || 0;
            if (now - last > 8000){
                alertLog.set(it.track.cls, now);
                typeLog('НЕБЕЗПЕЧНИЙ ПРЕДМЕТ: ' + it.track.cls.toUpperCase(), 'threat');
            }
        }
    }
    if (prim){
        const T = coverT();
        const c = v2s(prim.box.x + prim.box.w / 2, prim.box.y + prim.box.h / 2, T);
        targetPos.x = c.x; targetPos.y = c.y; targetPos.active = true;
    } else {
        targetPos.active = false;
    }
    const wasLocked = ST.locked;
    ST.locked = !!prim && Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y) < CFG.lockDist;
    if (ST.locked && !wasLocked) onLock(prim);
    else if (!ST.locked && wasLocked) onUnlock();
    else if (ST.locked && prim && prim.id !== ST.lockedId) onLock(prim);
    const visN = ST.tracks.filter(t => t.hits >= 2).length;
    objCount.textContent = String(visN).padStart(2, '0');
    confBar.style.width = prim ? Math.round(prim.score * 100) + '%' : '0%';
    confBar.className = 'bar-fill' + (ST.locked ? ' danger' : '');
    renderThreat();
}

function ingestPose(res){
    const lms = (res && res.landmarks) || [];
    const p = ST.primary;
    if (!p || p.cls !== 'person'){ ST.anatomy = []; return; }
    const vw = video.videoWidth, vh = video.videoHeight;
    let best = null;
    for (const lm of lms){
        if (!lm || !lm[0]) continue;
        const nx = lm[0].x * vw, ny = lm[0].y * vh;
        if (nx > p.box.x - p.box.w * 0.2 && nx < p.box.x + p.box.w * 1.2 &&
            ny > p.box.y - p.box.h * 0.2 && ny < p.box.y + p.box.h * 1.2){ best = lm; break; }
    }
    ST.anatomy = best ? anatomyNodes(best, vw, vh) : [];
    ST.poseAt = performance.now();
}

function ingestFace(res){
    const dets = (res && res.detections) || [];
    const p = ST.primary;
    ST.faceBox = null;
    if (!p) return;
    for (const d of dets){
        const b = d.boundingBox;
        const cx = b.originX + b.width / 2, cy = b.originY + b.height / 2;
        if (cx > p.box.x && cx < p.box.x + p.box.w && cy > p.box.y && cy < p.box.y + p.box.h * 0.6){
            ST.faceBox = { x: b.originX, y: b.originY, w: b.width, h: b.height };
            ST.faceAt = performance.now();
            break;
        }
    }
}

function onLock(p){
    ST.lockedId = p.id;
    textTick = 0; glitchActive = 12;
    lockStat.textContent = p.cls.toUpperCase();
    lockStat.className = 'sp-val active';
    AU.lockOn();
    if (ST.vis === 1) AU.clicks();
    if (ST.vis === 3 && getThreat(p.cls) === 'HIGH') AU.bossJingle();
    ST.nextPing = performance.now() + 1200;
    typeLog('ЗАЛОЧИВ — ' + p.cls.toUpperCase() + ' [' + getThreat(p.cls) + ']', 'threat');
    if (!ST.cardVisible) tapHint.classList.add('show');
}
function onUnlock(){
    ST.lockedId = null;
    lockStat.textContent = '--';
    lockStat.className = 'sp-val';
    tapHint.classList.remove('show');
    AU.lockLost();
    renderThreat();
}

/* видимі частини (анатомія свіжа < 1.2 c) */
function partSet(){
    const now = performance.now();
    const s = new Set();
    if (now - ST.poseAt < 1200) for (const a of ST.anatomy) s.add(a.key);
    if (ST.faceBox && now - ST.faceAt < 1200) s.add('HEAD');
    return s;
}

/* ── Композитна картка: єдине бачення цілі з частин + предметів ── */
function renderThreat(){
    const p = ST.primary;
    if (!p || !ST.locked){ threatBox.classList.remove('show'); ST.tSig = ''; return; }
    threatBox.classList.add('show');
    const tier = getThreat(p.cls);
    const have = partSet();
    const sig = [p.id, p.cls, Math.round(p.score * 20), Array.from(have).sort().join(','), ST.items.map(i => i.track.cls + (i.alert ? '!' : '')).join(',')].join('|');
    if (sig === ST.tSig) return;
    ST.tSig = sig;
    const row = (k, v, red) => '<div class="tbi"><span class="tbi-key">' + k + '</span><span class="' + (red ? 'tbi-red' : '') + '">' + v + '</span></div>';
    let h = row('CLASS', p.cls.toUpperCase())
          + row('THREAT', tier, tier === 'HIGH')
          + row('CONF', Math.round(p.score * 100) + '%')
          + row('ID', p.id);
    if (p.cls === 'person'){
        h += '<div class="tb-sub">// components ' + have.size + '/4</div>';
        for (const k of ['HEAD', 'TORSO', 'HAND·L', 'HAND·R']) h += row(k, have.has(k) ? '●' : '—', false);
    }
    if (ST.items.length){
        h += '<div class="tb-sub">// attached</div>';
        for (const it of ST.items) h += row(it.track.cls.toUpperCase().slice(0, 10), it.alert ? '⚠' : '●', it.alert);
    }
    threatLines.innerHTML = h;
}

/* ── Портрет: знімається з GL-канви (з поточним режимом бачення), фолбек — сире відео ── */
function capturePortrait(t){
    const sz = 130;
    portCanvas.width = sz; portCanvas.height = sz;
    portCtx.fillStyle = '#000'; portCtx.fillRect(0, 0, sz, sz);
    const pad = 0.15;
    if (GL.ok){
        const T = coverT();
        const a = v2s(t.box.x, t.box.y, T);
        const b = v2s(t.box.x + t.box.w, t.box.y + t.box.h, T);
        let w = b.x - a.x, h = b.y - a.y;
        let x = a.x - w * pad, y = a.y - h * pad;
        w *= 1 + pad * 2; h *= 1 + pad * 2;
        x = Math.max(0, x); y = Math.max(0, y);
        w = Math.min(innerWidth - x, w); h = Math.min(innerHeight - y, h);
        const k = GL.cv.width / innerWidth;
        if (w > 2 && h > 2) portCtx.drawImage(GL.cv, x * k, y * k, w * k, h * k, 0, 0, sz, sz);
        portCanvas.classList.remove('rawlook');
    } else {
        if (!video.videoWidth) return;
        let x = t.box.x - t.box.w * pad, y = t.box.y - t.box.h * pad;
        let w = t.box.w * (1 + pad * 2), h = t.box.h * (1 + pad * 2);
        x = Math.max(0, x); y = Math.max(0, y);
        w = Math.min(video.videoWidth - x, w); h = Math.min(video.videoHeight - y, h);
        portCtx.drawImage(video, x, y, w, h, 0, 0, sz, sz);
        portCanvas.classList.add('rawlook');
    }
    pStampTime.textContent = ts();
    pStampId.textContent = 'ID:' + t.id;
    const tier = getThreat(t.cls);
    const sec = String.fromCharCode(65 + Math.floor(Math.random() * 6)) + (Math.floor(Math.random() * 9) + 1);
    const have = partSet();
    const rows = [
        { k: 'CLASS',  v: t.cls.toUpperCase() },
        { k: 'THREAT', v: tier, red: tier === 'HIGH' },
        { k: 'CONF',   v: Math.round(t.score * 100) + '%' }
    ];
    if (t.cls === 'person'){
        rows.push({ k: 'PARTS', v: have.size + '/4' });
        rows.push({ k: 'ITEMS', v: ST.items.length ? ST.items.map(i => i.track.cls).join(',').toUpperCase().slice(0, 15) : '—', red: ST.items.some(i => i.alert) });
    }
    rows.push(
        { k: 'VIS',    v: VIS_NAMES[ST.vis] },
        { k: 'SECTOR', v: sec },
        { k: 'LAT',    v: lat.toFixed(5) + '°' },
        { k: 'LON',    v: lon.toFixed(5) + '°' },
        { k: 'STATUS', v: 'LOCKED', red: true }
    );
    cmRows.innerHTML = '';
    rows.forEach(r => {
        const d = document.createElement('div'); d.className = 'cm-row';
        d.innerHTML = '<span class="cm-key">' + r.k + '</span><span class="cm-val' + (r.red ? ' red' : '') + '">' + r.v + '</span>';
        cmRows.appendChild(d);
    });
    addToGallery(t);
    if (ST.vis === 3) addScore(getThreat(t.cls));
    capturedFlash.classList.remove('flash'); void capturedFlash.offsetWidth; capturedFlash.classList.add('flash');
    flashOv.classList.remove('flash'); void flashOv.offsetWidth; flashOv.classList.add('flash');
    AU.shutter();
    ST.captures++;
    captureStat.textContent = ST.captures;
}
function showCard(){ captureCard.classList.add('show'); ST.cardVisible = true; tapHint.classList.remove('show'); }
function hideCard(){ captureCard.classList.remove('show'); ST.cardVisible = false; if (ST.locked) tapHint.classList.add('show'); }

/* ── Дані для тайп-блоку біля ретикла ── */
function currentInfo(){
    const p = ST.primary;
    if (!p) return [];
    const L = [
        { k: 'CLASS',  v: p.cls.toUpperCase() },
        { k: 'THREAT', v: getThreat(p.cls) },
        { k: 'CONF',   v: Math.round(p.score * 100) + '%' },
        { k: 'ID',     v: p.id }
    ];
    if (p.cls === 'person') L.push({ k: 'PARTS', v: partSet().size + '/4' });
    if (ST.items.length) L.push({ k: 'ATT', v: ST.items.length + (ST.items.some(i => i.alert) ? ' ⚠' : '') });
    L.push({ k: 'STATUS', v: 'LOCKED' });
    return L;
}

/* ── T-800 колонка асемблера ── */
const ASM_OPS = ['LDA','STA','JMP','BNE','CMP','LDX','LDY','STX','INX','DEX','BEQ','JSR','RTS','ADC','SBC','AND','ORA','EOR','ASL','LSR','BRK','NOP'];
let asmLines = [], yLines = [], lastAsm = 0;
const YCH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function yLine(){ let s = ''; for (let i = 0; i < 7; i++) s += Math.random() < 0.12 ? ' ' : YCH[(Math.random() * YCH.length) | 0]; return s; }
function hx(){ return Math.floor(Math.random() * 256).toString(16).padStart(2, '0').toUpperCase(); }
function asmLine(){ return hx() + hx() + ' ' + hx() + ' ' + hx() + '  ' + ASM_OPS[(Math.random() * ASM_OPS.length) | 0] + ' $' + hx() + hx(); }
function drawAsm(now, dpr){
    if (innerWidth < 380) return;
    if (now - lastAsm > 110){
        lastAsm = now;
        asmLines.push(asmLine()); if (asmLines.length > 40) asmLines.shift();
        yLines.push(yLine());     if (yLines.length > 40) yLines.shift();
    }
    const yStart = 210, yEnd = innerHeight - 250;
    const step = ST.vis === 1 ? 14 : 11;
    const maxN = Math.floor((yEnd - yStart) / step);
    if (maxN < 4) return;
    ctx.save();
    ctx.shadowBlur = 0;
    if (ST.vis === 1){
        const n = Math.min(maxN, yLines.length);
        for (let i = 0; i < n; i++)
            drawYautja(yLines[yLines.length - n + i], 10 * dpr, (yStart + i * step) * dpr, 8 * dpr, 'rgba(255,220,150,0.2)');
    } else {
        const n = Math.min(maxN, asmLines.length);
        ctx.font = (7.5 * dpr) + "px 'Share Tech Mono'";
        ctx.fillStyle = ST.vis === 2 ? 'rgba(30,27,18,0.3)' : ST.vis === 3 ? 'rgba(139,172,15,0.22)' : 'rgba(255,255,255,0.12)';
        for (let i = 0; i < n; i++)
            ctx.fillText(asmLines[asmLines.length - n + i], 10 * dpr, (yStart + i * step) * dpr);
    }
    ctx.restore();
}

/* ── Вторинні цілі ── */
function drawSecondary(dpr, T){
    ctx.save(); ctx.shadowBlur = 3;
    const itemIds = new Set(ST.items.map(i => i.track.id));
    for (const t of ST.tracks){
        if (t.id === ST.primaryId || t.hits < 2 || itemIds.has(t.id)) continue;
        const a = v2s(t.box.x, t.box.y, T), b = v2s(t.box.x + t.box.w, t.box.y + t.box.h, T);
        const rx = a.x * dpr, ry = a.y * dpr, rw = (b.x - a.x) * dpr, rh = (b.y - a.y) * dpr;
        const tier = getThreat(t.cls);
        const col = ST.vis === 2
            ? (tier === 'HIGH' ? 'rgba(20,18,12,0.6)' : 'rgba(45,41,30,0.4)')
            : ST.vis === 3
            ? (tier === 'HIGH' ? 'rgba(155,188,15,0.5)' : 'rgba(139,172,15,0.3)')
            : tier === 'HIGH' ? 'rgba(255,80,80,0.4)' : tier === 'MED' ? 'rgba(255,160,0,0.35)' : 'rgba(200,200,255,0.25)';
        ctx.strokeStyle = col; ctx.shadowColor = col; ctx.lineWidth = 1 * dpr;
        ctx.setLineDash([4 * dpr, 4 * dpr]); ctx.strokeRect(rx, ry, rw, rh); ctx.setLineDash([]);
        ctx.fillStyle = col; ctx.font = (9 * dpr) + "px 'Share Tech Mono'";
        ctx.fillText(t.cls.toUpperCase(), rx + 4 * dpr, ry - 4 * dpr);
    }
    ctx.restore();
}

/* ── Батьківський бокс + ANALYSIS ── */
function drawPrimaryBox(p, dpr, T, mainColor, rr, rg, rb){
    const a = v2s(p.box.x, p.box.y, T), b = v2s(p.box.x + p.box.w, p.box.y + p.box.h, T);
    const rx = a.x * dpr, ry = a.y * dpr, rw = (b.x - a.x) * dpr, rh = (b.y - a.y) * dpr;
    const lf = ST.lockF;
    ctx.save();
    ctx.strokeStyle = mainColor; ctx.shadowColor = mainColor; ctx.lineWidth = 1.5 * dpr; ctx.shadowBlur = 10 * lf;
    const cL = Math.min(rw, rh) * 0.22;
    ctx.beginPath();
    ctx.moveTo(rx, ry + cL); ctx.lineTo(rx, ry); ctx.lineTo(rx + cL, ry);
    ctx.moveTo(rx + rw - cL, ry); ctx.lineTo(rx + rw, ry); ctx.lineTo(rx + rw, ry + cL);
    ctx.moveTo(rx + rw, ry + rh - cL); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx + rw - cL, ry + rh);
    ctx.moveTo(rx + cL, ry + rh); ctx.lineTo(rx, ry + rh); ctx.lineTo(rx, ry + rh - cL);
    ctx.stroke();
    ctx.fillStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',' + (0.03 + 0.04 * lf) + ')';
    ctx.fillRect(rx, ry, rw, rh);
    if (lf > 0.4){
        ctx.setLineDash([3 * dpr, 5 * dpr]); ctx.lineWidth = 0.5 * dpr;
        ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.3)';
        ctx.beginPath();
        ctx.moveTo(rx - 20 * dpr, ry); ctx.lineTo(rx - 20 * dpr, ry + rh);
        ctx.moveTo(rx, ry - 12 * dpr); ctx.lineTo(rx + rw, ry - 12 * dpr);
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.5)';
        ctx.font = (8 * dpr) + "px 'Share Tech Mono'";
        ctx.fillText(Math.round(rh / dpr) + 'px', rx - 18 * dpr, ry + rh / 2);
        ctx.fillText(Math.round(rw / dpr) + 'px', rx + rw / 2 - 12 * dpr, ry - 14 * dpr);
    }
    if (ST.locked){
        const blink = 0.4 + 0.3 * Math.sin(pulseTime * 3);
        ctx.fillStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',' + blink + ')';
        ctx.font = '700 ' + (10 * dpr) + 'px Rajdhani';
        ctx.fillText('A N A L Y S I S', rx, ry - 26 * dpr);
    }
    ctx.restore();
}

/* ── Дочірні фокуси: анатомія + предмети, лінії зв'язку до батьківського центру ── */
function drawChildren(dpr, T, rr, rg, rb){
    const cx = currentPos.x * dpr, cy = currentPos.y * dpr;
    const now = performance.now();
    ctx.save();
    ctx.font = (8 * dpr) + "px 'Share Tech Mono'";
    const haveFace = ST.faceBox && now - ST.faceAt < 1200;
    if (now - ST.poseAt < 1200){
        for (const n of ST.anatomy){
            if (n.key === 'HEAD' && haveFace) continue;
            const s = v2s(n.pt.x, n.pt.y, T);
            const px = s.x * dpr, py = s.y * dpr;
            const col = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.45)';
            ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 4;
            ctx.lineWidth = 0.8 * dpr;
            ctx.setLineDash([2 * dpr, 6 * dpr]);
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
            ctx.setLineDash([]);
            const r = 6 * dpr;
            ctx.lineWidth = 1.2 * dpr;
            ctx.beginPath();
            ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py); ctx.closePath();
            ctx.stroke();
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(px, py, 1.5 * dpr, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.6)';
            ctx.fillText(n.key, px + 9 * dpr, py - 6 * dpr);
        }
    }
    if (haveFace){
        const a = v2s(ST.faceBox.x, ST.faceBox.y, T);
        const b = v2s(ST.faceBox.x + ST.faceBox.w, ST.faceBox.y + ST.faceBox.h, T);
        const rx = a.x * dpr, ry = a.y * dpr, rw = (b.x - a.x) * dpr, rh = (b.y - a.y) * dpr;
        const col = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.7)';
        ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 5;
        ctx.lineWidth = 1.2 * dpr;
        const cL = Math.min(rw, rh) * 0.3;
        ctx.beginPath();
        ctx.moveTo(rx, ry + cL); ctx.lineTo(rx, ry); ctx.lineTo(rx + cL, ry);
        ctx.moveTo(rx + rw - cL, ry); ctx.lineTo(rx + rw, ry); ctx.lineTo(rx + rw, ry + cL);
        ctx.moveTo(rx + rw, ry + rh - cL); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx + rw - cL, ry + rh);
        ctx.moveTo(rx + cL, ry + rh); ctx.lineTo(rx, ry + rh); ctx.lineTo(rx, ry + rh - cL);
        ctx.stroke();
        ctx.setLineDash([2 * dpr, 6 * dpr]);
        ctx.lineWidth = 0.8 * dpr;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(rx + rw / 2, ry + rh); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = col;
        ctx.fillText('HEAD', rx, ry - 5 * dpr);
    }
    const pulse = 0.5 + 0.4 * Math.sin(pulseTime * 6);
    for (const it of ST.items){
        const tb = it.track.box;
        const a = v2s(tb.x, tb.y, T), b = v2s(tb.x + tb.w, tb.y + tb.h, T);
        const rx = a.x * dpr, ry = a.y * dpr, rw = (b.x - a.x) * dpr, rh = (b.y - a.y) * dpr;
        const col = ST.vis === 2
            ? (it.alert ? 'rgba(0,0,0,' + (0.55 + 0.35 * pulse) + ')' : 'rgba(45,41,30,0.5)')
            : ST.vis === 3
            ? (it.alert ? 'rgba(155,188,15,' + (0.6 + 0.3 * pulse) + ')' : 'rgba(139,172,15,0.45)')
            : it.alert ? 'rgba(255,32,32,' + (0.5 + 0.4 * pulse) + ')' : 'rgba(120,200,255,0.55)';
        ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = it.alert ? 8 : 3;
        ctx.lineWidth = 1 * dpr;
        ctx.setLineDash([3 * dpr, 3 * dpr]);
        ctx.strokeRect(rx, ry, rw, rh);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(rx + rw / 2, ry + rh / 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = col;
        ctx.fillText((it.alert ? '⚠ ' : '') + it.track.cls.toUpperCase(), rx, ry - 4 * dpr);
    }
    ctx.restore();
}

/* ── Ретикл ── */
function drawReticle(cx, cy, dpr, lf, mainColor, rr, rg, rb){
    ctx.save(); ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.2)'; ctx.lineWidth = 0.5 * dpr; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, 110 * dpr, 0, Math.PI * 2); ctx.stroke();
    if (lf > 0.1){
        const pulse = 0.5 + 0.5 * Math.sin(pulseTime * 2);
        ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',' + (0.08 + 0.1 * pulse * lf) + ')'; ctx.lineWidth = 0.5 * dpr;
        for (const r of [60, 80, 100]){ ctx.beginPath(); ctx.arc(0, 0, r * dpr, 0, Math.PI * 2); ctx.stroke(); }
    }
    if (lf > 0.15){
        ctx.save(); ctx.rotate(pulseTime * 1.5);
        ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',' + (0.3 + 0.3 * lf) + ')'; ctx.lineWidth = 1.5 * dpr;
        ctx.shadowBlur = 6 * lf; ctx.shadowColor = mainColor;
        ctx.setLineDash([18 * dpr, 50 * dpr]);
        ctx.beginPath(); ctx.arc(0, 0, 95 * dpr, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (lf > 0.3){
        ctx.save(); ctx.rotate(-pulseTime * 0.8);
        ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',' + (0.15 + 0.15 * lf) + ')'; ctx.lineWidth = 0.8 * dpr;
        ctx.setLineDash([6 * dpr, 20 * dpr]);
        ctx.beginPath(); ctx.arc(0, 0, 75 * dpr, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    ctx.setLineDash([]);
    const bS = (28 - 8 * lf) * dpr, bD = (8 + 14 * lf) * dpr;
    ctx.strokeStyle = mainColor; ctx.lineWidth = 2.5 * dpr; ctx.shadowBlur = 10 * lf; ctx.shadowColor = mainColor;
    for (let i = 0; i < 4; i++){
        ctx.save(); ctx.rotate(i * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(bS, -bS + bD); ctx.lineTo(bS, -bS); ctx.lineTo(bS - bD, -bS);
        ctx.stroke(); ctx.restore();
    }
    ctx.lineWidth = 1.5 * dpr; ctx.shadowBlur = 6;
    const c = 7 * dpr, gap = 4 * dpr;
    ctx.beginPath();
    ctx.moveTo(-c, 0); ctx.lineTo(-gap, 0); ctx.moveTo(gap, 0); ctx.lineTo(c, 0);
    ctx.moveTo(0, -c); ctx.lineTo(0, -gap); ctx.moveTo(0, gap); ctx.lineTo(0, c);
    ctx.stroke();
    ctx.fillStyle = mainColor;
    ctx.shadowBlur = 12 * lf; ctx.beginPath(); ctx.arc(0, 0, 2.5 * dpr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.5)'; ctx.lineWidth = 1 * dpr; ctx.shadowBlur = 0;
    for (let a = 0; a < 360; a += 15){
        const rad = a * Math.PI / 180;
        const inn = a % 90 === 0 ? 115 * dpr : a % 45 === 0 ? 112 * dpr : 110.5 * dpr;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rad) * inn, Math.sin(rad) * inn);
        ctx.lineTo(Math.cos(rad) * 118 * dpr, Math.sin(rad) * 118 * dpr); ctx.stroke();
    }
    if (lf > 0.5){
        const burst = (lf - 0.5) * 2;
        ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',' + (0.15 * burst) + ')'; ctx.lineWidth = 0.5 * dpr;
        for (let a = 0; a < 360; a += 30){
            const rad = a * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(Math.cos(rad) * 120 * dpr, Math.sin(rad) * 120 * dpr);
            ctx.lineTo(Math.cos(rad) * (120 + 30 * burst) * dpr, Math.sin(rad) * (120 + 30 * burst) * dpr);
            ctx.stroke();
        }
    }
    if (lf < 0.8){
        ctx.save(); ctx.rotate(scanAngle);
        const sg = ctx.createLinearGradient(0, -100 * dpr, 0, 0);
        sg.addColorStop(0, 'rgba(' + rr + ',' + rg + ',' + rb + ',0.0)');
        sg.addColorStop(1, 'rgba(' + rr + ',' + rg + ',' + rb + ',' + (0.08 * (1 - lf)) + ')');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 108 * dpr, -0.5, 0.5); ctx.closePath();
        ctx.fill(); ctx.restore();
    }
    ctx.restore();
}

/* ── Рендер рядка гліфами Яутжа ── */
function drawYautja(str, x, y, cell, color){
    ctx.save();
    ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 3;
    ctx.lineWidth = Math.max(1, cell * 0.14); ctx.lineCap = 'round';
    let gx = x;
    for (const ch of str){
        const strokes = yGlyph(ch);
        for (const s of strokes){
            ctx.beginPath();
            ctx.moveTo(gx + s[0] * cell, y + s[1] * cell);
            ctx.lineTo(gx + s[2] * cell, y + s[3] * cell);
            ctx.stroke();
        }
        gx += cell * 0.82;
    }
    ctx.restore();
}

/* ── Приціл Хижака: трикутні брекети + три лазерні точки, що сходяться при лоці ── */
function drawPredReticle(cx, cy, dpr, lf, mainColor, rr, rg, rb){
    ctx.save(); ctx.translate(cx, cy);
    const R = (108 - 26 * lf) * dpr;
    /* примарний зовнішній трикутник, контр-обертання */
    ctx.save(); ctx.rotate(Math.PI - scanAngle * 0.4);
    ctx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.14)';
    ctx.lineWidth = 1 * dpr; ctx.shadowBlur = 0;
    ctx.beginPath();
    for (let i = 0; i < 3; i++){
        const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
        const x = Math.cos(a) * R * 1.32, y = Math.sin(a) * R * 1.32;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke(); ctx.restore();

    /* вершиною вниз; обертається доки шукає, завмирає на лоці */
    ctx.rotate(Math.PI + scanAngle * 0.9 * (1 - lf));
    ctx.strokeStyle = mainColor; ctx.shadowColor = mainColor;
    ctx.shadowBlur = 8 + 10 * lf;
    ctx.lineWidth = (4.5 + 2 * lf) * dpr; ctx.lineCap = 'butt';
    const V = [];
    for (let i = 0; i < 3; i++){
        const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
        V.push([Math.cos(a) * R, Math.sin(a) * R]);
    }
    for (let i = 0; i < 3; i++){
        const x1 = V[i][0], y1 = V[i][1], x2 = V[(i + 1) % 3][0], y2 = V[(i + 1) % 3][1];
        ctx.beginPath();
        ctx.moveTo(x1 + (x2 - x1) * 0.14, y1 + (y2 - y1) * 0.14);
        ctx.lineTo(x1 + (x2 - x1) * 0.86, y1 + (y2 - y1) * 0.86);
        ctx.stroke();
    }
    ctx.lineWidth = 2.5 * dpr;
    for (let i = 0; i < 3; i++){
        const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
        const ox = Math.cos(a) * R * 1.1, oy = Math.sin(a) * R * 1.1;
        ctx.beginPath();
        ctx.moveTo(ox - Math.sin(a) * 8 * dpr, oy + Math.cos(a) * 8 * dpr);
        ctx.lineTo(ox + Math.sin(a) * 8 * dpr, oy - Math.cos(a) * 8 * dpr);
        ctx.stroke();
    }
    /* три лазерні точки: сходяться, джитер падає при лоці */
    const dR = (46 - 34 * lf) * dpr;
    const jit = (lf > 0.7 ? 0.8 : 2) * dpr;
    ctx.fillStyle = mainColor; ctx.shadowBlur = 12;
    for (let i = 0; i < 3; i++){
        const a = -Math.PI / 2 + i * 2 * Math.PI / 3;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * dR + (Math.random() - 0.5) * jit, Math.sin(a) * dR + (Math.random() - 0.5) * jit, (3.2 + 1.2 * lf) * dpr, 0, Math.PI * 2);
        ctx.fill();
    }
    if (lf > 0.92){
        const pk = 0.5 + 0.5 * Math.sin(pulseTime * 5);
        ctx.globalAlpha = 0.25 + 0.3 * pk;
        ctx.beginPath(); ctx.arc(0, 0, 5 * dpr, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
    ctx.restore();
    /* клас цілі гліфами Яутжа під прицілом */
    if (lf > 0.2 && ST.primary){
        const s = ST.primary.cls.toUpperCase();
        const shown = s.substring(0, Math.max(0, Math.floor(textTick / 3)));
        const cell = 13 * dpr;
        drawYautja(shown, cx - s.length * cell * 0.41, cy + 128 * dpr, cell, mainColor);
    }
}

/* ── MONO-приціл: креслення/blueprint, маршовий пунктир, сканлінія ── */
function drawMonoReticle(cx, cy, dpr, lf, mainColor, rr, rg, rb){
    ctx.save(); ctx.translate(cx, cy);
    ctx.strokeStyle = mainColor; ctx.fillStyle = mainColor;
    ctx.shadowBlur = 0; ctx.lineCap = 'butt';
    const R1 = (104 - 20 * lf) * dpr, R2 = (70 - 14 * lf) * dpr;
    ctx.lineWidth = 1.2 * dpr;
    ctx.setLineDash([6 * dpr, 5 * dpr]);
    ctx.lineDashOffset = -pulseTime * 14 * dpr;
    ctx.beginPath(); ctx.arc(0, 0, R1, 0, Math.PI * 2); ctx.stroke();
    ctx.lineDashOffset = pulseTime * 10 * dpr;
    ctx.beginPath(); ctx.arc(0, 0, R2, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    ctx.lineWidth = (1.5 + lf) * dpr;
    const L = 120 * dpr, gap = 10 * dpr;
    ctx.beginPath();
    ctx.moveTo(-L, 0); ctx.lineTo(-gap, 0); ctx.moveTo(gap, 0); ctx.lineTo(L, 0);
    ctx.moveTo(0, -L); ctx.lineTo(0, -gap); ctx.moveTo(0, gap); ctx.lineTo(0, L);
    ctx.stroke();
    ctx.lineWidth = 1 * dpr;
    for (let i = 1; i <= 5; i++){
        const d = i * 20 * dpr, t = (i % 2 ? 3 : 6) * dpr;
        ctx.beginPath();
        ctx.moveTo(d, -t); ctx.lineTo(d, t); ctx.moveTo(-d, -t); ctx.lineTo(-d, t);
        ctx.moveTo(-t, d); ctx.lineTo(t, d); ctx.moveTo(-t, -d); ctx.lineTo(t, -d);
        ctx.stroke();
    }
    const sy = Math.sin(pulseTime * 1.6) * R1 * 0.85;
    const sw = Math.sqrt(Math.max(0, R1 * R1 - sy * sy));
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(-sw, sy); ctx.lineTo(sw, sy); ctx.stroke();
    ctx.globalAlpha = 1;
    const s = 4 * dpr;
    if (lf > 0.5) ctx.fillRect(-s, -s, 2 * s, 2 * s);
    else ctx.strokeRect(-s, -s, 2 * s, 2 * s);
    ctx.restore();
}

/* ── 8-BIT приціл: піксель-арт блоками, позиція і анімація квантовані ── */
function draw8bitReticle(cx, cy, dpr, lf, mainColor, rr, rg, rb){
    const P = Math.max(4, Math.round(6 * dpr));
    const px = Math.round(cx / P) * P, py = Math.round(cy / P) * P;
    ctx.save(); ctx.translate(px, py);
    ctx.fillStyle = mainColor; ctx.shadowBlur = 0;
    const blk = (x, y) => ctx.fillRect(x * P - P / 2, y * P - P / 2, P, P);
    const fr = Math.floor(pulseTime * 2) % 2;
    const d = Math.round(13 - 5 * lf) + fr;
    for (let i = 0; i < 3; i++){
        blk(-d + i, -d); blk(-d, -d + i);
        blk(d - i, -d);  blk(d, -d + i);
        blk(-d + i, d);  blk(-d, d - i);
        blk(d - i, d);   blk(d, d - i);
    }
    if (Math.floor(pulseTime * 4) % 2 === 0) blk(0, 0);
    blk(-2, 0); blk(2, 0); blk(0, -2); blk(0, 2);
    if (lf > 0.6){ blk(-1, -1); blk(1, -1); blk(-1, 1); blk(1, 1); }
    ctx.restore();
}

/* ── Тайп-блок біля ретикла ── */
function drawDataBlock(cx, cy, dpr, mainColor){

    });

        ctx.fillRect(bx - 5 * dpr, cy + 42 * dpr, Math.random() * 50 * dpr, 1.5 * dpr);

}

function drawEwNoise(W, H, dpr){

function drawCornerDeco(W, H, dpr){
    const s = 30 * dpr;
    ctx.strokeStyle = ST.vis === 2 ? 'rgba(30,27,18,0.35)' : ST.vis === 3 ? 'rgba(139,172,15,0.3)' : 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1 * dpr; ctx.shadowBlur = 0; ctx.setLineDash([]);
    [[0,0,1,1],[W,0,-1,1],[W,H,-1,-1],[0,H,1,-1]].forEach(([x,y,sx,sy]) => {
        ctx.beginPath(); ctx.moveTo(x + sx * s, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * s); ctx.stroke();
    });
    ctx.strokeStyle = ST.vis === 2 ? 'rgba(30,27,18,0.15)' : ST.vis === 3 ? 'rgba(139,172,15,0.12)' : 'rgba(255,255,255,0.06)'; ctx.lineWidth = 0.5 * dpr; ctx.setLineDash([5 * dpr, 15 * dpr]);
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
}

/* ── 8-BIT: спрайти, SCORE/combo, HP-бар ── */
const SPR_SKULL = ['01110','11111','10101','11111','01010'];
const SPR_ALERT = ['00100','00100','00100','00000','00100'];
function drawSprite(rows, x, y, s, color){
    ctx.fillStyle = color;
    for (let r = 0; r < rows.length; r++)
        for (let cIdx = 0; cIdx < rows[r].length; cIdx++)
            if (rows[r][cIdx] === '1') ctx.fillRect(x + cIdx * s, y + r * s, s, s);
}
function addScore(tier){
    const now = performance.now();
    ST.combo = (now - ST.comboAt < 6000) ? ST.combo + 1 : 1;
    ST.comboAt = now;
    const base = tier === 'HIGH' ? 300 : tier === 'MED' ? 200 : 100;
    const pts = base * ST.combo;
    ST.score += pts;
    popups.push({ text: '+' + pts + (ST.combo > 1 ? ' x' + ST.combo : ''), x: currentPos.x + 24, y: currentPos.y - 30, born: now });
    AU.scoreJingle();
}
function drawGbUI(dpr, T){
    ctx.save(); ctx.shadowBlur = 0;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(155,188,15,0.9)';
    ctx.font = (8 * dpr) + "px 'Press Start 2P'";
    ctx.fillText('SCORE ' + String(ST.score).padStart(6, '0') + (ST.combo > 1 ? '  x' + ST.combo : ''), canvas.width / 2, 78 * dpr);
    ctx.textAlign = 'left';
    const p = ST.primary;
    if (p && targetPos.active){
        const a = v2s(p.box.x, p.box.y, T);
        const bpx = Math.max(4, Math.round(5 * dpr));
        const bx = Math.round(a.x * dpr / bpx) * bpx;
        const by = Math.round(a.y * dpr / bpx) * bpx - 4 * bpx;
        const hp = Math.round(p.score * 10);
        for (let i = 0; i < 10; i++){
            ctx.fillStyle = i < hp ? 'rgba(155,188,15,0.95)' : 'rgba(48,98,48,0.55)';
            ctx.fillRect(bx + i * (bpx + Math.ceil(dpr)), by, bpx, bpx * 1.6);
        }
        const tier = getThreat(p.cls);
        if (tier === 'HIGH') drawSprite(SPR_SKULL, bx - 7 * bpx, by - bpx, bpx, 'rgba(155,188,15,0.95)');
        else if (tier === 'MED') drawSprite(SPR_ALERT, bx - 5 * bpx, by - bpx, bpx, 'rgba(139,172,15,0.8)');
    }
    const now = performance.now();
    popups = popups.filter(pp => now - pp.born < 1000);
    for (const pp of popups){
        const k = (now - pp.born) / 1000;
        ctx.globalAlpha = 1 - k;
        ctx.fillStyle = 'rgba(155,188,15,1)';
        ctx.font = (9 * dpr) + "px 'Press Start 2P'";
        ctx.fillText(pp.text, pp.x * dpr, (pp.y - 34 * k) * dpr);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

/* ── Індикатори станів по центру зверху (потрапляють у запис) ── */
function drawIndicators(now, dpr, W){
    ctx.save(); ctx.textAlign = 'center'; ctx.shadowBlur = 0;
    const col = ST.vis === 2 ? 'rgba(30,27,18,0.8)' : ST.vis === 3 ? 'rgba(155,188,15,0.85)' : 'rgba(255,255,255,0.6)';
    ctx.fillStyle = col;
    ctx.font = (9 * dpr) + "px 'Share Tech Mono'";
    let y = 26 * dpr;
    if (ST.zoom > 1.01){ ctx.fillText('ZOOM x' + ST.zoom.toFixed(1), W / 2, y); y += 14 * dpr; }
    if (ST.frozen){ ctx.fillText('|| FREEZE', W / 2, y); y += 14 * dpr; }
    if (recState.on && Math.floor(now / 500) % 2 === 0){
        ctx.fillStyle = ST.vis === 2 ? 'rgba(30,27,18,0.9)' : 'rgba(255,40,40,0.9)';
        const s = Math.floor((now - recState.t0) / 1000);
        ctx.fillText('* REC ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'), W / 2, y);
    }
    ctx.restore();
}

/* ── Галерея: капчура як самодостатній PNG + шеринг ── */
function addToGallery(t){
    const S = 390, F = 34;
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = S + F;
    const c2 = cv.getContext('2d');
    c2.imageSmoothingEnabled = false;
    c2.fillStyle = '#000'; c2.fillRect(0, 0, S, S + F);
    const pad = 0.15;
    if (GL.ok){
        const T = coverT();
        const a = v2s(t.box.x, t.box.y, T);
        const b = v2s(t.box.x + t.box.w, t.box.y + t.box.h, T);
        let w = b.x - a.x, h = b.y - a.y;
        let x = a.x - w * pad, y = a.y - h * pad;
        w *= 1 + pad * 2; h *= 1 + pad * 2;
        x = Math.max(0, x); y = Math.max(0, y);
        w = Math.min(innerWidth - x, w); h = Math.min(innerHeight - y, h);
        const k = GL.cv.width / innerWidth;
        if (w > 2 && h > 2) c2.drawImage(GL.cv, x * k, y * k, w * k, h * k, 0, 0, S, S);
    } else {
        if (!video.videoWidth) return;
        let x = t.box.x - t.box.w * pad, y = t.box.y - t.box.h * pad;
        let w = t.box.w * (1 + pad * 2), h = t.box.h * (1 + pad * 2);
        x = Math.max(0, x); y = Math.max(0, y);
        w = Math.min(video.videoWidth - x, w); h = Math.min(video.videoHeight - y, h);
        c2.drawImage(video, x, y, w, h, 0, 0, S, S);
    }
    c2.fillStyle = '#111'; c2.fillRect(0, S, S, F);
    c2.fillStyle = '#ff2020'; c2.font = "12px 'Share Tech Mono'";
    c2.fillText('myFIX // ' + t.cls.toUpperCase() + ' ' + t.id + ' ' + ts(), 10, S + 22);
    cv.toBlob(blob => {
        if (!blob) return;
        gallery.unshift({ blob, url: URL.createObjectURL(blob), video: false });
        while (gallery.length > 24){ const old = gallery.pop(); URL.revokeObjectURL(old.url); }
    }, 'image/png');
}
function renderGallery(){
    galGrid.innerHTML = '';
    if (!gallery.length){
        galGrid.innerHTML = '<div class="gp-empty">ПУСТО. ЗАЛОЧ ЦІЛЬ І ТИЦНИ.</div>';
        return;
    }
    gallery.forEach((g, i) => {
        const cell = document.createElement('div'); cell.className = 'gp-cell';
        const media = document.createElement(g.video ? 'video' : 'img');
        media.src = g.url;
        if (g.video){ media.muted = true; media.loop = true; media.playsInline = true; media.autoplay = true; }
        const row = document.createElement('div'); row.className = 'gp-row';
        const sh = document.createElement('button'); sh.className = 'gp-btn'; sh.textContent = 'SHR';
        sh.onclick = () => shareItem(g);
        const del = document.createElement('button'); del.className = 'gp-btn'; del.textContent = 'DEL';
        del.onclick = () => { URL.revokeObjectURL(g.url); gallery.splice(i, 1); renderGallery(); };
        row.append(sh, del);
        cell.append(media, row);
        galGrid.appendChild(cell);
    });
}
async function shareItem(g){
    const ext = g.video ? (g.blob.type.indexOf('mp4') >= 0 ? 'mp4' : 'webm') : 'png';
    const file = new File([g.blob], 'myfix_' + Date.now() + '.' + ext, { type: g.blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
        try { await navigator.share({ files: [file] }); return; } catch (e) {}
    }
    const a = document.createElement('a');
    a.href = g.url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
}

/* ── Запис WebM: композит GL+HUD, звук з WebAudio ── */
let recCanvas = null, recCtx = null;
function startRec(){
    if (recState.on || !ST.running) return;
    recCanvas = recCanvas || document.createElement('canvas');
    recCanvas.width = innerWidth; recCanvas.height = innerHeight;
    recCtx = recCanvas.getContext('2d');
    const stream = recCanvas.captureStream(30);
    if (AU.ctx){
        if (!AU.recDest){ AU.recDest = AU.ctx.createMediaStreamDestination(); AU.master.connect(AU.recDest); }
        AU.recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    }
    const mimes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
    const mime = mimes.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!mime){ typeLog('ЗАПИС ТУТ НЕ ПІДТРИМУЄТЬСЯ', 'threat'); return; }
    try { recState.rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 }); }
    catch (e){ typeLog('РЕКОРДЕР ВІДМОВИВ', 'threat'); return; }
    recState.chunks = [];
    recState.rec.ondataavailable = ev => { if (ev.data && ev.data.size) recState.chunks.push(ev.data); };
    recState.rec.onstop = () => {
        const blob = new Blob(recState.chunks, { type: mime.split(';')[0] });
        gallery.unshift({ blob, url: URL.createObjectURL(blob), video: true });
        typeLog('ЗАПИС ГОТОВИЙ — ДИВИСЬ GAL', 'threat');
    };
    recState.rec.start(500);
    recState.on = true; recState.t0 = performance.now();
    recBtn.classList.add('rec');
    AU.recSnd(true);
    typeLog('ПИШУ ЕФІР', 'threat');
}
function stopRec(){
    if (!recState.on) return;
    recState.on = false;
    recBtn.classList.remove('rec');
    AU.recSnd(false);
    try { recState.rec.stop(); } catch (e) {}
}
function recTick(){
    if (!recCtx) return;
    recCtx.drawImage(GL.ok ? GL.cv : video, 0, 0, recCanvas.width, recCanvas.height);
    recCtx.drawImage(canvas, 0, 0, recCanvas.width, recCanvas.height);
}

/* ── Фліп камери ── */
async function flipCam(){
    if (!ST.running) return;
    ST.facing = ST.facing === 'environment' ? 'user' : 'environment';
    try {
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: ST.facing, width: { ideal: 960 }, height: { ideal: 540 } }, audio: false });
        video.srcObject = s;
        await video.play().catch(() => {});
        typeLog(ST.facing === 'user' ? 'ФРОНТАЛКА' : 'ТИЛОВА КАМЕРА', 'info');
    } catch (e) {
        typeLog('КАМЕРА НЕ ПЕРЕМКНУЛАСЬ', 'threat');
    }
}

const RETICLES = [drawReticle, drawPredReticle, drawMonoReticle, draw8bitReticle];

/* ── Головний цикл малювання ── */
function draw(now){
    requestAnimationFrame(draw);
    if (document.hidden) return;
    const dt = Math.min(100, now - lastFrame); lastFrame = now;
    if (now - lastGl >= 30){ GL.render(now); lastGl = now; }
    const dpr = hudDpr, W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    pulseTime += dt * 0.003; scanAngle += dt * 0.0012;

    if (now > ST.nextEW){
        ST.ew = 1; ST.nextEW = now + 22000 + Math.random() * 26000;
        AU.ewBurst();
        typeLog('РЕБ ГЛУШИТЬ ЕФІР, ТРИМАЙСЬ', 'threat');
    }
    if (ST.ew > 0){
        ST.ew = Math.max(0, ST.ew - dt / 3200);
        ewAlert.classList.add('show');
        ewBar.style.width = (ST.ew * 100) + '%';
        ewBar.classList.add('danger');
    } else {
        ewAlert.classList.remove('show');
        ewBar.style.width = '0%';
        ewBar.classList.remove('danger');
    }

    const dX = targetPos.active ? targetPos.x : innerWidth / 2;
    const dY = targetPos.active ? targetPos.y : innerHeight / 2;
    const kk = Math.min(1, dt * 0.0075);
    currentPos.x += (dX - currentPos.x) * kk;
    currentPos.y += (dY - currentPos.y) * kk;
    ST.lockF = ST.locked ? Math.min(1, ST.lockF + dt * 0.005) : Math.max(0, ST.lockF - dt * 0.0025);

    const p = ST.primary, tier = p ? getThreat(p.cls) : null;
    let rr, rg, rb;
    if (ST.locked && tier === 'HIGH'){ rr = 255; rg = 20; rb = 20; }
    else if (ST.locked && tier === 'MED'){ rr = 255; rg = 140; rb = 0; }
    else if (ST.locked){ rr = 255; rg = 220; rb = 50; }
    else if (ST.vis === 1){ rr = 255; rg = 240; rb = 205; }
    else { rr = 200; rg = 220; rb = 255; }
    if (ST.vis === 2){
        if (ST.locked){ rr = 15; rg = 13; rb = 8; }
        else { rr = 62; rg = 57; rb = 42; }
    } else if (ST.vis === 3){
        if (ST.locked){ rr = 170; rg = 205; rb = 40; }
        else { rr = 120; rg = 150; rb = 30; }
    }
    const mainColor = 'rgba(' + rr + ',' + rg + ',' + rb + ',' + (0.6 + 0.4 * ST.lockF) + ')';
    const T = coverT();

    ctx.save();
    if (glitchActive > 0){ ctx.translate((Math.random() - 0.5) * 12 * dpr, (Math.random() - 0.5) * 6 * dpr); glitchActive--; }
    if (ST.ew > 0.25) ctx.translate((Math.random() - 0.5) * 8 * dpr * ST.ew, 0);
    ctx.strokeStyle = mainColor; ctx.fillStyle = mainColor;

    drawAsm(now, dpr);
    drawSecondary(dpr, T);
    if (p && targetPos.active) drawPrimaryBox(p, dpr, T, mainColor, rr, rg, rb);
    if (ST.locked) drawChildren(dpr, T, rr, rg, rb);
    RETICLES[ST.vis](currentPos.x * dpr, currentPos.y * dpr, dpr, ST.lockF, mainColor, rr, rg, rb);
    if (ST.lockF > 0.05){
        ctx.globalAlpha = ST.lockF;
        textTick += dt * 0.04;
        drawDataBlock(currentPos.x * dpr, currentPos.y * dpr, dpr, mainColor);
        ctx.globalAlpha = 1;
    }
    if (ST.ew > 0.15) drawEwNoise(W, H, dpr);
    if (ST.vis === 3) drawGbUI(dpr, T);
    drawIndicators(now, dpr, W);
    drawCornerDeco(W, H, dpr);
    ctx.restore();
    if (recState.on) recTick();

    if (ST.locked && now > ST.nextPing){ AU.pingFor(ST.vis); ST.nextPing = now + 2300; }
    if (ST.vis === 1 && now > ST.nextClicks){ AU.clicks(); ST.nextClicks = now + 3800 + Math.random() * 4600; }
}

/* ── Керування ── */
const PTRS = new Map();
let pressT = null, pressPt = null, suppressTap = false, pinch = null;
container.addEventListener('pointerdown', e => {
    if (!ST.running) return;
    if (e.target.closest && e.target.closest('button')) return;
    if (galleryPanel.classList.contains('show')) return;
    PTRS.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (PTRS.size === 2){
        clearTimeout(pressT); pressT = null; suppressTap = true;
        if (!GL.ok){ pinch = null; return; }
        const pts = Array.from(PTRS.values());
        pinch = { d0: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), z0: ST.zoom };
        return;
    }
    suppressTap = false;
    pressPt = { x: e.clientX, y: e.clientY };
    clearTimeout(pressT);
    pressT = setTimeout(() => {
        pressT = null; suppressTap = true;
        if (!GL.ok){ typeLog('FREEZE ХОЧЕ WEBGL', 'threat'); return; }
        ST.frozen = !ST.frozen;
        AU.freezeSnd(ST.frozen);
        typeLog(ST.frozen ? 'КАДР ЗАМОРОЖЕНО' : 'КАДР ВІДПУЩЕНО', 'info');
    }, 450);
});
container.addEventListener('pointermove', e => {
    const p = PTRS.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (PTRS.size === 2 && pinch){
        const pts = Array.from(PTRS.values());
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        ST.zoom = Math.min(4, Math.max(1, pinch.z0 * d / Math.max(1, pinch.d0)));
    } else if (pressPt && pressT && Math.hypot(e.clientX - pressPt.x, e.clientY - pressPt.y) > 14){
        clearTimeout(pressT); pressT = null;
    }
});
function endPtr(e){
    PTRS.delete(e.pointerId);
    if (PTRS.size < 2) pinch = null;
    if (PTRS.size > 0) return;
    const quickTap = pressT !== null;
    clearTimeout(pressT); pressT = null;
    if (!ST.running) return;
    if (suppressTap){ suppressTap = false; return; }
    if (!quickTap) return;
    if (ST.cardVisible){
        const r = captureCard.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        if (!inside) hideCard();
        return;
    }
    if (ST.locked && ST.primary){
        capturePortrait(ST.primary);
        showCard();
        typeLog('ПОРТРЕТ Є // ' + ST.primary.cls.toUpperCase(), 'threat');
    }
}
container.addEventListener('pointerup', endPtr);
container.addEventListener('pointercancel', e => {
    PTRS.delete(e.pointerId); pinch = null;
    clearTimeout(pressT); pressT = null;
});
camBtn.addEventListener('click', flipCam);
recBtn.addEventListener('click', () => recState.on ? stopRec() : startRec());
galBtn.addEventListener('click', () => { renderGallery(); galleryPanel.classList.add('show'); });
galClose.addEventListener('click', () => galleryPanel.classList.remove('show'));
botbar.addEventListener('pointerdown', e => e.stopPropagation());
thermalBtn.addEventListener('click', () => setVision((ST.vis + 1) % 4));
muteBtn.addEventListener('click', () => {
    const mute = AU.on;
    AU.setMute(mute);
    muteBtn.classList.toggle('off', mute);
});
window.addEventListener('keydown', e => {
    if (!ST.running) return;
    const k = e.key.toLowerCase();
    if (k === 't' || k === 'е') setVision((ST.vis + 1) % 4);
    if (k === 'm' || k === 'ь') muteBtn.click();
});
document.addEventListener('visibilitychange', async () => {
    if (AU.ctx){ if (document.hidden) AU.ctx.suspend(); else if (AU.on) AU.ctx.resume(); }
    if (!document.hidden && ST.running){
        try { ST.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
});
window.addEventListener('resize', resize);
resize();
</script>
