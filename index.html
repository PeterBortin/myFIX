<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD TACTICAL v13.0 // NEURAL_OP</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.4) contrast(1.4) saturate(0); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #terminal {
            position: absolute; top: 20px; left: 20px; width: 380px; height: 180px;
            background: none; font-size: 11px; padding: 5px; overflow: hidden;
            z-index: 15; line-height: 2.0; text-transform: uppercase;
        }
        .log-entry { margin-bottom: 2px; letter-spacing: 1px; border-left: 3px solid; padding-left: 10px; }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 50px; background: none; border: 1px solid #fff; color: #fff;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 5px; transition: 0.4s;
        }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">INITIALIZE HUD v13</button>
    <div id="terminal"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const terminal = document.getElementById('terminal');

let model;
let targetPos = { x: window.innerWidth/2, y: window.innerHeight/2, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let lockFactor = 0; 
let pulseTime = 0;
let textTick = 0;
let infoLines = [];
let glitchActive = 0;
let ewIntensity = 0;

const RED_TARGETS = ['person', 'car', 'truck', 'bus', 'motorcycle'];
const GLITCH_CHARS = "!@#$%^&*()_+-=[]{}|;:,.<>?";

function glitchText(text) {
    return text.split('').map(char => 
        (Math.random() > 0.92) ? GLITCH_CHARS[Math.floor(Math.random()*GLITCH_CHARS.length)] : char
    ).join('');
}

function logToTerminal(msg) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `[OP_DATA] > ${msg}`;
    terminal.appendChild(entry);
    if (terminal.children.length > 6) terminal.removeChild(terminal.firstChild);
    glitchActive = 12;
}

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    logToTerminal("SYTEM_START...");
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        model = await cocoSsd.load();
        logToTerminal("MODEL_SYNC_OK");
        resize();
        detectFrame();
        draw();
    } catch (err) {
        logToTerminal("HARDWARE_FAILURE");
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
            const p = predictions[0];
            const [x, y, w, h] = p.bbox;
            const sX = window.innerWidth / video.videoWidth;
            const sY = window.innerHeight / video.videoHeight;

            targetPos.x = (x + w/2) * sX;
            targetPos.y = (y + h/2) * sY;
            targetPos.active = true;
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let wasLocked = isLocked;
            isLocked = dist < 140 && RED_TARGETS.includes(p.class.toLowerCase());

            if (isLocked && !wasLocked) {
                textTick = 0;
                infoLines = [
                    `TARGET: ${p.class.toUpperCase()}`,
                    `SIG_ID: ${Math.random().toString(16).slice(2,6).toUpperCase()}`,
                    `CONFID: ${Math.round(p.score * 100)}%`,
                    `SCAN_M: DYNAMIC`,
                    `STATUS: LOCKED`
                ];
                logToTerminal(`OBJECT_LOCKED: ${p.class.toUpperCase()}`);
            }
        } else {
            targetPos.active = false;
            isLocked = false;
        }
    }
    setTimeout(detectFrame, 50);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    const destX = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const destY = targetPos.active ? targetPos.y : window.innerHeight / 2;
    currentPos.x += (destX - currentPos.x) * 0.18;
    currentPos.y += (destY - currentPos.y) * 0.18;

    if (isLocked) { lockFactor = Math.min(1, lockFactor + 0.15); } 
    else { lockFactor = Math.max(0, lockFactor - 0.1); }

    pulseTime += 0.12;
    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;
    
    const r = 255;
    const gb = Math.floor(255 * (1 - lockFactor));
    const mainColor = `rgb(${r}, ${gb}, ${gb})`;
    terminal.style.color = mainColor;

    ctx.save();
    
    // РЭБ и Глитч эффекты
    if (Math.random() > 0.98) ewIntensity = 10;
    if (ewIntensity > 0 || glitchActive > 0) {
        ctx.translate((Math.random()-0.5)*15*dpr, (Math.random()-0.5)*5*dpr);
        ewIntensity--;
        if(glitchActive > 0) glitchActive--;
    }

    ctx.strokeStyle = mainColor;
    ctx.fillStyle = mainColor;
    ctx.shadowBlur = 8 * lockFactor;
    ctx.shadowColor = mainColor;

    drawComplexReticle(cx, cy, dpr, lockFactor);

    if (lockFactor > 0.1) {
        ctx.globalAlpha = lockFactor;
        drawDataBlock(cx, cy, dpr);
        ctx.globalAlpha = 1;
    }

    ctx.restore();
    requestAnimationFrame(draw);
}

function drawComplexReticle(cx, cy, dpr, lf) {
    ctx.save();
    ctx.translate(cx, cy);
    
    // 1. Внешние динамические точки (вращение)
    ctx.save();
    ctx.rotate(pulseTime * 0.5);
    for(let i=0; i<8; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.beginPath();
        ctx.arc(130 * dpr, 0, 2 * dpr, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();

    // 2. Рамки-уголки (с пульсацией)
    const s = (40 - (15 * lf)) * dpr;
    const l = (12 + (10 * lf)) * dpr;
    ctx.lineWidth = 2 * dpr;
    for(let i=0; i<4; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI/2);
        ctx.beginPath();
        ctx.moveTo(s, -s+l); ctx.lineTo(s, -s); ctx.lineTo(s-l, -s);
        ctx.stroke();
        ctx.restore();
    }

    // 3. Плавающие горизонтальные/вертикальные рамки
    const offset = (60 + Math.sin(pulseTime * 3) * 5) * dpr;
    ctx.lineWidth = 1 * dpr;
    // Горизонтальные
    ctx.beginPath(); ctx.moveTo(-20*dpr, -offset); ctx.lineTo(20*dpr, -offset); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-20*dpr, offset); ctx.lineTo(20*dpr, offset); ctx.stroke();
    // Вертикальные
    ctx.beginPath(); ctx.moveTo(-offset, -20*dpr); ctx.lineTo(-offset, 20*dpr); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(offset, -20*dpr); ctx.lineTo(offset, 20*dpr); ctx.stroke();

    // 4. Орбиты
    ctx.setLineDash([10*dpr, 20*dpr]);
    ctx.beginPath(); ctx.arc(0, 0, 100*dpr, 0, Math.PI*2); ctx.stroke();
    if(lf > 0.7) {
        ctx.setLineDash([2*dpr, 10*dpr]);
        ctx.save(); ctx.rotate(-pulseTime);
        ctx.beginPath(); ctx.arc(0, 0, 115*dpr, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
    }

    // 5. Центр
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(0, 0, 4*dpr, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

function drawDataBlock(cx, cy, dpr) {
    textTick += 0.4;
    const fontSize = 13 * dpr;
    ctx.font = `bold ${fontSize}px 'Courier New'`;
    
    infoLines.forEach((line, i) => {
        let len = Math.floor(textTick - (i * 3));
        if (len > 0) {
            let txt = "» " + line.substring(0, len);
            // Анимация глитч-символов
            if (Math.random() > 0.9) txt = glitchText(txt);
            ctx.fillText(txt, cx + 150 * dpr, cy - 50 * dpr + (i * fontSize * 2.2));
        }
    });

    // Динамический квадрат-маркер возле текста
    ctx.strokeRect(cx + 150 * dpr, cy + 90 * dpr, 80 * dpr, 15 * dpr);
    ctx.fillRect(cx + 150 * dpr, cy + 90 * dpr, (Math.sin(pulseTime*2)+1)*40 * dpr, 15 * dpr);
}

window.onresize = resize;
</script>
</body>
</html>
