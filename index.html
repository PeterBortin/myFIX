<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIX</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.4) contrast(1.4) saturate(0); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Стили терминала */
        #terminal {
            position: absolute; top: 15px; left: 15px; width: 320px; height: 240px;
            background: rgba(0, 20, 0, 0.4); font-size: 11px; padding: 10px; overflow-y: auto;
            z-index: 15; box-shadow: 0 0 15px rgba(0,255,0,0.1);
            scrollbar-width: none; line-height: 1.4;
        }
        #terminal::-webkit-scrollbar { display: none; }
        .log-entry { margin-bottom: 2px; border-bottom: 1px solid rgba(0,255,0,0.05); }
        .log-time { color: rgba(0,255,0,0.5); margin-right: 5px; }

        #overlay {
            position: absolute; bottom: 25px; left: 25px; color: #fff; 
            text-shadow: 0 0 10px #fff; font-size: 10px; z-index: 10; letter-spacing: 2px; opacity: 0.5;
        }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 18px 45px; background: none; border: 1px solid #fff; color: #fff;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 4px; transition: 0.4s;
        }
        #startBtn:hover { background: rgba(255,255,255,0.1); box-shadow: 0 0 30px rgba(255,255,255,0.4); }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">INITIALIZE SYSTEM</button>
    <div id="terminal">
        <div class="log-entry"><span class="log-time">[00:00:00]</span> SYSTEM_IDLE... WAITING FOR SYNC</div>
    </div>
    <div id="overlay">CORE_V9 // NEURAL_TERMINAL_LINKED</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const overlay = document.getElementById('overlay');
const terminal = document.getElementById('terminal');

let model;
let targetPos = { x: window.innerWidth/2, y: window.innerHeight/2, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let lockFactor = 0; 
let pulseTime = 0;
let textTick = 0;
let infoLines = [];

// Функция добавления записей в терминал
function logToTerminal(msg) {
    const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
    terminal.appendChild(entry);
    terminal.scrollTop = terminal.scrollHeight;
    
    // Ограничение в 16 строк (удаление старых если нужно)
    while (terminal.children.length > 16) {
        terminal.removeChild(terminal.firstChild);
    }
}

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    logToTerminal("BOOTING NEURAL_OS...");
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        model = await cocoSsd.load();
        logToTerminal("COCO_SSD MODEL LOADED.");
        logToTerminal("SENSOR_LINK ESTABLISHED.");
        resize();
        detectFrame();
        draw();
    } catch (err) {
        logToTerminal("FATAL: ACCESS_DENIED");
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
            const p = predictions[0];
            const [x, y, w, h] = p.bbox;
            const sX = window.innerWidth / video.videoWidth;
            const sY = window.innerHeight / video.videoHeight;

            targetPos.x = (x + w/2) * sX;
            targetPos.y = (y + h/2) * sY;
            targetPos.active = true;
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let wasLocked = isLocked;
            isLocked = dist < 110;

            if (isLocked && !wasLocked) {
                textTick = 0;
                generateInfo(p);
                logToTerminal(`LOCK_ON: ${p.class.toUpperCase()} (${Math.round(p.score*100)}%)`);
            }
        } else {
            if (isLocked) logToTerminal("TARGET_LOST...");
            targetPos.active = false;
            isLocked = false;
        }
    }
    setTimeout(detectFrame, 50);
}

function generateInfo(p) {
    infoLines = [
        `TRGT: ${p.class.toUpperCase()}`,
        `PROB: ${Math.round(p.score * 100)}%`,
        `DIST: ANALYZING`,
        `LOCK: STABLE_V9`,
        `POS: ${Math.floor(targetPos.x)}:${Math.floor(targetPos.y)}`
    ];
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    const destX = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const destY = targetPos.active ? targetPos.y : window.innerHeight / 2;
    currentPos.x += (destX - currentPos.x) * 0.15;
    currentPos.y += (destY - currentPos.y) * 0.15;

    if (isLocked && targetPos.active) {
        if (lockFactor < 1) lockFactor += 0.08;
    } else {
        if (lockFactor > 0) lockFactor -= 0.08;
    }

    pulseTime += 0.1;
    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;
    
    const colorR = 255;
    const colorG = Math.floor(255 * (1 - lockFactor));
    const colorB = Math.floor(255 * (1 - lockFactor));
    const mainColor = `rgb(${colorR}, ${colorG}, ${colorB})`;

    ctx.strokeStyle = mainColor;
    ctx.fillStyle = mainColor;
    ctx.shadowBlur = 5 + (15 * lockFactor);
    ctx.shadowColor = mainColor;

    drawCleanReticle(cx, cy, dpr, lockFactor);

    if (lockFactor > 0.1) {
        ctx.globalAlpha = lockFactor;
        drawDataBlock(cx, cy, dpr);
        ctx.globalAlpha = 1;
    }

    requestAnimationFrame(draw);
}

function drawCleanReticle(cx, cy, dpr, lf) {
    ctx.save();
    ctx.translate(cx, cy);
    
    const sPulse = 1 + (Math.sin(pulseTime) * 0.02);
    ctx.scale(sPulse, sPulse);

    if (lf > 0.1) {
        ctx.save();
        ctx.rotate(pulseTime * (0.8 + lf));
        ctx.lineWidth = 1 * dpr;
        ctx.setLineDash([20 * dpr, 80 * dpr]);
        ctx.beginPath();
        ctx.arc(0, 0, 105 * dpr, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    ctx.lineWidth = 2 * dpr;
    const cross = 8 * dpr;
    ctx.beginPath();
    ctx.moveTo(-cross, 0); ctx.lineTo(cross, 0);
    ctx.moveTo(0, -cross); ctx.lineTo(0, cross);
    ctx.stroke();

    const size = (32 - (8 * lf)) * dpr; 
    const depth = (8 + (12 * lf)) * dpr; 
    
    for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(size, -size + depth);
        ctx.lineTo(size, -size);
        ctx.lineTo(size - depth, -size);
        ctx.stroke();
        ctx.restore();
    }

    ctx.lineWidth = 3 * dpr;
    ctx.beginPath();
    ctx.arc(0, 0, 85 * dpr, 0.82 * Math.PI, 1.18 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 85 * dpr, -0.18 * Math.PI, 0.18 * Math.PI);
    ctx.stroke();

    ctx.restore();
}

function drawDataBlock(cx, cy, dpr) {
    textTick += 0.45;
    const fontSize = 13 * dpr;
    ctx.font = `bold ${fontSize}px 'Courier New'`;
    ctx.textAlign = 'left';

    infoLines.forEach((line, i) => {
        let count = Math.floor(textTick - (i * 4));
        if (count > 0) {
            ctx.fillText("» " + line.substring(0, count), cx + 130 * dpr, cy - 35 * dpr + (i * fontSize * 1.6));
        }
    });

    if (Math.floor(pulseTime * 5) % 2 === 0) {
        ctx.fillRect(cx + 130 * dpr, cy + 50 * dpr, 12 * dpr, 2 * dpr);
    }
}

window.onresize = resize;
</script>
</body>
</html>
