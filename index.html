:root {
  --red:    #ff2020;
  --red-dim: rgba(255,32,32,0.15);
  --cyan:   #00f5ff;
  --green:  #00ff88;
  --white:  #ffffff;
  --dim:    rgba(255,255,255,0.08);
  --glow:   0 0 12px rgba(255,32,32,0.6);
  --mono:   'IBM Plex Mono', monospace;
  --sans:   'Rajdhani', sans-serif;
  --orb:    'Orbitron', monospace;
}

body {
  margin: 0; background: #000;
  overflow: hidden;
  font-family: var(--mono);
  user-select: none;
  cursor: crosshair;
}

#container { position: relative; width: 100vw; height: 100vh; }

/* ── VIDEO (COCO-SSD background) ── */
#video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  filter: brightness(0.45) contrast(1.3) saturate(0.1) hue-rotate(180deg);
  z-index: 0;
}

/* ── FACE CANVAS (MediaPipe overlay) ── */
#faceCanvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 1;
  pointer-events: none;
}

/* ── HUD CANVAS (reticle / boxes) ── */
#hudCanvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 2;
}

/* ── SCANLINES ── */
#scanlines {
  position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(
    0deg,
    transparent, transparent 3px,
    rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
  );
  animation: scanScroll 8s linear infinite;
}
@keyframes scanScroll { from { background-position: 0 0; } to { background-position: 0 100px; } }

/* ── VIGNETTE ── */
#vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
}

/* ── TOP BAR (removed) ── */

/* ── BOTTOM BAR ── */
#botbar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
  background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; z-index: 15; border-top: 1px solid rgba(255,255,255,0.07);
}
.coords { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; }

/* ── TERMINAL ── */
#terminal {
  position: absolute; bottom: 50px; left: 15px;
  width: 300px; max-height: 200px;
  overflow: hidden; z-index: 15;
}
.log-entry {
  font-size: 10px; letter-spacing: 0.8px; line-height: 1.9;
  display: flex; gap: 8px; align-items: baseline;
  animation: fadeIn 0.3s ease;
  color: rgba(255,255,255,0.9);
}
.log-entry.threat { color: #ff4040; text-shadow: 0 0 6px rgba(255,32,32,0.6); }
.log-entry.info   { color: rgba(255,255,255,0.9); }
.log-entry.speech { color: #00ff88; text-shadow: 0 0 6px rgba(0,255,136,0.5); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
.log-ts     { color: rgba(255,255,255,0.28); flex-shrink: 0; font-size: 9px; }
.log-prefix { color: rgba(255,255,255,0.2); }

#cursor {
  display: inline-block; width: 7px; height: 12px;
  background: rgba(255,255,255,0.5);
  animation: blink 0.8s steps(1) infinite;
  vertical-align: middle; margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── STATUS PANEL (right) ── */
#statusPanel {
  position: absolute; top: 50px; right: 15px;
  width: 200px; z-index: 15;
  display: flex; flex-direction: column; gap: 6px;
}
.sp-row {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding-bottom: 4px;
}
.sp-key {
  font-family: var(--sans); font-size: 9px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3);
}
.sp-val {
  font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.65);
  letter-spacing: 1px;
}
.sp-val.active { color: var(--red); text-shadow: 0 0 8px var(--red); }
.sp-val.face-active { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

.bar-wrap { width: 80px; height: 3px; background: rgba(255,255,255,0.1); position: relative; }
.bar-fill {
  height: 100%; background: rgba(255,255,255,0.5);
  transition: width 0.3s ease;
}
.bar-fill.danger { background: var(--red); box-shadow: 0 0 6px var(--red); }
.bar-fill.face   { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

/* ── START BUTTON ── */
#startBtn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: none; border: none; color: #fff;
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 5px; text-transform: uppercase;
  cursor: pointer; z-index: 20; outline: none; padding: 0;
}
#startBtn .btn-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }
#startBtn .btn-ring { width: 80px; height: 80px; position: relative; display: flex; align-items: center; justify-content: center; }
.ring-svg  { position: absolute; inset: 0; animation: spinRing 4s linear infinite; }
.ring-svg2 { position: absolute; inset: 6px; animation: spinRing 7s linear infinite reverse; }
@keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
#startBtn .btn-text { letter-spacing: 6px; opacity: 0.7; }
#startBtn:hover .btn-text { opacity: 1; }
#startBtn:hover .ring-svg { animation-duration: 1.5s; }

/* ── COMPASS (removed) ── */

/* ── THREAT BOX ── */
#threatBox {
  position: absolute; top: 50%; right: 220px;
  transform: translateY(-50%);
  z-index: 15; width: 180px;
  opacity: 0; transition: opacity 0.4s;
}
#threatBox.show { opacity: 1; }
.tb-header {
  font-family: var(--sans); font-size: 9px; font-weight: 700;
  letter-spacing: 3px; color: var(--red); border-bottom: 1px solid rgba(255,32,32,0.3);
  padding-bottom: 6px; margin-bottom: 8px; text-transform: uppercase;
}
.tbi { font-size: 10px; color: rgba(255,255,255,0.65); letter-spacing: 1px; line-height: 2; }
.tbi-key { color: rgba(255,255,255,0.3); font-size: 9px; }

/* ── EW ALERT ── */
#ewAlert {
  position: absolute; top: 50px; right: 220px;
  font-family: var(--sans); font-size: 9px; font-weight: 700;
  letter-spacing: 3px; color: var(--red);
  opacity: 0; transition: opacity 0.2s;
  z-index: 15; text-transform: uppercase;
}
#ewAlert.show { opacity: 1; }

/* ── FACE INFO (above forehead) ── */
#face-info {
  position: absolute; z-index: 12; pointer-events: none;
  font-size: 9px; letter-spacing: 1.5px; line-height: 1.8;
  color: var(--cyan); opacity: 0; transition: opacity 0.3s;
  text-align: center; transform: translateX(-50%);
  white-space: nowrap;
  text-shadow: 0 0 8px var(--cyan);
}
#face-info.visible { opacity: 1; }
#face-info span { display: block; }
@keyframes glitchText {
  0%  { clip-path: inset(0 0 90% 0); transform: translateX(-50%) translate(-2px,0); }
  15% { clip-path: inset(30% 0 50% 0); transform: translateX(-50%) translate(2px,0); }
  30% { clip-path: inset(70% 0 10% 0); transform: translateX(-50%) translate(-1px,0); }
  50%,100% { clip-path: none; transform: translateX(-50%); }
}
#face-info.glitch { animation: glitchText .35s steps(1); }

/* ── FACE TARGET LABEL ── */
#face-target-label {
  position: absolute; top: calc(50% + 74px); left: 50%; transform: translateX(-50%);
  font-family: var(--orb); font-size: 9px; letter-spacing: 4px; color: var(--cyan);
  opacity: 0; transition: opacity 0.3s; white-space: nowrap;
  text-shadow: 0 0 10px var(--cyan); pointer-events: none; z-index: 15;
}
#face-target-label.visible { opacity: 1; }

/* ── FACE METRICS (left side) ── */
#faceMetrics {
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  z-index: 15; pointer-events: none;
  display: flex; flex-direction: column; gap: 16px;
  opacity: 0; transition: opacity 0.5s;
}
#faceMetrics.visible { opacity: 1; }
.metric-block { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.metric-label { font-size: 7px; letter-spacing: 3px; color: rgba(0,245,255,0.4); }
.metric-bar { width: 80px; height: 2px; background: rgba(0,245,255,0.1); position: relative; overflow: hidden; }
.metric-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transition: width 0.4s ease; }
.metric-value { font-size: 9px; letter-spacing: 2px; color: var(--cyan); }

/* ── ACQUIRED FLASH ── */
#acquired-flash {
  position: absolute; inset: 0; pointer-events: none; z-index: 16; opacity: 0;
}
#acquired-flash.flash { animation: aFlash 0.6s ease forwards; }
@keyframes aFlash { 0%{opacity:0;background:rgba(0,255,136,0.12)} 30%{opacity:1} 100%{opacity:0} }

/* ── AUDIO VISUALIZER ── */
#audioVizWrap {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  width: min(400px, 60vw); z-index: 15; pointer-events: none;
  opacity: 0; transition: opacity 0.5s;
}
#audioVizWrap.visible { opacity: 1; }
#audioVizLabel {
  font-size: 7px; letter-spacing: 3px; color: rgba(0,245,255,0.3);
  text-align: right; margin-bottom: 3px;
}
#audioVisualizer { width: 100%; height: 40px; display: block; }

/* ── LIVE SPEECH BOX ── */
#liveSpeechBox {
  position: absolute; bottom: 42px; left: 50%; transform: translateX(-50%);
  font-family: var(--orb); font-size: clamp(11px, 2vw, 16px); font-weight: 700;
  letter-spacing: 3px; color: #fff; white-space: nowrap;
  text-shadow: 0 0 20px rgba(255,255,255,0.4);
  z-index: 16; pointer-events: none;
  opacity: 0; transition: opacity 0.3s, color 0.3s;
}
#liveSpeechBox.visible { opacity: 1; }
#liveSpeechBox.speaking { color: var(--green); text-shadow: 0 0 20px var(--green); }

/* ── HUD BUTTONS (top-right, fixed) ── */
#hudButtons {
  position: fixed; top: 15px; right: 15px;

  flex-direction: row;
}
#hudButtons.visible { display: flex; }
.ui-btn {
  font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
  cursor: pointer; text-transform: uppercase; pointer-events: all;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(10px);
  border: 1px solid rgba(0,245,255,0.3); color: rgba(0,245,255,0.7);

}
.ui-btn .st-a, .ui-btn .st-b { display: block; transition: transform .25s, opacity .25s; }
.ui-btn .st-b { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) translateY(14px); opacity: 0; white-space: nowrap; }
.ui-btn:hover .st-a { transform: translateY(-14px); opacity: 0; }
.ui-btn:hover .st-b { transform: translate(-50%,-50%) translateY(0); opacity: 1; }
.ui-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(0,245,255,0.3); }
.ui-btn.lang-active { border-color: rgba(0,255,136,0.5); color: var(--green); }

/* ── FACE STATUS ROW in statusPanel ── */
.sp-separator {
  border-top: 1px solid rgba(0,245,255,0.15);
  margin: 4px 0;
}

/* ═══════════════════════════════════════════════════
   THREAT CLASSIFICATION (COCO-SSD)
═══════════════════════════════════════════════════ */
const THREAT = {
  HIGH:   ['person','car','truck','bus','motorcycle','airplane','boat','train'],
  MEDIUM: ['bicycle','horse','cow','dog','cat','bird','sheep','bear','elephant','zebra','giraffe'],
  LOW:    ['backpack','handbag','suitcase','bottle','wine glass','cup','fork','knife',
           'scissors','laptop','cell phone','remote','keyboard','mouse','chair','couch',
           'tv','clock','book','umbrella','fire hydrant','stop sign','parking meter',
           'bench','potted plant','dining table','toilet','bed','refrigerator',
           'oven','microwave','toaster','sink','baseball bat','baseball glove',
           'skateboard','surfboard','tennis racket','sports ball','frisbee',
           'snowboard','skis','kite','vase','tie','hair drier',
           'toothbrush','teddy bear','traffic light','orange','apple','sandwich',
           'broccoli','carrot','hot dog','pizza','donut','cake','banana']
};
function getThreat(cls) {
  if (THREAT.HIGH.includes(cls))   return 'HIGH';
  if (THREAT.MEDIUM.includes(cls)) return 'MED';
  return 'LOW';
}

/* ═══════════════════════════════════════════════════
   DOM REFS
═══════════════════════════════════════════════════ */
const video       = document.getElementById('video');
const faceVideo   = document.getElementById('faceVideo');
const hudCanvas   = document.getElementById('hudCanvas');
const faceCanvas  = document.getElementById('faceCanvas');
const hCtx        = hudCanvas.getContext('2d');
const fCtx        = faceCanvas.getContext('2d');
const startBtn    = document.getElementById('startBtn');
const terminal    = document.getElementById('terminal');
const cursor      = document.getElementById('cursor');

/* ═══════════════════════════════════════════════════
   COCO-SSD STATE
═══════════════════════════════════════════════════ */
let cocoModel;
let allPredictions = [];
let primaryTarget  = null;
let currentPos  = { x: window.innerWidth/2,  y: window.innerHeight/2 };
let targetPos   = { x: window.innerWidth/2,  y: window.innerHeight/2, active: false };
let isLocked    = false;
let lockFactor  = 0;
let pulseTime   = 0;
let scanAngle   = 0;
let textTick    = 0;
let infoLines   = [];
let glitchActive = 0;
let ewIntensity  = 0;
let ewTimer      = 0;

/* ═══════════════════════════════════════════════════
   FACE STATE
═══════════════════════════════════════════════════ */
let faceMeshModel    = null;
let camInstance      = null;
let facingMode       = 'user';
let mirrorX          = true;
let prevFaceTarget   = false;
let acquiredLogged   = false;
let isSpeaking       = false;
let recognition      = null;
let recRestarting    = false;
let currentLang      = 'ru-RU';
let _SR              = null;
let faceFrameCount   = 0;
let lastFpsFaceTime  = performance.now();
let audioCtxNode, analyser, freqData;
let activeStream     = null;
let logHistory       = [];

// Face info typing state
let frameGlitch    = false;
let frameGlitchEnd = 0;
let typeLines      = ['', '', ''];
let typeTargets    = ['ID: --', 'CONF: --', 'SCAN: ACTIVE'];
let typeIdx = 0, typeCharIdx = 0, typeTimer = 0, typeDone = false;

/* ═══════════════════════════════════════════════════
   TERMINAL LOGGER (typed, unified)
═══════════════════════════════════════════════════ */
function ts() {
  const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}

const logQueue = [];
let logBusy = false;

async function typeLog(msg, cls = 'info') {
  await new Promise(res => {
    logQueue.push({ msg, cls, res });
    if (!logBusy) drainLog();
  });
}

function addInstantLog(msg, cls = 'info') {
  const entry = document.createElement('div');
  entry.className = `log-entry ${cls}`;
  const tsSpan = document.createElement('span');
  tsSpan.className = 'log-ts';
  tsSpan.textContent = ts();
  const pre = document.createElement('span');
  pre.className = 'log-prefix';
  pre.textContent = '›';
  const txt = document.createElement('span');
  txt.textContent = msg;
  entry.appendChild(tsSpan);
  entry.appendChild(pre);
  entry.appendChild(txt);
  terminal.insertBefore(entry, cursor);
  while (terminal.querySelectorAll('.log-entry').length > 14)
    terminal.removeChild(terminal.querySelector('.log-entry'));
  terminal.scrollTop = terminal.scrollHeight;
  logHistory.push(`[${ts()}] ${msg.toUpperCase()}`);
}

async function drainLog() {
  if (logQueue.length === 0) { logBusy = false; return; }
  logBusy = true;
  const { msg, cls, res } = logQueue.shift();
  const entry = document.createElement('div');
  entry.className = `log-entry ${cls}`;
  const tsSpan = document.createElement('span');
  tsSpan.className = 'log-ts'; tsSpan.textContent = ts();
  const pre = document.createElement('span');
  pre.className = 'log-prefix'; pre.textContent = '›';
  const txt = document.createElement('span');
  entry.appendChild(tsSpan); entry.appendChild(pre); entry.appendChild(txt);
  terminal.insertBefore(entry, cursor);
  while (terminal.querySelectorAll('.log-entry').length > 14)
    terminal.removeChild(terminal.querySelector('.log-entry'));
  for (let i = 0; i <= msg.length; i++) {
    txt.textContent = msg.substring(0, i);
    await new Promise(r => setTimeout(r, 18));
  }
  logHistory.push(`[${ts()}] ${msg.toUpperCase()}`);
  res();
  drainLog();
}

startBtn.onclick = async () => {

  document.getElementById('statusPanel').style.display = 'flex';

  await typeLog('BOOT SEQUENCE INITIATED', 'info');
  await typeLog('REQUESTING SENSOR ACCESS..', 'info');

  try {
    // Request audio + video together for MediaPipe + COCO-SSD + audio
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    activeStream = stream;

    // Feed both video elements from the same stream
    video.srcObject = stream;
    faceVideo.srcObject = stream;
    await Promise.all([
      new Promise(r => { video.onloadedmetadata = r; }),
      new Promise(r => { faceVideo.onloadedmetadata = r; })
    ]);
    await typeLog('OPTICAL SENSOR OK', 'info');

    // Audio analyser
    audioCtxNode = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtxNode.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    audioCtxNode.createMediaStreamSource(stream).connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('audioStat').textContent  = 'ACTIVE';
    document.getElementById('audioVizWrap').classList.add('visible');
    document.getElementById('liveSpeechBox').classList.add('visible');
    startEQ();
    await typeLog('AUDIO SUBSYSTEM OK', 'info');

  } catch(e) {
    await typeLog('SENSOR LINK FAILED', 'threat');

  }

  // COCO-SSD
  await typeLog('LOADING NEURAL NETWORK..', 'info');
  cocoModel = await cocoSsd.load();
  document.getElementById('modelStat').textContent = 'COCO-SSD';
  await typeLog('COCO-SSD ONLINE -- 80 CLASS', 'info');

  // MediaPipe Face Mesh
  await typeLog('LOADING FACE MESH ENGINE..', 'info');
  initFaceMesh();
  await typeLog('FACE MESH ONLINE -- 478 PTS', 'info');
  await typeLog('SCANNING...', 'info');

  // Speech
  initSpeech();

  // Show HUD buttons
  document.getElementById('hudButtons').classList.add('visible');

  resize();

  drawHUD();

function resize() {

  hudCanvas.width  = window.innerWidth  * dpr;
  hudCanvas.height = window.innerHeight * dpr;
}
window.onresize = resize;

/* ═══════════════════════════════════════════════════
   COCO-SSD DETECTION LOOP
═══════════════════════════════════════════════════ */
async function cocoDetectLoop() {
  if (cocoModel && video.readyState >= 3) {
    try {
      allPredictions = await cocoModel.detect(video);
      primaryTarget  = allPredictions.length > 0 ? allPredictions[0] : null;
    } catch { /* ignore */ }
  }

  if (primaryTarget) {
    const p = primaryTarget;
    const [x, y, w, h] = p.bbox;
    const sX = window.innerWidth  / (video.videoWidth  || 1);
    const sY = window.innerHeight / (video.videoHeight || 1);
    targetPos.x = (x + w/2) * sX;
    targetPos.y = (y + h/2) * sY;
    targetPos.active = true;

    const dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
    const wasLocked = isLocked;
    isLocked = dist < 130;

    if (isLocked && !wasLocked) {
      textTick = 0;
      buildInfo(p);
      document.getElementById('threatBox').classList.add('show');
      document.getElementById('lockStat').textContent = p.class.toUpperCase();
      document.getElementById('lockStat').className   = 'sp-val active';
      glitchActive = 12;
      typeLog(`LOCK -- ${p.class.toUpperCase()} [${getThreat(p.class.toLowerCase())}]`, getThreat(p.class.toLowerCase()) === 'LOW' ? 'info' : 'threat');
    }
    if (!isLocked && wasLocked) {
      document.getElementById('threatBox').classList.remove('show');
      document.getElementById('lockStat').textContent = '--';
      document.getElementById('lockStat').className   = 'sp-val';
    }

    document.getElementById('objCount').textContent = String(allPredictions.length).padStart(2,'0');
    document.getElementById('targStat').textContent = allPredictions.length;
    document.getElementById('confBar').style.width  = Math.round(p.score*100)+'%';
    document.getElementById('confBar').className    = 'bar-fill' + (isLocked ? ' danger' : '');

  } else {
    targetPos.active = false;
    isLocked = false;
    document.getElementById('objCount').textContent = '00';
    document.getElementById('targStat').textContent = '0';
    document.getElementById('confBar').style.width  = '0%';
    document.getElementById('threatBox').classList.remove('show');
    document.getElementById('lockStat').textContent = '--';
    document.getElementById('lockStat').className   = 'sp-val';
  }
  setTimeout(cocoDetectLoop, 80);
}

function buildInfo(p) {
  const tier = getThreat(p.class.toLowerCase());
  infoLines = [
    { k: 'CLASS',  v: p.class.toUpperCase() },
    { k: 'THREAT', v: tier },
    { k: 'CONF',   v: Math.round(p.score*100)+'%' },
    { k: 'ID',     v: '0x'+Math.random().toString(16).slice(2,8).toUpperCase() },
    { k: 'SECTOR', v: `${String.fromCharCode(65+Math.floor(Math.random()*6))}${Math.floor(Math.random()*9+1)}` },
    { k: 'STATUS', v: 'LOCKED' },
  ];
  const tl = document.getElementById('threatLines');
  tl.innerHTML = '';
  infoLines.forEach(l => {
    const row = document.createElement('div');
    row.className = 'tbi';
    row.innerHTML = `<span class="tbi-key">${l.k}</span>  ${l.v}`;
    tl.appendChild(row);
  });
}

/* ═══════════════════════════════════════════════════
   HUD DRAW LOOP (hudCanvas)
═══════════════════════════════════════════════════ */
function drawHUD() {
  hCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  const dpr = window.devicePixelRatio;
  const W = hudCanvas.width, H = hudCanvas.height;

  const destX = targetPos.active ? targetPos.x : window.innerWidth/2;
  const destY = targetPos.active ? targetPos.y : window.innerHeight/2;
  currentPos.x += (destX - currentPos.x) * 0.12;
  currentPos.y += (destY - currentPos.y) * 0.12;

  lockFactor = isLocked
    ? Math.min(1, lockFactor + 0.08)
    : Math.max(0, lockFactor - 0.04);

  pulseTime += 0.05;
  scanAngle += 0.02;

  const tier = primaryTarget ? getThreat(primaryTarget.class.toLowerCase()) : null;
  let rr = 200, rg = 220, rb = 255;
  if (isLocked) {
    if (tier === 'HIGH')       { rr=255; rg=20;  rb=20;  }
    else if (tier === 'MED')   { rr=255; rg=140; rb=0;   }
    else                       { rr=255; rg=220; rb=50;  }
  }
  const alpha = 0.6 + 0.4 * lockFactor;
  const mainColor = `rgba(${rr},${rg},${rb},${alpha})`;

  // EW
  ewTimer++;
  if (ewTimer % 220 === 0) ewIntensity = 20;
  if (ewIntensity > 0) {
    ewIntensity = Math.max(0, ewIntensity - 0.7);
    document.getElementById('ewAlert').classList.add('show');
    document.getElementById('ewBar').style.width = (ewIntensity/20*100)+'%';
    document.getElementById('ewBar').classList.add('danger');
  } else {
    document.getElementById('ewAlert').classList.remove('show');
    document.getElementById('ewBar').style.width = '0%';
    document.getElementById('ewBar').classList.remove('danger');
  }

  hCtx.save();

  if (glitchActive > 0) {
    hCtx.translate((Math.random()-0.5)*12*dpr, (Math.random()-0.5)*6*dpr);
    glitchActive--;
  }
  if (ewIntensity > 5) {
    hCtx.translate((Math.random()-0.5)*8*dpr*(ewIntensity/20), 0);
  }

  hCtx.strokeStyle = mainColor;
  hCtx.fillStyle   = mainColor;
  hCtx.shadowBlur  = 8 + 12*lockFactor;
  hCtx.shadowColor = mainColor;

  const cx = currentPos.x * dpr;
  const cy = currentPos.y * dpr;

  // Secondary detections
  if (allPredictions.length > 1) {
    hCtx.save();
    hCtx.shadowBlur = 3;
    for (let i = 1; i < allPredictions.length; i++) {
      const p = allPredictions[i];
      const [bx,by,bw,bh] = p.bbox;
      const sX = window.innerWidth/(video.videoWidth||1);
      const sY = window.innerHeight/(video.videoHeight||1);
      const rx=bx*sX*dpr, ry=by*sY*dpr, rw=bw*sX*dpr, rh=bh*sY*dpr;
      const t = getThreat(p.class.toLowerCase());
      hCtx.strokeStyle = t==='HIGH' ? 'rgba(255,80,80,0.4)'
                       : t==='MED'  ? 'rgba(255,160,0,0.35)'
                                    : 'rgba(200,200,255,0.25)';
      hCtx.shadowColor = hCtx.strokeStyle;
      hCtx.lineWidth = 1*dpr;
      hCtx.setLineDash([4*dpr,4*dpr]);
      hCtx.strokeRect(rx,ry,rw,rh);
      hCtx.setLineDash([]);
      hCtx.fillStyle = hCtx.strokeStyle;
      hCtx.font = `${9*dpr}px 'IBM Plex Mono'`;
      hCtx.fillText(p.class.toUpperCase(), rx+4*dpr, ry-4*dpr);
    }
    hCtx.restore();
  }

  // Primary target bounding box
  if (primaryTarget && targetPos.active) {
    const p = primaryTarget;
    const [bx,by,bw,bh] = p.bbox;
    const sX = window.innerWidth/(video.videoWidth||1);
    const sY = window.innerHeight/(video.videoHeight||1);
    const rx=bx*sX*dpr, ry=by*sY*dpr, rw=bw*sX*dpr, rh=bh*sY*dpr;
    hCtx.save();
    hCtx.strokeStyle = mainColor;
    hCtx.shadowColor = mainColor;
    hCtx.lineWidth   = 1.5*dpr;
    hCtx.shadowBlur  = 10*lockFactor;
    const cLen = Math.min(rw,rh)*0.22;
    hCtx.beginPath();
    hCtx.moveTo(rx, ry+cLen); hCtx.lineTo(rx, ry); hCtx.lineTo(rx+cLen, ry);
    hCtx.moveTo(rx+rw-cLen, ry); hCtx.lineTo(rx+rw, ry); hCtx.lineTo(rx+rw, ry+cLen);
    hCtx.moveTo(rx+rw, ry+rh-cLen); hCtx.lineTo(rx+rw, ry+rh); hCtx.lineTo(rx+rw-cLen, ry+rh);
    hCtx.moveTo(rx+cLen, ry+rh); hCtx.lineTo(rx, ry+rh); hCtx.lineTo(rx, ry+rh-cLen);
    hCtx.stroke();
    hCtx.fillStyle = `rgba(${rr},${rg},${rb},${0.03+0.04*lockFactor})`;
    hCtx.fillRect(rx,ry,rw,rh);
    if (lockFactor > 0.4) {
      hCtx.setLineDash([3*dpr,5*dpr]);
      hCtx.lineWidth = 0.5*dpr;
      hCtx.strokeStyle = `rgba(${rr},${rg},${rb},0.3)`;
      hCtx.beginPath();
      hCtx.moveTo(rx-20*dpr, ry); hCtx.lineTo(rx-20*dpr, ry+rh);
      hCtx.moveTo(rx, ry-12*dpr); hCtx.lineTo(rx+rw, ry-12*dpr);
      hCtx.stroke();
      hCtx.setLineDash([]);
      hCtx.fillStyle = `rgba(${rr},${rg},${rb},0.5)`;
      hCtx.font = `${8*dpr}px 'Share Tech Mono'`;
      hCtx.fillText(`${Math.round(rh/dpr)}px`, rx-18*dpr, ry+rh/2, 16*dpr);
      hCtx.fillText(`${Math.round(rw/dpr)}px`, rx+rw/2-12*dpr, ry-14*dpr);
    }
    hCtx.restore();
  }

  hCtx.strokeStyle = mainColor;
  hCtx.fillStyle   = mainColor;
  hCtx.shadowColor = mainColor;
  hCtx.shadowBlur  = 8 + 14*lockFactor;

  drawReticle(cx, cy, dpr, lockFactor, mainColor, rr, rg, rb);

  if (lockFactor > 0.05) {
    hCtx.globalAlpha = lockFactor;
    drawDataBlock(cx, cy, dpr, mainColor);
    hCtx.globalAlpha = 1;
  }

  // EW noise
  if (ewIntensity > 3) {
    const n = Math.round(ewIntensity * 0.8);
    for (let i=0;i<n;i++) {
      hCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.15})`;
      hCtx.fillRect(Math.random()*W, Math.random()*H, (1+Math.random()*2)*dpr, dpr);
    }
    for (let i=0;i<3;i++) {
      const hy = Math.random()*H;
      hCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.08})`;
      hCtx.fillRect(0, hy, W, (0.5+Math.random())*dpr);
    }
  }

  drawCornerDeco(W, H, dpr);
  hCtx.restore();
  requestAnimationFrame(drawHUD);
}

/* ── RETICLE ── */
function drawReticle(cx, cy, dpr, lf, mainColor, rr, rg, rb) {
  hCtx.save();
  hCtx.translate(cx, cy);

  hCtx.strokeStyle = `rgba(${rr},${rg},${rb},0.2)`;
  hCtx.lineWidth   = 0.5*dpr;
  hCtx.shadowBlur  = 0;
  hCtx.beginPath(); hCtx.arc(0,0,110*dpr,0,Math.PI*2); hCtx.stroke();

  if (lf > 0.1) {
    const pulse = 0.5+0.5*Math.sin(pulseTime*2);
    hCtx.strokeStyle = `rgba(${rr},${rg},${rb},${0.08+0.1*pulse*lf})`;
    hCtx.lineWidth   = 0.5*dpr;
    for (const r of [60,80,100]) {
      hCtx.beginPath(); hCtx.arc(0,0,r*dpr,0,Math.PI*2); hCtx.stroke();
    }
  }

  if (lf > 0.15) {
    hCtx.save();
    hCtx.rotate(pulseTime*1.5);
    hCtx.strokeStyle = `rgba(${rr},${rg},${rb},${0.3+0.3*lf})`;
    hCtx.lineWidth   = 1.5*dpr; hCtx.shadowBlur = 6*lf; hCtx.shadowColor = mainColor;
    hCtx.setLineDash([18*dpr,50*dpr]);
    hCtx.beginPath(); hCtx.arc(0,0,95*dpr,0,Math.PI*2); hCtx.stroke();
    hCtx.restore();
  }
  if (lf > 0.3) {
    hCtx.save();
    hCtx.rotate(-pulseTime*0.8);
    hCtx.strokeStyle = `rgba(${rr},${rg},${rb},${0.15+0.15*lf})`;
    hCtx.lineWidth   = 0.8*dpr;
    hCtx.setLineDash([6*dpr,20*dpr]);
    hCtx.beginPath(); hCtx.arc(0,0,75*dpr,0,Math.PI*2); hCtx.stroke();
    hCtx.restore();
  }
  hCtx.setLineDash([]);

  const bracketSize  = (28-8*lf)*dpr;
  const bracketDepth = (8+14*lf)*dpr;
  hCtx.strokeStyle = mainColor; hCtx.lineWidth = 2.5*dpr;
  hCtx.shadowBlur  = 10*lf;   hCtx.shadowColor = mainColor;
  for (let i=0;i<4;i++) {
    hCtx.save(); hCtx.rotate(i*Math.PI/2);
    hCtx.beginPath();
    hCtx.moveTo(bracketSize, -bracketSize+bracketDepth);
    hCtx.lineTo(bracketSize, -bracketSize);
    hCtx.lineTo(bracketSize-bracketDepth, -bracketSize);
    hCtx.stroke(); hCtx.restore();
  }

  hCtx.lineWidth = 1.5*dpr; hCtx.shadowBlur = 6;
  const c=7*dpr, gap=4*dpr;
  hCtx.beginPath();
  hCtx.moveTo(-c,0); hCtx.lineTo(-gap,0);
  hCtx.moveTo(gap,0); hCtx.lineTo(c,0);
  hCtx.moveTo(0,-c); hCtx.lineTo(0,-gap);
  hCtx.moveTo(0,gap); hCtx.lineTo(0,c);
  hCtx.stroke();

  hCtx.shadowBlur = 12*lf;
  hCtx.beginPath(); hCtx.arc(0,0,2.5*dpr,0,Math.PI*2); hCtx.fill();

  hCtx.strokeStyle = `rgba(${rr},${rg},${rb},0.5)`;
  hCtx.lineWidth   = 1*dpr; hCtx.shadowBlur = 0;
  for (let a=0;a<360;a+=15) {
    const rad=a*Math.PI/180;
    const inner=a%90===0?115*dpr:a%45===0?112*dpr:110.5*dpr;
    hCtx.beginPath();
    hCtx.moveTo(Math.cos(rad)*inner, Math.sin(rad)*inner);
    hCtx.lineTo(Math.cos(rad)*118*dpr, Math.sin(rad)*118*dpr);
    hCtx.stroke();
  }

  if (lf > 0.5) {
    const burst=(lf-0.5)*2;
    hCtx.strokeStyle = `rgba(${rr},${rg},${rb},${0.15*burst})`;
    hCtx.lineWidth   = 0.5*dpr;
    for (let a=0;a<360;a+=30) {
      const rad=a*Math.PI/180;
      hCtx.beginPath();
      hCtx.moveTo(Math.cos(rad)*120*dpr, Math.sin(rad)*120*dpr);
      hCtx.lineTo(Math.cos(rad)*(120+30*burst)*dpr, Math.sin(rad)*(120+30*burst)*dpr);
      hCtx.stroke();
    }
  }

  if (lf < 0.8) {
    hCtx.save(); hCtx.rotate(scanAngle);
    const sg = hCtx.createLinearGradient(0,-100*dpr,0,0);
    sg.addColorStop(0,`rgba(${rr},${rg},${rb},0.0)`);
    sg.addColorStop(1,`rgba(${rr},${rg},${rb},${0.08*(1-lf)})`);
    hCtx.fillStyle = sg;
    hCtx.beginPath(); hCtx.moveTo(0,0); hCtx.arc(0,0,108*dpr,-0.5,0.5); hCtx.closePath();
    hCtx.fill(); hCtx.restore();
  }

  hCtx.restore();
}

function drawDataBlock(cx, cy, dpr, mainColor) {
  textTick += 0.6;
  const fs = 11*dpr;
  hCtx.font = `${fs}px 'IBM Plex Mono'`;
  hCtx.shadowBlur = 4; hCtx.shadowColor = mainColor;
  infoLines.forEach((l,i) => {
    const chars = Math.floor(textTick - i*4);
    if (chars <= 0) return;
    let line = (l.k+': '+l.v).substring(0, chars);
    if (ewIntensity > 8 && Math.random() > 0.6) {
      line = line.replace(/[A-Z0-9]/g, c => Math.random()>0.6 ? String.fromCharCode(33+Math.random()*20) : c);
    }
    hCtx.fillText('› '+line, cx+120*dpr, cy-30*dpr+i*fs*1.6);
  });
  if (Math.random() > 0.85) {
    hCtx.globalAlpha = 0.3;
    hCtx.fillRect(cx+115*dpr, cy+40*dpr, Math.random()*50*dpr, 1.5*dpr);
    hCtx.globalAlpha = 1;
  }
}

function drawCornerDeco(W, H, dpr) {
  const s=30*dpr, t=1*dpr;
  hCtx.strokeStyle = 'rgba(255,255,255,0.12)';
  hCtx.lineWidth   = t; hCtx.shadowBlur = 0; hCtx.setLineDash([]);
  const corners = [[0,0,1,1],[W,0,-1,1],[W,H,-1,-1],[0,H,1,-1]];
  for (const [x,y,sx,sy] of corners) {
    hCtx.beginPath();
    hCtx.moveTo(x+sx*s,y); hCtx.lineTo(x,y); hCtx.lineTo(x,y+sy*s);
    hCtx.stroke();
  }
  hCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  hCtx.lineWidth   = 0.5*dpr;
  hCtx.setLineDash([5*dpr,15*dpr]);
  hCtx.beginPath();
  hCtx.moveTo(0,H/2); hCtx.lineTo(W,H/2);
  hCtx.moveTo(W/2,0); hCtx.lineTo(W/2,H);
  hCtx.stroke(); hCtx.setLineDash([]);
}

/* ═══════════════════════════════════════════════════
   MEDIAPIPE FACE MESH
═══════════════════════════════════════════════════ */
/* ── face coordinate helpers now local inside onFaceResults ── */

function initFaceMesh() {
  faceMeshModel = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });
  faceMeshModel.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMeshModel.onResults(onFaceResults);

  // Use Camera utility on the faceVideo element
  camInstance = new Camera(faceVideo, {
    onFrame: async () => {
      if (faceVideo.readyState >= 2) await faceMeshModel.send({ image: faceVideo });
    },
    facingMode: facingMode,
    width: 1280, height: 720
  });
  camInstance.start();
}

function onFaceResults(results) {
  faceFrameCount++;
  const now = performance.now();
  if (now - lastFpsFaceTime >= 1000) {
    lastFpsFaceTime = now; faceFrameCount = 0;
  }

  // Canvas всегда = размер экрана (как hudCanvas)
  const SW = window.innerWidth;
  const SH = window.innerHeight;
  if (faceCanvas.width !== SW)  faceCanvas.width  = SW;
  if (faceCanvas.height !== SH) faceCanvas.height = SH;

  // Реальные размеры видеопотока
  const VW = faceVideo.videoWidth  || 1280;
  const VH = faceVideo.videoHeight || 720;

  // Масштаб object-fit: cover — берём наибольший из двух коэффициентов
  const scaleC = Math.max(SW / VW, SH / VH);
  // Смещение для центрирования (как cover делает браузер)
  const offX = (SW - VW * scaleC) / 2;
  const offY = (SH - VH * scaleC) / 2;

  // Функции перевода нормализованных координат MediaPipe → экранные пиксели
  // mirrorX: фронтальная камера зеркалируется
  function toSX(lmX) {
    const px = mirrorX ? (1 - lmX) * VW : lmX * VW;
    return px * scaleC + offX;
  }
  function toSY(lmY) {
    return lmY * VH * scaleC + offY;
  }

  fCtx.save();
  fCtx.clearRect(0, 0, SW, SH);

  const faces   = results.multiFaceLandmarks;
  const hasFace = !!(faces && faces.length > 0);

  document.getElementById('faceStat').textContent = hasFace ? 'LOCKED' : 'SCANNING';

  if (hasFace) {
    if (!prevFaceTarget) {
      document.getElementById('face-target-label').classList.add('visible');
      document.getElementById('faceMetrics').classList.add('visible');
      document.getElementById('acquired-flash').classList.remove('flash');
      void document.getElementById('acquired-flash').offsetWidth;
      document.getElementById('acquired-flash').classList.add('flash');
      typeDone=false; typeIdx=0; typeCharIdx=0;
      typeLines=['','',''];
      typeTargets=[
        'ID: '+Math.floor(Math.random()*9000+1000).toString(16).toUpperCase(),
        'CONF: '+(88+Math.floor(Math.random()*12))+'%',
        'SCAN: ACTIVE'
      ];
      if (!acquiredLogged) { addInstantLog('BIOMETRIC TARGET ACQUIRED', 'speech'); acquiredLogged=true; }
    }

    for (let fi=0; fi<faces.length; fi++) {
      const lm = faces[fi];
      const ld = Math.hypot(lm[159].x-lm[145].x, lm[159].y-lm[145].y);
      const rd = Math.hypot(lm[386].x-lm[374].x, lm[386].y-lm[374].y);
      const eyesClosed = ld < 0.015 && rd < 0.015;
      const color = isSpeaking ? '#00ff88' : (eyesClosed ? '#ff2244' : '#00f5ff');

      drawFaceTesselation(lm, toSX, toSY, color);
      drawFaceOval(lm, toSX, toSY, color);
      drawFaceEyes(lm, toSX, toSY, color);
      drawFaceMouth(lm, toSX, toSY, color);
      drawFaceIris(lm, toSX, toSY, color);
      drawFaceKeyDots(lm, toSX, toSY, color);
      updateFaceInfoOverlay(lm, toSX, toSY, now);

      // Symmetry metric
      const symm = Math.abs(lm[234].x - (1-lm[454].x));
      const symmPct = Math.max(0, Math.min(100, Math.round((1-symm*10)*100)));
      document.getElementById('m-symmetry').style.width  = symmPct+'%';
      document.getElementById('mv-symmetry').textContent = symmPct+'%';
      document.getElementById('symmBar').style.width     = symmPct+'%';
      const conf = 88+Math.floor(Math.random()*4);
      document.getElementById('m-conf').style.width  = conf+'%';
      document.getElementById('mv-conf').textContent = conf+'%';
    }
  } else {
    if (prevFaceTarget) {
      document.getElementById('face-target-label').classList.remove('visible');
      document.getElementById('faceMetrics').classList.remove('visible');
      clearFaceInfoOverlay();
      addInstantLog('BIOMETRIC LOST -- RESUMING SCAN', 'info');
      acquiredLogged = false;
      document.getElementById('symmBar').style.width = '0%';
      document.getElementById('m-symmetry').style.width = '0%';
      document.getElementById('mv-symmetry').textContent = '--';
      document.getElementById('m-conf').style.width  = '0%';
      document.getElementById('mv-conf').textContent = '--';
    }
  }

  prevFaceTarget = hasFace;
  fCtx.restore();
}

function drawFaceTesselation(lm, toSX, toSY, color) {
  fCtx.save();
  fCtx.globalAlpha = 0.18;
  fCtx.strokeStyle = color;
  fCtx.lineWidth   = 0.4;
  fCtx.beginPath();
  const tess = FACEMESH_TESSELATION;
  for (let i=0;i<tess.length;i++) {
    const a=lm[tess[i][0]], b=lm[tess[i][1]];
    if (!a||!b) continue;
    fCtx.moveTo(toSX(a.x), toSY(a.y));
    fCtx.lineTo(toSX(b.x), toSY(b.y));
  }
  fCtx.stroke(); fCtx.restore();
}

function drawFaceLandmarkContour(lm, indices, toSX, toSY, color, lw, alpha, close) {
  fCtx.save();
  fCtx.globalAlpha = alpha;
  fCtx.strokeStyle = color;
  fCtx.lineWidth   = lw;
  fCtx.shadowColor = color; fCtx.shadowBlur = 5;
  fCtx.beginPath();
  let started=false;
  for (let i=0;i<indices.length;i++) {
    const p=lm[indices[i]]; if (!p) continue;
    if (!started) { fCtx.moveTo(toSX(p.x), toSY(p.y)); started=true; }
    else            fCtx.lineTo(toSX(p.x), toSY(p.y));
  }
  if (close) fCtx.closePath();
  fCtx.stroke(); fCtx.restore();
}

function drawFaceOval(lm, toSX, toSY, color) {
  const oval=[10,338,297,332,284,251,389,356,454,323,361,288,
              397,365,379,378,400,377,152,148,176,149,150,136,
              172,58,132,93,234,127,162,21,54,103,67,109,10];
  drawFaceLandmarkContour(lm,oval,toSX,toSY,color,1.2,0.5,false);
}

function drawFaceEyes(lm, toSX, toSY, color) {
  const rEye=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246,33];
  const lEye=[263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466,263];
  const rBrow=[70,63,105,66,107,55,65,52,53,46];
  const lBrow=[300,293,334,296,336,285,295,282,283,276];
  drawFaceLandmarkContour(lm,rEye, toSX,toSY,color,1.3,0.9,false);
  drawFaceLandmarkContour(lm,lEye, toSX,toSY,color,1.3,0.9,false);
  drawFaceLandmarkContour(lm,rBrow,toSX,toSY,color,1.0,0.6,false);
  drawFaceLandmarkContour(lm,lBrow,toSX,toSY,color,1.0,0.6,false);
}

function drawFaceMouth(lm, toSX, toSY, color) {
  const outerTop   =[61,185,40,39,37,0,267,269,270,409,291];
  const outerBottom=[291,375,321,405,314,17,84,181,91,146,61];
  const innerTop   =[78,191,80,81,82,13,312,311,310,415,308];
  const innerBottom=[308,324,318,402,317,14,87,178,88,95,78];
  drawFaceLandmarkContour(lm,outerTop,   toSX,toSY,color,1.4,0.9,false);
  drawFaceLandmarkContour(lm,outerBottom,toSX,toSY,color,1.4,0.9,false);
  drawFaceLandmarkContour(lm,innerTop,   toSX,toSY,color,1.0,0.6,false);
  drawFaceLandmarkContour(lm,innerBottom,toSX,toSY,color,1.0,0.6,false);
}

function drawFaceIris(lm, toSX, toSY, color) {
  [[469,470,471,472],[474,475,476,477]].forEach(ring => {
    fCtx.save();
    fCtx.globalAlpha = 0.75;
    fCtx.strokeStyle = color; fCtx.lineWidth = 1.3;
    fCtx.shadowColor = color; fCtx.shadowBlur = 8;
    fCtx.beginPath();
    for (let i=0;i<=ring.length;i++) {
      const p=lm[ring[i%ring.length]]; if (!p) continue;
      if (i===0) fCtx.moveTo(toSX(p.x), toSY(p.y));
      else       fCtx.lineTo(toSX(p.x), toSY(p.y));
    }
    fCtx.closePath(); fCtx.stroke(); fCtx.restore();
  });
}

function drawFaceKeyDots(lm, toSX, toSY, color) {
  fCtx.save();
  fCtx.fillStyle=color; fCtx.shadowColor=color; fCtx.shadowBlur=6;
  [1,4,6,10,152,234,454,33,263,61,291].forEach(idx => {
    const p=lm[idx]; if (!p) return;
    fCtx.beginPath(); fCtx.arc(toSX(p.x), toSY(p.y), 1.8, 0, Math.PI*2); fCtx.fill();
  });
  fCtx.restore();
}

/* ── FACE INFO OVERLAY ── */
function updateFaceInfoOverlay(lm, toSX, toSY, now) {
  const topPt = lm[10];
  // Координаты уже в экранных пикселях
  const screenX = toSX(topPt.x);
  const screenY = toSY(topPt.y) - 22;
  const fi = document.getElementById('face-info');
  fi.style.left = screenX+'px';
  fi.style.top  = Math.max(screenY, 4)+'px';
  fi.classList.add('visible');

  if (!typeDone && now > typeTimer) {
    typeTimer = now+45;
    if (typeIdx < typeTargets.length) {
      if (typeCharIdx < typeTargets[typeIdx].length) {
        typeLines[typeIdx] += typeTargets[typeIdx][typeCharIdx++];
      } else {
        typeIdx++; typeCharIdx=0;
        if (typeIdx >= typeTargets.length) typeDone=true;
      }
    }
  }
  const glitch = frameGlitch && now < frameGlitchEnd;
  const sfx = glitch ? (Math.random()>0.5?'_':' ') : '';
  document.getElementById('fi-0').textContent = typeLines[0]+(typeIdx===0?'_':'');
  document.getElementById('fi-1').textContent = typeLines[1]+(typeIdx===1?'_':'');
  document.getElementById('fi-2').textContent = typeLines[2]+(typeIdx===2?'_':'')+sfx;
}

function clearFaceInfoOverlay() {
  document.getElementById('face-info').classList.remove('visible');
  typeDone=false; typeIdx=0; typeCharIdx=0;
  typeLines=['','','']; typeTimer=0;
}

function triggerGlitch() {
  frameGlitch=true;
  frameGlitchEnd=performance.now()+200+Math.random()*300;
  const fi=document.getElementById('face-info');
  fi.classList.add('glitch');
  setTimeout(()=>{ frameGlitch=false; fi.classList.remove('glitch'); }, 500);
}
setInterval(triggerGlitch, 3000+Math.random()*4000);

/* ═══════════════════════════════════════════════════
   AUDIO VISUALIZER
═══════════════════════════════════════════════════ */
let eqRunning = false;
function startEQ() {
  if (eqRunning) return;
  eqRunning = true;
  const vizCanvas = document.getElementById('audioVisualizer');
  const vCtx = vizCanvas.getContext('2d');
  const ro = new ResizeObserver(() => {
    const w=vizCanvas.offsetWidth, h=vizCanvas.offsetHeight;
    if (w>0&&h>0) { vizCanvas.width=w; vizCanvas.height=h; }
  });
  ro.observe(vizCanvas);
  (function loop() {
    const mw=vizCanvas.offsetWidth||vizCanvas.width||400;
    const mh=vizCanvas.offsetHeight||vizCanvas.height||40;
    if (vizCanvas.width!==mw) vizCanvas.width=mw;
    if (vizCanvas.height!==mh) vizCanvas.height=mh;
    drawEQ(vCtx, vizCanvas.width, vizCanvas.height);
    requestAnimationFrame(loop);
  })();
}

function drawEQ(vCtx, W, H) {
  if (!analyser||!freqData) {
    vCtx.clearRect(0,0,W,H);
    vCtx.strokeStyle='rgba(0,245,255,0.15)'; vCtx.lineWidth=1;
    vCtx.beginPath(); vCtx.moveTo(0,H/2); vCtx.lineTo(W,H/2); vCtx.stroke();
    return;
  }
  analyser.getByteFrequencyData(freqData);
  vCtx.clearRect(0,0,W,H);
  const N=freqData.length, barW=W/N, gap=Math.max(barW*0.12,0.8);
  for (let i=0;i<N;i++) {
    const v=freqData[i]/255;
    const barH=Math.max(v*H,1.5);
    const g=Math.floor(200+v*55), b=Math.floor(255*(1-v*0.3)), a=0.3+v*0.7;
    vCtx.fillStyle=`rgba(0,${g},${b},${a})`;
    vCtx.fillRect(i*barW, H-barH, barW-gap, barH);
    vCtx.fillStyle=`rgba(0,${g},${b},${a*0.25})`;
    vCtx.fillRect(i*barW, 0, barW-gap, barH*0.4);
  }
}

/* ═══════════════════════════════════════════════════
   SPEECH RECOGNITION
═══════════════════════════════════════════════════ */
function detectLang() {
  const nav=(navigator.languages&&navigator.languages[0])||navigator.language||'ru-RU';
  return /^uk/i.test(nav)?'uk-UA':'ru-RU';
}

function updateLangBtn(lang) {
  const isRU = lang==='ru-RU';
  document.getElementById('langA').textContent = isRU?'RU':'UK';
  document.getElementById('langB').textContent = isRU?'Switch: UK':'Switch: RU';
}

function initSpeech() {
  _SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!_SR) { addInstantLog('SPEECH ENGINE: NOT SUPPORTED','info'); return; }
  currentLang = detectLang();
  updateLangBtn(currentLang);
  startRecognition(currentLang);
}

function startRecognition(lang) {
  if (recognition) {
    recognition.onend=null; recognition.onerror=null;
    try { recognition.abort(); } catch(_) {}
    recognition=null;
  }
  recRestarting=false; currentLang=lang; updateLangBtn(lang);
  recognition = new _SR();
  recognition.continuous=true; recognition.interimResults=true; recognition.lang=lang;
  recognition.onresult = e => {
    let interim='';
    for (let i=e.resultIndex;i<e.results.length;i++) {
      const t=e.results[i][0].transcript.trim();
      if (e.results[i].isFinal && t) addInstantLog(t,'speech');
      else interim=t;
    }
    if (interim) {
      isSpeaking=true;
      const lsb=document.getElementById('liveSpeechBox');
      lsb.textContent=interim.toUpperCase();
      lsb.classList.add('speaking');
    }
  };
  recognition.onend = () => {
    isSpeaking=false;
    const lsb=document.getElementById('liveSpeechBox');
    lsb.classList.remove('speaking');
    lsb.textContent='IDLE';
    if (!recRestarting) {
      recRestarting=true;
      const sl=currentLang;
      setTimeout(()=>{ recRestarting=false; startRecognition(sl); }, 400);
    }
  };
  recognition.onerror = e => {
    if (e.error==='not-allowed') addInstantLog('MIC ACCESS DENIED','threat');
    else if (e.error!=='no-speech'&&e.error!=='aborted') console.warn(e.error);
  };
  try { recognition.start(); addInstantLog('SPEECH: '+lang.toUpperCase(),'info'); } catch(_){}
}

/* ═══════════════════════════════════════════════════
   HUD BUTTONS (lang, export, cam switch)
═══════════════════════════════════════════════════ */
document.getElementById('langBtn').onclick = () => {
  if (!_SR) return;
  recRestarting=true;
  startRecognition(currentLang==='ru-RU'?'uk-UA':'ru-RU');
  document.getElementById('langBtn').classList.toggle('lang-active');
};

document.getElementById('exportBtn').onclick = () => {
  if (!logHistory.length) { alert('LOG IS EMPTY'); return; }
  const blob = new Blob(['myFIX NEURAL LOG\n================\n'+logHistory.join('\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='myfix_log_'+Date.now()+'.txt'; a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('switchCamBtn').onclick = async () => {
  facingMode = facingMode==='user'?'environment':'user';
  mirrorX    = facingMode==='user';
  document.getElementById('camA').textContent = facingMode==='user'?'Front':'Back';
  document.getElementById('camB').textContent = facingMode==='user'?'Switch: Back':'Switch: Front';
  if (camInstance) { try { await camInstance.stop(); } catch(_){} camInstance=null; }
  // Switch faceVideo stream
  const newStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode, width:{ideal:1280}, height:{ideal:720} },
    audio: true
  });
  if (activeStream) activeStream.getTracks().forEach(t=>t.stop());
  activeStream=newStream;
  video.srcObject=newStream;
  faceVideo.srcObject=newStream;
  // Reconnect audio
  if (audioCtxNode) {
    audioCtxNode.createMediaStreamSource(newStream).connect(analyser);
  }
  camInstance = new Camera(faceVideo, {
    onFrame: async () => { if (faceVideo.readyState>=2) await faceMeshModel.send({image:faceVideo}); },
    facingMode, width:1280, height:720
  });
  camInstance.start();
  addInstantLog(`CAMERA: ${facingMode.toUpperCase()}`,'info');
};

/* ═══════════════════════════════════════════════════
   CLEANUP
═══════════════════════════════════════════════════ */
window.addEventListener('beforeunload', () => {
  if (activeStream) activeStream.getTracks().forEach(t=>t.stop());
  if (audioCtxNode && audioCtxNode.state!=='closed') audioCtxNode.close().catch(()=>{});
  if (recognition) { try { recognition.abort(); } catch(_){} }
  if (camInstance) { try { camInstance.stop(); } catch(_){} }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState==='hidden') {
    if (recognition) try { recognition.abort(); } catch(_){}
  } else if (document.visibilityState==='visible') {
    if (_SR && !recRestarting) setTimeout(()=>startRecognition(currentLang), 300);
  }
});
</script>
