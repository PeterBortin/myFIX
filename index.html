<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD TACTICAL v11.0 // EW_INTERFERENCE</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.5) contrast(1.2) saturate(0); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #terminal {
            position: absolute; top: 15px; left: 15px; width: 350px; height: 300px;
            background: none; color: #fff; font-size: 12px; padding: 5px; overflow: hidden;
            z-index: 15; line-height: 1.2; text-transform: uppercase;
        }
        .log-entry { margin-bottom: 3px; letter-spacing: 1px; }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 18px 45px; background: none; border: 1px solid #fff; color: #fff;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 4px; transition: 0.4s;
        }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">SYNC_NEURAL_LINK</button>
    <div id="terminal"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const terminal = document.getElementById('terminal');

let model;
let targetPos = { x: window.innerWidth/2, y: window.innerHeight/2, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let lockFactor = 0; 
let pulseTime = 0;
let textTick = 0;
let infoLines = [];
let glitchActive = 0;

// РЭБ параметры
let ewIntensity = 0;
let ewTimer = 0;

const RED_TARGETS = ['person', 'car', 'truck', 'bus', 'motorcycle'];

function logToTerminal(msg) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `> ${msg}`;
    terminal.appendChild(entry);
    if (terminal.children.length > 18) terminal.removeChild(terminal.firstChild);
    if (lockFactor > 0.5) glitchActive = 5;
}

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    logToTerminal("INIT_BOOT_SEQUENCE...");
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        model = await cocoSsd.load();
        logToTerminal("NEURAL_NET_READY");
        resize();
        detectFrame();
        draw();
    } catch (err) {
        logToTerminal("LINK_FAILED");
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
            const p = predictions[0];
            const [x, y, w, h] = p.bbox;
            const sX = window.innerWidth / video.videoWidth;
            const sY = window.innerHeight / video.videoHeight;

            targetPos.x = (x + w/2) * sX;
            targetPos.y = (y + h/2) * sY;
            targetPos.active = true;
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let wasLocked = isLocked;
            
            isLocked = dist < 120 && RED_TARGETS.includes(p.class.toLowerCase());

            if (isLocked && !wasLocked) {
                textTick = 0;
                generateInfo(p);
                logToTerminal(`THREAT_DETECTED: ${p.class.toUpperCase()}`);
                glitchActive = 10;
            }
        } else {
            targetPos.active = false;
            isLocked = false;
        }
    }
    setTimeout(detectFrame, 60);
}

function generateInfo(p) {
    infoLines = [
        `TARGET: ${p.class.toUpperCase()}`,
        `ID: 0x${Math.random().toString(16).slice(2,8)}`,
        `SECTOR: 07-A`,
        `STATUS: LOCK_ON`,
        `PROB: ${Math.round(p.score * 100)}%`
    ];
}

function drawEWInterference(dpr) {
    // Вероятность возникновения помехи РЭБ
    ewTimer++;
    if (ewTimer % 200 === 0) ewIntensity = 15; 
    
    if (ewIntensity > 0) {
        const shiftX = (Math.random() - 0.5) * 40 * dpr * (ewIntensity / 15);
        ctx.translate(shiftX, 0);
        
        // Рисуем случайные "битые" горизонтальные линии
        for (let i = 0; i < 5; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.2})`;
            ctx.fillRect(0, Math.random() * canvas.height, canvas.width, 2 * dpr);
        }
        
        ewIntensity--;
        terminal.style.transform = `translateX(${(Math.random()-0.5)*10}px)`;
    } else {
        terminal.style.transform = `none`;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    const destX = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const destY = targetPos.active ? targetPos.y : window.innerHeight / 2;
    currentPos.x += (destX - currentPos.x) * 0.15;
    currentPos.y += (destY - currentPos.y) * 0.15;

    if (isLocked) {
        if (lockFactor < 1) lockFactor += 0.1;
    } else {
        if (lockFactor > 0) lockFactor -= 0.05;
    }

    pulseTime += 0.15;
    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;
    
    const r = 255;
    const gb = Math.floor(255 * (1 - lockFactor));
    const mainColor = `rgb(${r}, ${gb}, ${gb})`;

    terminal.style.color = mainColor;

    ctx.save();
    
    // Эффект РЭБ (сдвиг всего контекста)
    drawEWInterference(dpr);

    // Глитч при захвате
    if (glitchActive > 0) {
        ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15);
        glitchActive--;
    }

    ctx.strokeStyle = mainColor;
    ctx.fillStyle = mainColor;
    ctx.shadowBlur = 10 * lockFactor;
    ctx.shadowColor = mainColor;

    drawReticle(cx, cy, dpr, lockFactor);

    if (lockFactor > 0.1) {
        ctx.globalAlpha = lockFactor;
        drawDataBlock(cx, cy, dpr);
        ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Шум РЭБ на фоне (случайные точки)
    if (ewIntensity > 5) {
        for(let i=0; i<10; i++) {
            ctx.fillStyle = "white";
            ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, dpr, dpr);
        }
    }

    requestAnimationFrame(draw);
}

function drawReticle(cx, cy, dpr, lf) {
    ctx.save();
    ctx.translate(cx, cy);
    
    if (lf > 0.2) {
        ctx.save();
        ctx.rotate(pulseTime * 2);
        ctx.lineWidth = 1 * dpr;
        ctx.setLineDash([15*dpr, 45*dpr]);
        ctx.beginPath();
        ctx.arc(0, 0, 100 * dpr, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    ctx.lineWidth = 2 * dpr;
    const c = 6 * dpr;
    ctx.beginPath();
    ctx.moveTo(-c, 0); ctx.lineTo(c, 0);
    ctx.moveTo(0, -c); ctx.lineTo(0, c);
    ctx.stroke();

    const size = (30 - (10 * lf)) * dpr; 
    const depth = (6 + (14 * lf)) * dpr; 
    
    for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(size, -size + depth);
        ctx.lineTo(size, -size);
        ctx.lineTo(size - depth, -size);
        ctx.stroke();
        ctx.restore();
    }

    ctx.lineWidth = 3 * dpr;
    const arcGap = 0.2 * Math.PI;
    ctx.beginPath();
    ctx.arc(0, 0, 80 * dpr, Math.PI - arcGap, Math.PI + arcGap);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 80 * dpr, -arcGap, arcGap);
    ctx.stroke();

    ctx.restore();
}

function drawDataBlock(cx, cy, dpr) {
    textTick += 0.5;
    const fontSize = 14 * dpr;
    ctx.font = `bold ${fontSize}px 'Courier New'`;
    
    infoLines.forEach((line, i) => {
        let len = Math.floor(textTick - (i * 3));
        if (len > 0) {
            // Добавляем "шумовые" символы в текст при сильном РЭБ
            let displayLine = line.substring(0, len);
            if (ewIntensity > 8 && Math.random() > 0.7) {
                displayLine = displayLine.replace(/[A-Z]/g, () => String.fromCharCode(33 + Math.random() * 20));
            }
            ctx.fillText("» " + displayLine, cx + 110 * dpr, cy - 40 * dpr + (i * fontSize * 1.5));
        }
    });

    if (Math.random() > 0.8) {
        ctx.fillRect(cx + 110 * dpr, cy + 40 * dpr, 40 * dpr * Math.random(), 2 * dpr);
    }
}

window.onresize = resize;
</script>
</body>
</html>
