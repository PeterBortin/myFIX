<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>myFIX</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#ff2020;--mono:'Share Tech Mono',monospace;--sans:'Rajdhani',sans-serif}
body{margin:0;background:#000;overflow:hidden;font-family:var(--mono);user-select:none;cursor:crosshair;
  -webkit-tap-highlight-color:transparent;touch-action:none}
#container{position:relative;width:100vw;height:100vh}
video{width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(0.45) contrast(1.3) saturate(0.1) hue-rotate(180deg);
  /* GPU layer hint */
  transform:translateZ(0);will-change:transform}
/* HUD canvas — own compositing layer */
#hudCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;
  transform:translateZ(0);will-change:transform}
#scanlines{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.16) 3px,rgba(0,0,0,0.16) 4px);
  animation:scanScroll 8s linear infinite;transform:translateZ(0)}
@keyframes scanScroll{from{background-position:0 0}to{background-position:0 100px}}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 40%,rgba(0,0,0,0.78) 100%);
  transform:translateZ(0)}

/* BOTTOM BAR */
#botbar{position:absolute;bottom:0;left:0;right:0;height:36px;
background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);
display:flex;align-items:center;justify-content:space-between;
padding:0 18px;z-index:15;border-top:1px solid rgba(255,255,255,0.07)}
.coords{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1.5px}

/* TERMINAL */
#terminal{position:absolute;bottom:44px;left:15px;width:280px;max-height:180px;
overflow:hidden;z-index:15;pointer-events:none}
.log-entry{font-size:10px;letter-spacing:1.5px;line-height:1.8;text-transform:uppercase;
color:rgba(255,255,255,0.5);display:flex;gap:8px;align-items:baseline;animation:fadeIn 0.3s ease}
.log-entry.threat{color:var(–red)}.log-entry.info{color:rgba(255,255,255,0.6)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.log-ts{color:rgba(255,255,255,0.2);flex-shrink:0}.log-prefix{color:rgba(255,255,255,0.25)}
#cursor{display:inline-block;width:7px;height:12px;background:rgba(255,255,255,0.5);
animation:blink 0.8s steps(1) infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* STATUS PANEL */
#statusPanel{position:absolute;top:15px;right:15px;width:185px;z-index:15;display:flex;flex-direction:column;gap:5px}
.sp-row{display:flex;justify-content:space-between;align-items:center;
border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:4px}
.sp-key{font-family:var(–sans);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.3)}
.sp-val{font-family:var(–mono);font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:1px}
.sp-val.active{color:var(–red);text-shadow:0 0 8px var(–red)}
.bar-wrap{width:80px;height:3px;background:rgba(255,255,255,0.1)}
.bar-fill{height:100%;background:rgba(255,255,255,0.5);transition:width 0.3s}
.bar-fill.danger{background:var(–red);box-shadow:0 0 6px var(–red)}

/* START BUTTON */
#startBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:none;border:none;color:#fff;font-family:var(–sans);font-size:11px;font-weight:700;
letter-spacing:5px;text-transform:uppercase;cursor:pointer;z-index:20;outline:none;padding:0}
#startBtn .btn-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
#startBtn .btn-ring{width:80px;height:80px;position:relative;display:flex;align-items:center;justify-content:center}
.ring-svg{position:absolute;inset:0;animation:spinRing 4s linear infinite}
.ring-svg2{position:absolute;inset:6px;animation:spinRing 7s linear infinite reverse}
@keyframes spinRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#startBtn .btn-text{letter-spacing:6px;opacity:0.7}
#startBtn:hover .btn-text{opacity:1}#startBtn:hover .ring-svg{animation-duration:1.5s}

/* EW ALERT */
#ewAlert{position:absolute;top:15px;right:210px;font-family:var(–sans);font-size:9px;font-weight:700;
letter-spacing:3px;color:var(–red);opacity:0;transition:opacity 0.2s;z-index:15;text-transform:uppercase}
#ewAlert.show{opacity:1}

/* THREAT BOX */
#threatBox{position:absolute;top:50%;right:15px;transform:translateY(-50%);z-index:15;width:170px;opacity:0;transition:opacity 0.4s}
#threatBox.show{opacity:1}
.tb-header{font-family:var(–sans);font-size:9px;font-weight:700;letter-spacing:3px;color:var(–red);
border-bottom:1px solid rgba(255,32,32,0.3);padding-bottom:6px;margin-bottom:8px;text-transform:uppercase}
.tbi{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:1px;line-height:2}
.tbi-key{color:rgba(255,255,255,0.3);font-size:9px}

/* ═══════════ CAPTURE CARD ═══════════ */
#captureCard{position:absolute;top:14px;left:14px;z-index:20;display:flex;flex-direction:row;
opacity:0;pointer-events:none;transition:opacity 0.3s ease;
filter:drop-shadow(0 0 8px rgba(255,32,32,0.35))}
#captureCard.show{opacity:1;pointer-events:auto}
#portraitWrap{position:relative;width:130px;height:130px;flex-shrink:0;
background:#000;border:1px solid rgba(255,32,32,0.5);overflow:hidden}
#portraitCanvas{width:100%;height:100%;display:block;
filter:brightness(1.1) contrast(1.25) saturate(0.12) hue-rotate(180deg)}
.pcorner{position:absolute;width:9px;height:9px;border-color:var(–red);border-style:solid;z-index:2}
.pcorner.tl{top:3px;left:3px;border-width:1.5px 0 0 1.5px}
.pcorner.tr{top:3px;right:3px;border-width:1.5px 1.5px 0 0}
.pcorner.bl{bottom:3px;left:3px;border-width:0 0 1.5px 1.5px}
.pcorner.br{bottom:3px;right:3px;border-width:0 1.5px 1.5px 0}
#pScanlines{position:absolute;inset:0;pointer-events:none;z-index:3;
background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.22) 2px,rgba(0,0,0,0.22) 3px)}
#pCross{position:absolute;inset:0;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:center}
#pCross::before{content:’’;width:16px;height:16px;border:1px solid rgba(255,32,32,0.5);border-radius:50%}
#pStamp{position:absolute;bottom:4px;left:4px;right:4px;z-index:5;font-size:7px;font-family:var(–mono);
color:rgba(255,32,32,0.65);letter-spacing:0.8px;display:flex;justify-content:space-between}
#capturedFlash{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
font-family:var(–sans);font-size:10px;font-weight:700;letter-spacing:4px;color:var(–red);text-transform:uppercase;
opacity:0;pointer-events:none}
#capturedFlash.flash{animation:capFlash 0.9s ease forwards}
@keyframes capFlash{0%{opacity:1}60%{opacity:0.7}100%{opacity:0}}
#captureMeta{width:158px;background:rgba(0,0,0,0.85);border:1px solid rgba(255,32,32,0.25);border-left:none;
padding:7px 9px;display:flex;flex-direction:column;gap:0}
.cm-header{font-family:var(–sans);font-size:8px;font-weight:700;letter-spacing:3px;color:var(–red);
border-bottom:1px solid rgba(255,32,32,0.3);padding-bottom:5px;margin-bottom:5px;text-transform:uppercase;
display:flex;justify-content:space-between;align-items:center}
.cm-blink{width:5px;height:5px;border-radius:50%;background:var(–red);animation:blink 0.6s steps(1) infinite}
.cm-row{display:flex;justify-content:space-between;align-items:baseline;
border-bottom:1px solid rgba(255,255,255,0.04);padding:2.5px 0}
.cm-key{font-family:var(–sans);font-size:8px;font-weight:700;letter-spacing:1.8px;color:rgba(255,255,255,0.25);
text-transform:uppercase;flex-shrink:0}
.cm-val{font-family:var(–mono);font-size:9px;color:rgba(255,255,255,0.65);letter-spacing:0.8px;text-align:right}
.cm-val.red{color:var(–red);text-shadow:0 0 5px var(–red)}

/* ═══════════ SERIES BUTTON ═══════════ */
#seriesBtn{
position:absolute;bottom:46px;right:15px;z-index:20;
background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.2);
color:rgba(255,255,255,0.7);font-family:var(–sans);font-size:9px;font-weight:700;
letter-spacing:3px;text-transform:uppercase;padding:7px 12px;
cursor:pointer;outline:none;transition:all 0.2s;display:none;
-webkit-tap-highlight-color:transparent
}
#seriesBtn:hover,#seriesBtn:active{border-color:var(–red);color:var(–red)}
#seriesBtn.armed{
border-color:var(–red);color:var(–red);
box-shadow:0 0 10px rgba(255,32,32,0.4);
animation:serisPulse 1s ease-in-out infinite
}
@keyframes serisPulse{0%,100%{box-shadow:0 0 8px rgba(255,32,32,0.3)}50%{box-shadow:0 0 18px rgba(255,32,32,0.7)}}

/* Series counter badge */
#seriesBadge{
position:absolute;bottom:46px;right:120px;z-index:20;
font-family:var(–sans);font-size:9px;font-weight:700;letter-spacing:2px;
color:var(–red);text-transform:uppercase;display:none;
text-shadow:0 0 6px rgba(255,32,32,0.5)
}

/* PDF export toast */
#pdfToast{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:rgba(0,0,0,0.9);border:1px solid rgba(255,32,32,0.4);
padding:18px 28px;z-index:30;text-align:center;display:none;flex-direction:column;gap:10px
}
#pdfToast .pt-title{font-family:var(–sans);font-size:11px;font-weight:700;letter-spacing:4px;color:var(–red);text-transform:uppercase}
#pdfToast .pt-sub{font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:2px}
#pdfToast progress{width:160px;height:3px;accent-color:var(–red)}
#pdfToast .pt-link{font-size:9px;color:var(–red);letter-spacing:2px;cursor:pointer;text-decoration:underline;display:none}

/* TAP HINT */
#tapHint{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);
font-family:var(–sans);font-size:10px;font-weight:700;letter-spacing:4px;
text-transform:uppercase;color:rgba(255,255,255,0.32);z-index:15;pointer-events:none;
opacity:0;transition:opacity 0.4s;white-space:nowrap;animation:hintPulse 2s ease-in-out infinite}
#tapHint.show{opacity:1}
@keyframes hintPulse{0%,100%{opacity:0.32}50%{opacity:0.65}}
#tapHint::before{content:’[ ‘;color:var(–red)}#tapHint::after{content:’ ]’;color:var(–red)}

/* SCREEN FLASH */
#flashOverlay{position:absolute;inset:0;z-index:50;background:rgba(255,255,255,0);pointer-events:none}
#flashOverlay.flash{animation:scrFlash 0.25s ease forwards}
@keyframes scrFlash{0%{background:rgba(255,255,255,0.2)}100%{background:rgba(255,255,255,0)}}

/* CACHE INDICATOR */
#cacheIndicator{position:absolute;top:15px;left:15px;z-index:15;
font-family:var(–sans);font-size:8px;font-weight:700;letter-spacing:2px;
color:rgba(255,255,255,0.2);text-transform:uppercase;display:none}
#cacheIndicator.loaded{color:rgba(100,255,100,0.45)}
</style>

</head>

<!-- PDF TOAST -->

<!-- jsPDF for client-side PDF generation -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- TF.js + COCO-SSD -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
'use strict';
/* ════════════════════════════════════════════════════
   PERFORMANCE FLAGS  (iOS/Android optimizations)
════════════════════════════════════════════════════ */
const IS_IOS     = /iPad|iPhone|iPod/.test(navigator.userAgent);
const IS_ANDROID = /Android/.test(navigator.userAgent);
const IS_MOBILE  = IS_IOS || IS_ANDROID;

// Reduce detection frequency on mobile to relieve CPU
const DETECT_INTERVAL = IS_MOBILE ? 120 : 80; // ms
// Max canvas resolution — cap DPR on mobile
const EFF_DPR = IS_MOBILE ? Math.min(devicePixelRatio, 2) : devicePixelRatio;
// Reduce EW noise particles on mobile
const EW_PARTICLES = IS_MOBILE ? 4 : 12;
// Skip shadow blur on mobile (expensive on mobile GPUs)
const USE_SHADOW = !IS_MOBILE;

/* ════════════════════════════════════════════════════
   INDEXEDDB USER CACHE
════════════════════════════════════════════════════ */
const DB_NAME    = 'myfix_cache';
const DB_VERSION = 1;
const STORE_CAPS = 'captures';
let   db         = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_CAPS)) {
        const store = d.createObjectStore(STORE_CAPS, {keyPath:'id', autoIncrement:true});
        store.createIndex('ts','ts',{unique:false});
        store.createIndex('cls','cls',{unique:false});
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = () => rej(req.error);
  });
}

function dbSave(record) {
  if (!db) return Promise.resolve(null);
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_CAPS, 'readwrite');
    const req = tx.objectStore(STORE_CAPS).add(record);
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}

function dbGetAll() {
  if (!db) return Promise.resolve([]);
  return new Promise((res, rej) => {
    const tx  = db.transaction(STORE_CAPS, 'readonly');
    const req = tx.objectStore(STORE_CAPS).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}

function dbCount() {
  if (!db) return Promise.resolve(0);
  return new Promise((res) => {
    const tx  = db.transaction(STORE_CAPS, 'readonly');
    const req = tx.objectStore(STORE_CAPS).count();
    req.onsuccess = () => res(req.result);
    req.onerror   = () => res(0);
  });
}

function dbClear() {
  if (!db) return Promise.resolve();
  return new Promise((res) => {
    const tx = db.transaction(STORE_CAPS, 'readwrite');
    tx.objectStore(STORE_CAPS).clear();
    tx.oncomplete = res;
  });
}

/* ════════════════════════════════════════════════════
   THREAT CLASSIFIER
════════════════════════════════════════════════════ */
const THREAT_HIGH   = new Set(['person','car','truck','bus','motorcycle','airplane','boat','train']);
const THREAT_MEDIUM = new Set(['bicycle','horse','cow','dog','cat','bird','sheep','bear','elephant','zebra','giraffe']);
function getThreat(cls) {
  if (THREAT_HIGH.has(cls))   return 'HIGH';
  if (THREAT_MEDIUM.has(cls)) return 'MED';
  return 'LOW';
}

/* ════════════════════════════════════════════════════
   DOM REFS
════════════════════════════════════════════════════ */
const video        = document.getElementById('video');
const canvas       = document.getElementById('hudCanvas');
const ctx          = canvas.getContext('2d', {alpha:true, desynchronized: IS_MOBILE});
const startBtn     = document.getElementById('startBtn');
const terminal     = document.getElementById('terminal');
const cursorEl     = document.getElementById('cursor');
const captureCard  = document.getElementById('captureCard');
const portCanvas   = document.getElementById('portraitCanvas');
const portCtx      = portCanvas.getContext('2d');
const tapHint      = document.getElementById('tapHint');
const flashOv      = document.getElementById('flashOverlay');
const seriesBtn    = document.getElementById('seriesBtn');
const seriesBadge  = document.getElementById('seriesBadge');
const pdfToast     = document.getElementById('pdfToast');
const pdfSub       = document.getElementById('pdfSub');
const pdfProgress  = document.getElementById('pdfProgress');
const pdfLink      = document.getElementById('pdfLink');
const cacheInd     = document.getElementById('cacheIndicator');

/* ════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════ */
let model, allPredictions = [], primaryTarget = null;
let currentPos = {x:innerWidth/2, y:innerHeight/2};
let targetPos  = {x:innerWidth/2, y:innerHeight/2, active:false};
let isLocked   = false, lockFactor = 0;
let pulseTime  = 0, scanAngle = 0, textTick = 0;
let infoLines  = [], glitchActive = 0;
let captureCount = 0, cardVisible = false;
let ewIntensity = 0, ewTimer = 0;
let lat = 55.7558 + (Math.random()-0.5)*0.01;
let lon = 37.6173 + (Math.random()-0.5)*0.01;

/* ── Series mode ── */
let seriesActive    = false;
let seriesCaptures  = [];          // in-session series buffer (for PDF)
let seriesThrottle  = 0;           // frames between auto-captures
const SERIES_INTERVAL_FRAMES = IS_MOBILE ? 40 : 25; // ~3s/2s between shots
let seriesTracked   = new Set();   // track which object UIDs already captured this pass

/* ════════════════════════════════════════════════════
   TERMINAL
════════════════════════════════════════════════════ */
function ts() {
  const n=new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
}
const logQ=[]; let logBusy=false;
async function typeLog(msg,cls='info'){
  await new Promise(res=>{logQ.push({msg,cls,res});if(!logBusy)drainLog();});
}
async function drainLog(){
  if(!logQ.length){logBusy=false;return;} logBusy=true;
  const {msg,cls,res}=logQ.shift();
  const e=document.createElement('div'); e.className=`log-entry ${cls}`;
  const t=document.createElement('span'); t.className='log-ts'; t.textContent=ts();
  const p=document.createElement('span'); p.className='log-prefix'; p.textContent='›';
  const x=document.createElement('span');
  e.append(t,p,x); terminal.insertBefore(e,cursorEl);
  while(terminal.querySelectorAll('.log-entry').length>12)
    terminal.removeChild(terminal.querySelector('.log-entry'));
  for(let i=0;i<=msg.length;i++){x.textContent=msg.substring(0,i);await new Promise(r=>setTimeout(r,18));}
  res(); drainLog();
}

/* ════════════════════════════════════════════════════
   COORDS DRIFT
════════════════════════════════════════════════════ */
setInterval(()=>{
  lat+=(Math.random()-0.5)*0.00005; lon+=(Math.random()-0.5)*0.00005;
  const f=v=>`${Math.floor(Math.abs(v))}°${String(Math.floor((Math.abs(v)%1)*60)).padStart(2,'0')}'${String(((Math.abs(v)%1*60)%1*60)|0).padStart(2,'0')}"`;
  document.getElementById('coordsL').textContent=`LAT ${f(lat)}${lat>0?'N':'S'}  LON ${f(lon)}${lon>0?'E':'W'}`;
  const hdg=(360+Math.round(45+Math.sin(Date.now()/10000)*20))%360;
  document.getElementById('coordsR').textContent=`ALT ${180+Math.round(Math.sin(Date.now()/7000)*5)}m  SPD ${Math.round(12+Math.random()*2)}kts  HDG ${hdg}°`;
},1500);

/* ════════════════════════════════════════════════════
   PORTRAIT CAPTURE  — returns capture record
════════════════════════════════════════════════════ */
function buildCaptureRecord(pred, imageDataURL) {
  const uid    = '0x'+Math.random().toString(16).slice(2,8).toUpperCase();
  const tier   = getThreat(pred.class.toLowerCase());
  const sec    = String.fromCharCode(65+Math.floor(Math.random()*6))+(Math.floor(Math.random()*9)+1);
  const alt    = 180+Math.round(Math.sin(Date.now()/7000)*5);
  const spd    = Math.round(12+Math.random()*3);
  const now    = new Date();
  return {
    id: undefined, // set by IndexedDB
    ts: now.toISOString(),
    tsDisplay: ts(),
    uid,
    cls: pred.class,
    threat: tier,
    conf: Math.round(pred.score*100),
    sector: sec,
    lat: lat.toFixed(5),
    lon: lon.toFixed(5),
    alt,
    spd,
    img: imageDataURL   // base64 JPEG
  };
}

function extractPortraitDataURL(pred) {
  if (!video.videoWidth || !video.videoHeight) return null;
  const [bx,by,bw,bh] = pred.bbox;
  const pad=0.18;
  const cx = Math.max(0, bx-bw*pad);
  const cy = Math.max(0, by-bh*pad);
  const cw = Math.min(video.videoWidth -cx, bw*(1+pad*2));
  const ch = Math.min(video.videoHeight-cy, bh*(1+pad*2));
  const sz = 130;
  portCanvas.width=sz; portCanvas.height=sz;
  portCtx.fillStyle='#000'; portCtx.fillRect(0,0,sz,sz);
  portCtx.drawImage(video,cx,cy,cw,ch,0,0,sz,sz);
  return portCanvas.toDataURL('image/jpeg', 0.82);
}

function renderCardFromRecord(rec) {
  // Re-draw portrait from stored dataURL
  const img = new Image();
  img.onload = () => {
    portCanvas.width=130; portCanvas.height=130;
    portCtx.drawImage(img,0,0,130,130);
  };
  img.src = rec.img;

  document.getElementById('pStampTime').textContent = rec.tsDisplay;
  document.getElementById('pStampId').textContent   = 'ID:'+rec.uid;

  const rows = [
    {k:'CLASS',  v:rec.cls.toUpperCase(),       red:false},
    {k:'THREAT', v:rec.threat,                  red:rec.threat==='HIGH'},
    {k:'CONF',   v:rec.conf+'%',                red:false},
    {k:'SECTOR', v:rec.sector,                  red:false},
    {k:'UID',    v:rec.uid,                     red:false},
    {k:'LAT',    v:rec.lat+'°',                 red:false},
    {k:'LON',    v:rec.lon+'°',                 red:false},
    {k:'ALT',    v:rec.alt+'m',                 red:false},
    {k:'SPD',    v:rec.spd+'kts',               red:false},
    {k:'STATUS', v:'LOCKED',                    red:true},
  ];
  const cmRows = document.getElementById('cmRows'); cmRows.innerHTML='';
  rows.forEach(r=>{
    const d=document.createElement('div'); d.className='cm-row';
    d.innerHTML=`<span class="cm-key">${r.k}</span><span class="cm-val${r.red?' red':''}">${r.v}</span>`;
    cmRows.appendChild(d);
  });
}

async function doCapture(pred) {
  const imgData = extractPortraitDataURL(pred);
  if (!imgData) return null;
  const rec = buildCaptureRecord(pred, imgData);

  // Save to IndexedDB
  try {
    const id = await dbSave(rec);
    rec.id = id;
  } catch(e) { console.warn('DB save failed',e); }

  // Update cache count
  const cnt = await dbCount();
  document.getElementById('cacheStat').textContent = cnt;

  captureCount++;
  document.getElementById('captureStat').textContent = captureCount;

  return rec;
}

function flashEffects() {
  const cf = document.getElementById('capturedFlash');
  cf.classList.remove('flash'); void cf.offsetWidth; cf.classList.add('flash');
  flashOv.classList.remove('flash'); void flashOv.offsetWidth; flashOv.classList.add('flash');
}

function showCard()  { captureCard.classList.add('show');    cardVisible=true;  tapHint.classList.remove('show'); }
function hideCard()  { captureCard.classList.remove('show'); cardVisible=false; }

/* ════════════════════════════════════════════════════
   SERIES MODE
════════════════════════════════════════════════════ */
function startSeries() {
  seriesActive   = true;
  seriesCaptures = [];
  seriesTracked.clear();
  seriesThrottle = 0;
  seriesBtn.classList.add('armed');
  seriesBtn.textContent = '■ STOP SERIES';
  seriesBadge.style.display = 'block';
  seriesBadge.textContent   = 'SER: 0';
  typeLog('SERIES MODE ARMED','threat');
}

async function stopSeries() {
  seriesActive = false;
  seriesBtn.classList.remove('armed');
  seriesBtn.textContent = '◉ SERIES';
  seriesBadge.style.display = 'none';
  typeLog(`SERIES COMPLETE — ${seriesCaptures.length} CAPTURES`,'info');
  if (seriesCaptures.length > 0) {
    await generatePDF(seriesCaptures);
  }
}

seriesBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (seriesActive) stopSeries();
  else startSeries();
});

/* ────────────────────────────────────────────────
   Auto-capture in series mode
   Fires for EVERY detected object each interval
──────────────────────────────────────────────── */
async function seriesTick() {
  if (!seriesActive || !allPredictions.length) return;
  seriesThrottle++;
  if (seriesThrottle < SERIES_INTERVAL_FRAMES) return;
  seriesThrottle = 0;

  for (const pred of allPredictions) {
    const rec = await doCapture(pred);
    if (!rec) continue;
    seriesCaptures.push(rec);
    seriesBadge.textContent = `SER: ${seriesCaptures.length}`;
    typeLog(`[SER] ${pred.class.toUpperCase()} — ${getThreat(pred.class.toLowerCase())}`, 'threat');
    // Show latest capture briefly in card
    renderCardFromRecord(rec);
    showCard();
    flashEffects();
    // Small pause between objects in same batch
    await new Promise(r => setTimeout(r, IS_MOBILE ? 80 : 40));
  }
}

/* ════════════════════════════════════════════════════
   PDF GENERATION  (jsPDF, pure client-side)
════════════════════════════════════════════════════ */
async function generatePDF(captures) {
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { typeLog('PDF LIB NOT LOADED','threat'); return; }

  // Show progress toast
  pdfToast.style.display='flex';
  pdfProgress.value=0;
  pdfLink.style.display='none';
  pdfSub.textContent='COMPILING DATA...';

  await new Promise(r=>setTimeout(r,50)); // let UI paint

  const W=210, H=297; // A4 mm
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});

  const setFont = (size,color=[255,255,255],style='normal') => {
    doc.setFont('courier', style);
    doc.setFontSize(size);
    doc.setTextColor(...color);
  };

  const total = captures.length;

  for (let i=0; i<total; i++) {
    const rec = captures[i];
    pdfSub.textContent = `OBJECT ${i+1} / ${total}`;
    pdfProgress.value  = Math.round((i/total)*100);
    await new Promise(r=>setTimeout(r,30));

    if (i>0) doc.addPage();

    // ── Black background
    doc.setFillColor(0,0,0); doc.rect(0,0,W,H,'F');

    // ── Red top bar
    doc.setFillColor(255,32,32); doc.rect(0,0,W,8,'F');
    doc.setFont('courier','bold'); doc.setFontSize(10); doc.setTextColor(0,0,0);
    doc.text('myFIX // TACTICAL INTELLIGENCE REPORT', W/2, 5.5, {align:'center'});

    // ── Border
    doc.setDrawColor(255,32,32); doc.setLineWidth(0.3); doc.rect(3,10,W-6,H-14,'S');

    // ── Session header
    setFont(7,[255,32,32],'bold');
    doc.text(`SERIES CAPTURE — OBJECT ${i+1} OF ${total}`, 8, 16);
    doc.text(`SESSION: ${new Date().toISOString()}`, W-8, 16, {align:'right'});

    // ── Divider
    doc.setDrawColor(255,32,32,0.4); doc.setLineWidth(0.15);
    doc.line(8,18,W-8,18);

    // ── Portrait image (left column)
    if (rec.img) {
      try {
        // Draw image box
        doc.setFillColor(10,10,10); doc.rect(8,21,60,60,'F');
        doc.setDrawColor(255,32,32); doc.setLineWidth(0.3); doc.rect(8,21,60,60,'S');
        doc.addImage(rec.img,'JPEG', 8,21,60,60);
        // Corner brackets on image
        const bx=8, by=21, bl=6;
        doc.setDrawColor(255,32,32); doc.setLineWidth(0.5);
        doc.line(bx,by+bl,bx,by); doc.line(bx,by,bx+bl,by);
        doc.line(bx+60-bl,by,bx+60,by); doc.line(bx+60,by,bx+60,by+bl);
        doc.line(bx,by+60-bl,bx,by+60); doc.line(bx,by+60,bx+bl,by+60);
        doc.line(bx+60-bl,by+60,bx+60,by+60); doc.line(bx+60,by+60-bl,bx+60,by+60);
        // Timestamp stamp on image
        doc.setFillColor(0,0,0,0.6); doc.rect(8,75,60,5,'F');
        setFont(6,[255,32,32]);
        doc.text(rec.tsDisplay, 10, 78.5);
        doc.text('ID:'+rec.uid, 66, 78.5, {align:'right'});
      } catch(e){}
    }

    // ── Data table (right of image)
    const tx=76, ty=22, lineH=6.5;
    const fields = [
      ['CLASS',   rec.cls.toUpperCase()],
      ['THREAT',  rec.threat],
      ['CONF',    rec.conf+'%'],
      ['SECTOR',  rec.sector],
      ['UID',     rec.uid],
      ['LAT',     rec.lat+'°'],
      ['LON',     rec.lon+'°'],
      ['ALT',     rec.alt+'m'],
      ['SPD',     rec.spd+' kts'],
      ['TIMESTAMP', rec.tsDisplay],
      ['STATUS',  'LOCKED'],
    ];
    fields.forEach(([k,v],idx) => {
      const y = ty + idx*lineH;
      // Key
      setFont(7,[255,255,255,0.3*255],'bold');
      doc.text(k, tx, y);
      // Value — highlight threat
      const isRed = (k==='THREAT'&&v==='HIGH')||(k==='STATUS');
      setFont(7, isRed ? [255,32,32] : [220,220,220]);
      doc.text(v, tx+28, y);
      // row separator
      doc.setDrawColor(255,255,255,30); doc.setLineWidth(0.1);
      doc.line(tx, y+1.5, W-8, y+1.5);
    });

    // ── Threat tier color bar
    const tierColors = {HIGH:[255,32,32], MED:[255,140,0], LOW:[255,220,50]};
    const tc = tierColors[rec.threat]||[200,200,200];
    doc.setFillColor(...tc); doc.rect(W-11,21,3,60,'F');
    setFont(6, tc, 'bold');
    // vertical text for tier
    doc.text(rec.threat, W-10, 55, {angle:90});

    // ── Divider before notes
    doc.setDrawColor(255,32,32,0.3); doc.setLineWidth(0.15); doc.line(8,88,W-8,88);

    // ── Intel section header
    setFont(7,[255,32,32],'bold');
    doc.text('// INTELLIGENCE ASSESSMENT', 8, 93);
    setFont(7,[180,180,180]);
    const notes = [
      `Object class "${rec.cls}" detected with ${rec.conf}% confidence by COCO-SSD neural network.`,
      `Threat classification: ${rec.threat}. Coordinates at time of capture: ${rec.lat}°N ${rec.lon}°E.`,
      `Altitude ${rec.alt}m, platform speed ${rec.spd}kts. Sector ${rec.sector}.`,
      `Unique target identifier: ${rec.uid}. Data archived in session cache.`,
    ];
    notes.forEach((n,j)=>{
      doc.text(n, 8, 99+j*5, {maxWidth:W-16});
    });

    // ── Footer
    doc.setDrawColor(255,32,32,0.2); doc.line(3,H-10,W-3,H-10);
    setFont(6,[80,80,80]);
    doc.text(`myFIX TACTICAL // PAGE ${i+1}/${total} // ${new Date().toUTCString()}`, W/2, H-6, {align:'center'});
    setFont(6,[255,32,32]);
    doc.text(`THREAT LEVEL: ${rec.threat}`, 8, H-6);
  }

  pdfProgress.value=100;
  pdfSub.textContent='REPORT READY';

  // Offer download
  const blob    = doc.output('blob');
  const url     = URL.createObjectURL(blob);
  const dLink   = document.createElement('a');
  dLink.href    = url;
  dLink.download= `myFIX_report_${Date.now()}.pdf`;

  // On iOS, open in new tab (download attribute not always supported)
  if (IS_IOS) {
    pdfLink.style.display = 'block';
    pdfLink.onclick = () => { window.open(url,'_blank'); };
  } else {
    pdfLink.style.display='block';
    pdfLink.onclick = () => { dLink.click(); };
  }

  typeLog(`PDF READY — ${total} OBJECTS`,'info');

  // Auto-hide toast after 30s
  setTimeout(()=>{
    if(pdfToast.style.display!=='none'){
      pdfToast.style.display='none';
      URL.revokeObjectURL(url);
    }
  },30000);
}

   TAP / POINTER HANDLER
════════════════════════════════════════════════════ */
document.getElementById('container').addEventListener('pointerdown', e => {
  if (startBtn.style.display !== 'none') return;
  if (pdfToast.style.display === 'flex') { pdfToast.style.display='none'; return; }

  if (cardVisible) {
    const r = captureCard.getBoundingClientRect();
    const inside = e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if (!inside) hideCard();
    return;
  }

  // Manual single capture
  if (!seriesActive && isLocked && primaryTarget) {
    (async()=>{
      const rec = await doCapture(primaryTarget);
      if (!rec) return;
      renderCardFromRecord(rec);
      showCard();
      flashEffects();
      typeLog(`PORTRAIT CAPTURED // ${primaryTarget.class.toUpperCase()}`, 'threat');
    })();
  }
});

/* ════════════════════════════════════════════════════
   DETECT LOOP  (throttled on mobile)
════════════════════════════════════════════════════ */
async function detectLoop() {
  if (model && video.readyState >= 3) {
    try {
      allPredictions = await model.detect(video);
      primaryTarget  = allPredictions[0] || null;
    } catch {}
  }

  // Series auto-capture tick
  await seriesTick();

  if (primaryTarget) {
    const p = primaryTarget;
    const [x,y,w,h] = p.bbox;
    const sX = innerWidth/(video.videoWidth||1), sY = innerHeight/(video.videoHeight||1);
    targetPos.x=(x+w/2)*sX; targetPos.y=(y+h/2)*sY; targetPos.active=true;

    const dist = Math.hypot(currentPos.x-targetPos.x, currentPos.y-targetPos.y);
    const wasLocked = isLocked;
    isLocked = dist < 130;

    if (isLocked && !wasLocked) {
      textTick=0; buildInfo(p);
      document.getElementById('threatBox').classList.add('show');
      document.getElementById('lockStat').textContent = p.class.toUpperCase();
      document.getElementById('lockStat').className  = 'sp-val active';
      glitchActive=12;
      typeLog(`LOCK — ${p.class.toUpperCase()} [${getThreat(p.class.toLowerCase())}]`,'threat');
      if (!cardVisible && !seriesActive) tapHint.classList.add('show');
    }
    if (!isLocked && wasLocked) {
      document.getElementById('threatBox').classList.remove('show');
      document.getElementById('lockStat').textContent='--';
      document.getElementById('lockStat').className='sp-val';
      tapHint.classList.remove('show');
    }

    document.getElementById('objCount').textContent = String(allPredictions.length).padStart(2,'0');
    document.getElementById('confBar').style.width  = Math.round(p.score*100)+'%';
    document.getElementById('confBar').className    = 'bar-fill'+(isLocked?' danger':'');
  } else {
    targetPos.active=false; isLocked=false;
    document.getElementById('objCount').textContent='00';
    document.getElementById('confBar').style.width='0%';
    document.getElementById('threatBox').classList.remove('show');
    document.getElementById('lockStat').textContent='--';
    document.getElementById('lockStat').className='sp-val';
    tapHint.classList.remove('show');
  }
  setTimeout(detectLoop, DETECT_INTERVAL);
}

function buildInfo(p) {
  const tier=getThreat(p.class.toLowerCase());
  infoLines=[
    {k:'CLASS', v:p.class.toUpperCase()},{k:'THREAT',v:tier},
    {k:'CONF',  v:Math.round(p.score*100)+'%'},
    {k:'ID',    v:'0x'+Math.random().toString(16).slice(2,8).toUpperCase()},
    {k:'SECTOR',v:`${String.fromCharCode(65+Math.floor(Math.random()*6))}${Math.floor(Math.random()*9+1)}`},
    {k:'STATUS',v:'LOCKED'},
  ];
  const tl=document.getElementById('threatLines'); tl.innerHTML='';
  infoLines.forEach(l=>{
    const r=document.createElement('div'); r.className='tbi';
    r.innerHTML=`<span class="tbi-key">${l.k}</span>  ${l.v}`;
    tl.appendChild(r);
  });
}

/* ════════════════════════════════════════════════════
   DRAW LOOP
════════════════════════════════════════════════════ */
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const dpr=EFF_DPR, W=canvas.width, H=canvas.height;

  const dX=targetPos.active?targetPos.x:innerWidth/2;
  const dY=targetPos.active?targetPos.y:innerHeight/2;
  currentPos.x+=(dX-currentPos.x)*0.12;
  currentPos.y+=(dY-currentPos.y)*0.12;

  lockFactor=isLocked?Math.min(1,lockFactor+0.08):Math.max(0,lockFactor-0.04);
  pulseTime+=0.05; scanAngle+=0.02;

  const tier=primaryTarget?getThreat(primaryTarget.class.toLowerCase()):null;
  let rr=200,rg=220,rb=255;
  if(isLocked){
    if(tier==='HIGH'){rr=255;rg=20;rb=20;}
    else if(tier==='MED'){rr=255;rg=140;rb=0;}
    else{rr=255;rg=220;rb=50;}
  }
  // Series mode: pulse color
  if(seriesActive){ rr=Math.min(255,rr+30); rg=Math.max(0,rg-40); }

  const mainColor=`rgba(${rr},${rg},${rb},${0.6+0.4*lockFactor})`;

  /* EW */
  ewTimer++;
  if(ewTimer%220===0) ewIntensity=20;
  if(ewIntensity>0){
    ewIntensity=Math.max(0,ewIntensity-0.7);
    document.getElementById('ewAlert').classList.add('show');
    document.getElementById('ewBar').style.width=(ewIntensity/20*100)+'%';
    document.getElementById('ewBar').classList.add('danger');
  } else {
    document.getElementById('ewAlert').classList.remove('show');
    document.getElementById('ewBar').style.width='0%';
    document.getElementById('ewBar').classList.remove('danger');
  }

  ctx.save();
  if(glitchActive>0){ctx.translate((Math.random()-0.5)*12*dpr,(Math.random()-0.5)*6*dpr);glitchActive--;}
  if(ewIntensity>5) ctx.translate((Math.random()-0.5)*8*dpr*(ewIntensity/20),0);

  if(USE_SHADOW){ ctx.shadowBlur=8+12*lockFactor; ctx.shadowColor=mainColor; }
  ctx.strokeStyle=mainColor; ctx.fillStyle=mainColor;

  const cx=currentPos.x*dpr, cy=currentPos.y*dpr;

  /* Secondary detections */
  if(allPredictions.length>1){
    ctx.save(); if(USE_SHADOW) ctx.shadowBlur=3;
    for(let i=1;i<allPredictions.length;i++){
      const p=allPredictions[i];
      const [bx,by,bw,bh]=p.bbox;
      const sX=innerWidth/(video.videoWidth||1), sY=innerHeight/(video.videoHeight||1);
      const rx=bx*sX*dpr,ry=by*sY*dpr,rw=bw*sX*dpr,rh=bh*sY*dpr;
      const t=getThreat(p.class.toLowerCase());
      ctx.strokeStyle=t==='HIGH'?'rgba(255,80,80,0.4)':t==='MED'?'rgba(255,160,0,0.35)':'rgba(200,200,255,0.25)';
      if(USE_SHADOW) ctx.shadowColor=ctx.strokeStyle;
      ctx.lineWidth=1*dpr;
      ctx.setLineDash([4*dpr,4*dpr]); ctx.strokeRect(rx,ry,rw,rh); ctx.setLineDash([]);
      ctx.fillStyle=ctx.strokeStyle; ctx.font=`${9*dpr}px 'Share Tech Mono'`;
      ctx.fillText(p.class.toUpperCase(),rx+4*dpr,ry-4*dpr);
    }
    ctx.restore();
  }

  /* Primary bbox */
  if(primaryTarget&&targetPos.active){
    const p=primaryTarget;
    const [bx,by,bw,bh]=p.bbox;
    const sX=innerWidth/(video.videoWidth||1), sY=innerHeight/(video.videoHeight||1);
    const rx=bx*sX*dpr,ry=by*sY*dpr,rw=bw*sX*dpr,rh=bh*sY*dpr;
    ctx.save();
    ctx.strokeStyle=mainColor; if(USE_SHADOW){ctx.shadowColor=mainColor;ctx.shadowBlur=10*lockFactor;}
    ctx.lineWidth=1.5*dpr;
    const cL=Math.min(rw,rh)*0.22;
    ctx.beginPath();
    ctx.moveTo(rx,ry+cL);ctx.lineTo(rx,ry);ctx.lineTo(rx+cL,ry);
    ctx.moveTo(rx+rw-cL,ry);ctx.lineTo(rx+rw,ry);ctx.lineTo(rx+rw,ry+cL);
    ctx.moveTo(rx+rw,ry+rh-cL);ctx.lineTo(rx+rw,ry+rh);ctx.lineTo(rx+rw-cL,ry+rh);
    ctx.moveTo(rx+cL,ry+rh);ctx.lineTo(rx,ry+rh);ctx.lineTo(rx,ry+rh-cL);
    ctx.stroke();
    ctx.fillStyle=`rgba(${rr},${rg},${rb},${0.03+0.04*lockFactor})`;
    ctx.fillRect(rx,ry,rw,rh);
    if(lockFactor>0.4){
      ctx.setLineDash([3*dpr,5*dpr]); ctx.lineWidth=0.5*dpr;
      ctx.strokeStyle=`rgba(${rr},${rg},${rb},0.3)`;
      ctx.beginPath();
      ctx.moveTo(rx-20*dpr,ry);ctx.lineTo(rx-20*dpr,ry+rh);
      ctx.moveTo(rx,ry-12*dpr);ctx.lineTo(rx+rw,ry-12*dpr);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=`rgba(${rr},${rg},${rb},0.5)`;
      ctx.font=`${8*dpr}px 'Share Tech Mono'`;
      ctx.fillText(`${Math.round(rh/dpr)}px`,rx-18*dpr,ry+rh/2,16*dpr);
      ctx.fillText(`${Math.round(rw/dpr)}px`,rx+rw/2-12*dpr,ry-14*dpr);
    }
    ctx.restore();
  }

  // Series mode: scan line overlay
  if(seriesActive){
    const scanY=(Date.now()%2000/2000)*H;
    ctx.save();
    ctx.strokeStyle=`rgba(255,32,32,0.15)`;
    ctx.lineWidth=2*dpr; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(0,scanY); ctx.lineTo(W,scanY); ctx.stroke();
    ctx.restore();
  }

  drawReticle(cx,cy,dpr,lockFactor,mainColor,rr,rg,rb);

  if(lockFactor>0.05){
    ctx.globalAlpha=lockFactor;
    drawDataBlock(cx,cy,dpr,mainColor);
    ctx.globalAlpha=1;
  }

  /* EW noise — reduced on mobile */
  if(ewIntensity>3){
    const n=Math.min(EW_PARTICLES, Math.round(ewIntensity*0.5));
    for(let i=0;i<n;i++){
      ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.12})`;
      ctx.fillRect(Math.random()*W,Math.random()*H,(1+Math.random()*2)*dpr,dpr);
    }
  }

  drawCornerDeco(W,H,dpr);
  ctx.restore();
  requestAnimationFrame(draw);
}

/* ── Reticle ── */
function drawReticle(cx,cy,dpr,lf,mainColor,rr,rg,rb){
  ctx.save(); ctx.translate(cx,cy);
  ctx.strokeStyle=`rgba(${rr},${rg},${rb},0.2)`; ctx.lineWidth=0.5*dpr; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(0,0,110*dpr,0,Math.PI*2); ctx.stroke();
  if(lf>0.1){
    const pulse=0.5+0.5*Math.sin(pulseTime*2);
    ctx.strokeStyle=`rgba(${rr},${rg},${rb},${0.08+0.1*pulse*lf})`; ctx.lineWidth=0.5*dpr;
    for(const r of[60,80,100]){ctx.beginPath();ctx.arc(0,0,r*dpr,0,Math.PI*2);ctx.stroke();}
  }
  if(lf>0.15){
    ctx.save(); ctx.rotate(pulseTime*1.5);
    ctx.strokeStyle=`rgba(${rr},${rg},${rb},${0.3+0.3*lf})`; ctx.lineWidth=1.5*dpr;
    if(USE_SHADOW){ctx.shadowBlur=6*lf;ctx.shadowColor=mainColor;}
    ctx.setLineDash([18*dpr,50*dpr]);
    ctx.beginPath(); ctx.arc(0,0,95*dpr,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  if(!IS_MOBILE&&lf>0.3){
    ctx.save(); ctx.rotate(-pulseTime*0.8);
    ctx.strokeStyle=`rgba(${rr},${rg},${rb},${0.15+0.15*lf})`; ctx.lineWidth=0.8*dpr;
    ctx.setLineDash([6*dpr,20*dpr]);
    ctx.beginPath(); ctx.arc(0,0,75*dpr,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  ctx.setLineDash([]);
  const bS=(28-8*lf)*dpr, bD=(8+14*lf)*dpr;
  ctx.strokeStyle=mainColor; ctx.lineWidth=2.5*dpr;
  if(USE_SHADOW){ctx.shadowBlur=10*lf;ctx.shadowColor=mainColor;}
  for(let i=0;i<4;i++){
    ctx.save(); ctx.rotate(i*Math.PI/2);
    ctx.beginPath();
    ctx.moveTo(bS,-bS+bD); ctx.lineTo(bS,-bS); ctx.lineTo(bS-bD,-bS);
    ctx.stroke(); ctx.restore();
  }
  ctx.lineWidth=1.5*dpr; if(USE_SHADOW) ctx.shadowBlur=6;
  const c=7*dpr, gap=4*dpr;
  ctx.beginPath();
  ctx.moveTo(-c,0);ctx.lineTo(-gap,0); ctx.moveTo(gap,0);ctx.lineTo(c,0);
  ctx.moveTo(0,-c);ctx.lineTo(0,-gap); ctx.moveTo(0,gap);ctx.lineTo(0,c);
  ctx.stroke();
  if(USE_SHADOW) ctx.shadowBlur=12*lf;
  ctx.beginPath(); ctx.arc(0,0,2.5*dpr,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`rgba(${rr},${rg},${rb},0.5)`; ctx.lineWidth=1*dpr; ctx.shadowBlur=0;
  // Tick marks — skip minor on mobile
  const step=IS_MOBILE?45:15;
  for(let a=0;a<360;a+=step){
    const rad=a*Math.PI/180;
    const inn=a%90===0?115*dpr:112*dpr;
    ctx.beginPath(); ctx.moveTo(Math.cos(rad)*inn,Math.sin(rad)*inn);
    ctx.lineTo(Math.cos(rad)*118*dpr,Math.sin(rad)*118*dpr); ctx.stroke();
  }
  if(!IS_MOBILE&&lf>0.5){
    const burst=(lf-0.5)*2;
    ctx.strokeStyle=`rgba(${rr},${rg},${rb},${0.15*burst})`; ctx.lineWidth=0.5*dpr;
    for(let a=0;a<360;a+=30){
      const rad=a*Math.PI/180;
      ctx.beginPath();
      ctx.moveTo(Math.cos(rad)*120*dpr,Math.sin(rad)*120*dpr);
      ctx.lineTo(Math.cos(rad)*(120+30*burst)*dpr,Math.sin(rad)*(120+30*burst)*dpr);
      ctx.stroke();
    }
  }
  if(lf<0.8){
    ctx.save(); ctx.rotate(scanAngle);
    const sg=ctx.createLinearGradient(0,-100*dpr,0,0);
    sg.addColorStop(0,`rgba(${rr},${rg},${rb},0.0)`);
    sg.addColorStop(1,`rgba(${rr},${rg},${rb},${0.08*(1-lf)})`);
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,108*dpr,-0.5,0.5); ctx.closePath();
    ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

/* ── Data block ── */
function drawDataBlock(cx,cy,dpr,mainColor){
  textTick+=0.6;
  ctx.font=`${11*dpr}px 'Share Tech Mono'`;
  if(USE_SHADOW){ctx.shadowBlur=4;ctx.shadowColor=mainColor;}
  infoLines.forEach((l,i)=>{
    const chars=Math.floor(textTick-i*4); if(chars<=0) return;
    let line=(l.k+': '+l.v).substring(0,chars);
    if(ewIntensity>8&&Math.random()>0.6)
      line=line.replace(/[A-Z0-9]/g,c=>Math.random()>0.6?String.fromCharCode(33+Math.random()*20):c);
    ctx.fillText('› '+line, cx+120*dpr, cy-30*dpr+i*(11*dpr)*1.6);
  });
  if(!IS_MOBILE&&Math.random()>0.85){ctx.globalAlpha=0.3;ctx.fillRect(cx+115*dpr,cy+40*dpr,Math.random()*50*dpr,1.5*dpr);ctx.globalAlpha=1;}
}

/* ── Corner deco ── */
function drawCornerDeco(W,H,dpr){
  const s=30*dpr;
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1*dpr; ctx.shadowBlur=0; ctx.setLineDash([]);
  [[0,0,1,1],[W,0,-1,1],[W,H,-1,-1],[0,H,1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(x+sx*s,y); ctx.lineTo(x,y); ctx.lineTo(x,y+sy*s); ctx.stroke();
  });
  if(!IS_MOBILE){
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=0.5*dpr; ctx.setLineDash([5*dpr,15*dpr]);
    ctx.beginPath(); ctx.moveTo(0,H/2);ctx.lineTo(W,H/2); ctx.moveTo(W/2,0);ctx.lineTo(W/2,H); ctx.stroke();
    ctx.setLineDash([]);
  }
}
