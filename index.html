<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD TACTICAL AI v3.0</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.6) contrast(1.2) saturate(0.8); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #overlay {
            position: absolute; top: 20px; left: 20px; color: #0f0; 
            text-shadow: 0 0 8px #0f0; font-size: 12px; z-index: 10; letter-spacing: 1px;
        }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 35px; background: none; border: 1px solid #0f0; color: #0f0;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 15px rgba(0,255,0,0.3);
            text-transform: uppercase; letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">Initialize HUD</button>
    <div id="overlay">OS: NEURAL_LINK_v4 // STATUS: STANDBY</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const overlay = document.getElementById('overlay');

let model;
let targetPos = { x: 0, y: 0, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let pulseTime = 0;
let textTick = 0;
let infoLines = [];

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    overlay.innerHTML = "BOOTING... [RECOGNITION_CORE_LOADED]";
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        model = await cocoSsd.load();
        overlay.innerHTML = "OS: ACTIVE // LINK: STABLE // SCANNING...";
        resize();
        detectFrame();
        draw();
    } catch (err) {
        overlay.innerHTML = "FATAL ERROR: SENSOR_ACCESS_DENIED";
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
            const p = predictions[0];
            const [x, y, w, h] = p.bbox;
            const sX = window.innerWidth / video.videoWidth;
            const sY = window.innerHeight / video.videoHeight;

            targetPos.x = (x + w/2) * sX;
            targetPos.y = (y + h/2) * sY;
            targetPos.active = true;
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let wasLocked = isLocked;
            isLocked = dist < 80;

            if (isLocked && !wasLocked) {
                textTick = 0;
                infoLines = [
                    `TARGET: ${p.class.toUpperCase()}`,
                    `PROB: ${Math.round(p.score * 100)}%`,
                    `STATUS: LOCKED`,
                    `COORD: ${Math.floor(targetPos.x)}.${Math.floor(targetPos.y)}`
                ];
            }
        } else {
            targetPos.active = false;
            isLocked = false;
        }
    }
    setTimeout(detectFrame, 60);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    const tx = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const ty = targetPos.active ? targetPos.y : window.innerHeight / 2;

    currentPos.x += (tx - currentPos.x) * 0.15;
    currentPos.y += (ty - currentPos.y) * 0.15;

    // Глитч-эффект при захвате
    let shakeX = isLocked ? (Math.random() - 0.5) * 3 : 0;
    let shakeY = isLocked ? (Math.random() - 0.5) * 3 : 0;

    const cx = (currentPos.x + shakeX) * dpr;
    const cy = (currentPos.y + shakeY) * dpr;
    
    pulseTime += 0.1;
    const pulseScale = isLocked ? (1 + Math.sin(pulseTime * 2) * 0.04) : 1;
    const color = isLocked ? "#ff1100" : "#ffffff";

    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2 * dpr;
    ctx.shadowBlur = isLocked ? 15 : 5;
    ctx.shadowColor = color;

    // --- Центральный прицел ---
    const s = 25 * dpr * pulseScale;
    const g = 10 * dpr * pulseScale;
    
    ctx.beginPath();
    // 4 уголка
    ctx.moveTo(cx - s, cy - g); ctx.lineTo(cx - s, cy - s); ctx.lineTo(cx - g, cy - s);
    ctx.moveTo(cx + g, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy - g);
    ctx.moveTo(cx - s, cy + g); ctx.lineTo(cx - s, cy + s); ctx.lineTo(cx - g, cy + s);
    ctx.moveTo(cx + g, cy + s); ctx.lineTo(cx + s, cy + s); ctx.lineTo(cx + s, cy + g);
    ctx.stroke();

    // Дополнительный внутренний прицел в Lock режиме
    if (isLocked) {
        const sSmall = 10 * dpr;
        ctx.beginPath();
        ctx.moveTo(cx - sSmall, cy); ctx.lineTo(cx + sSmall, cy);
        ctx.moveTo(cx, cy - sSmall); ctx.lineTo(cx, cy + sSmall);
        ctx.stroke();
    }

    // --- Боковые сегментированные дуги ---
    ctx.lineWidth = 3 * dpr;
    ctx.beginPath();
    ctx.arc(cx, cy, 95 * dpr * pulseScale, 0.8 * Math.PI, 1.2 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 95 * dpr * pulseScale, -0.2 * Math.PI, 0.2 * Math.PI);
    ctx.stroke();

    // --- Горизонтальные черточки ---
    ctx.lineWidth = 1.5 * dpr;
    ctx.beginPath();
    ctx.moveTo(cx - 60 * dpr, cy); ctx.lineTo(cx - 35 * dpr, cy);
    ctx.moveTo(cx + 60 * dpr, cy); ctx.lineTo(cx + 35 * dpr, cy);
    ctx.stroke();

    // --- Шкалы слева и справа ---
    ctx.lineWidth = 1 * dpr;
    for (let i = -3; i <= 3; i++) {
        let yOffset = cy + (i * 25 * dpr);
        ctx.beginPath();
        ctx.moveTo(cx - 130 * dpr, yOffset); ctx.lineTo(cx - 120 * dpr, yOffset);
        ctx.moveTo(cx + 130 * dpr, yOffset); ctx.lineTo(cx + 120 * dpr, yOffset);
        ctx.stroke();
    }

    // --- Печатающийся текст справа ---
    if (isLocked) {
        textTick += 0.3;
        const fontSize = 14 * dpr;
        ctx.font = `bold ${fontSize}px 'Courier New'`;
        ctx.textAlign = 'left';

        infoLines.forEach((line, index) => {
            let count = Math.floor(textTick - (index * 4));
            if (count > 0) {
                let txt = "> " + line.substring(0, count);
                ctx.fillText(txt, cx + 120 * dpr, cy - 35 * dpr + (index * fontSize * 1.5));
            }
        });
        
        // Мигающий курсор
        if (Math.floor(pulseTime * 3) % 2 === 0) {
            ctx.fillRect(cx + 120 * dpr, cy + 50 * dpr, 10 * dpr, 2 * dpr);
        }
    }

    requestAnimationFrame(draw);
}

window.onresize = resize;
</script>
</body>
</html>
