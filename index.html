<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>myFIX // NEURAL HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red:    #ff2020;
      --cyan:   #00f5ff;
      --green:  #00ff88;
      --white:  #ffffff;
      --mono:   'Share Tech Mono', monospace;
      --sans:   'Rajdhani', sans-serif;
      --orb:    'Orbitron', monospace;
    }

    body {
      margin: 0; background: #000;
      overflow: hidden;
      font-family: var(--mono);
      user-select: none;
      cursor: crosshair;
    }

    #container { position: relative; width: 100vw; height: 100vh; }

    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      filter: brightness(0.45) contrast(1.3) saturate(0.1) hue-rotate(180deg);
      z-index: 0;
    }

    #faceCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
    }

    #hudCanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #scanlines {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
      animation: scanScroll 8s linear infinite;
    }
    @keyframes scanScroll { from { background-position: 0 0; } to { background-position: 0 100px; } }

    #vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 4;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
    }

    #hudButtons {
      position: absolute; top: 20px; right: 20px;
      display: none; gap: 10px; z-index: 20;
      flex-direction: row;
    }
    #hudButtons.visible { display: flex; }

    .ui-btn {
      font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
      cursor: pointer; text-transform: uppercase; pointer-events: all;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,245,255,0.3); color: var(--cyan);
      padding: 8px 15px; transition: all .2s; position: relative; overflow: hidden;
    }
    .ui-btn:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,245,255,0.4); }

    #terminal {
      position: absolute; bottom: 50px; left: 15px;
      width: 320px; max-height: 220px;
      overflow: hidden; z-index: 15;
    }
    .log-entry {
      font-size: 10px; letter-spacing: 1.5px; line-height: 1.6;
      text-transform: uppercase; display: flex; gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .log-entry.info { color: var(--white); }
    .log-entry.threat { color: var(--red); text-shadow: 0 0 5px var(--red); }
    .log-entry.speech { color: var(--green); text-shadow: 0 0 5px var(--green); }
    
    .log-ts { color: rgba(255,255,255,0.3); flex-shrink: 0; }
    #cursor { display: inline-block; width: 7px; height: 12px; background: var(--white); animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    #statusPanel {
      position: absolute; top: 80px; right: 20px;
      width: 180px; z-index: 15;
      display: flex; flex-direction: column; gap: 6px;
    }
    .sp-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 4px; }
    .sp-key { font-family: var(--sans); font-size: 9px; letter-spacing: 1px; color: rgba(255,255,255,0.3); }
    .sp-val { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.7); }

    #startBtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: none; border: none; color: #fff; z-index: 20; cursor: pointer;
    }
    .btn-inner { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .btn-text { font-family: var(--sans); letter-spacing: 5px; text-transform: uppercase; font-size: 11px; }

    #face-info {
      position: absolute; z-index: 12; pointer-events: none;
      font-size: 9px; color: var(--cyan); opacity: 0; transition: opacity 0.3s;
      text-align: center; transform: translateX(-50%); text-shadow: 0 0 8px var(--cyan);
    }
    #face-info.visible { opacity: 1; }

    #audioVizWrap {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      width: 300px; z-index: 15; opacity: 0; transition: opacity 0.5s;
    }
    #audioVizWrap.visible { opacity: 1; }
    #audioVisualizer { width: 100%; height: 30px; }

    #liveSpeechBox {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      font-family: var(--orb); font-size: 14px; color: #fff;
      z-index: 16; opacity: 0; transition: 0.3s; text-align: center;
    }
    #liveSpeechBox.visible { opacity: 1; }
    #liveSpeechBox.speaking { color: var(--green); text-shadow: 0 0 15px var(--green); }

    #threatBox {
      position: absolute; top: 300px; right: 20px;
      z-index: 15; width: 180px; opacity: 0; transition: 0.4s;
    }
    #threatBox.show { opacity: 1; }
    .tb-header { color: var(--red); font-size: 10px; border-bottom: 1px solid var(--red); margin-bottom: 5px; }
    .tbi { font-size: 10px; color: #fff; line-height: 1.8; }
  </style>
</head>
<body>
<div id="container">
  <button id="startBtn">
    <div class="btn-inner">
      <svg width="60" height="60" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="36" stroke="rgba(255,255,255,0.3)" fill="none" stroke-width="1" />
        <path d="M40 10 L40 20 M70 40 L60 40 M40 70 L40 60 M10 40 L20 40" stroke="white" />
      </svg>
      <span class="btn-text">initialize system</span>
    </div>
  </button>

  <div id="vignette"></div>
  <div id="scanlines"></div>
  <video id="video" autoplay playsinline muted></video>
  <video id="faceVideo" autoplay playsinline muted style="display:none;"></video>
  <canvas id="faceCanvas"></canvas>
  <canvas id="hudCanvas"></canvas>

  <div id="hudButtons">
    <button class="ui-btn" id="exportBtn">Log</button>
    <button class="ui-btn" id="langBtn">RU</button>
    <button class="ui-btn" id="switchCamBtn">Cam</button>
  </div>

  <div id="statusPanel" style="display:none">
    <div class="sp-row"><span class="sp-key">MODEL</span><span class="sp-val">COCO-SSD</span></div>
    <div class="sp-row"><span class="sp-key">FACE</span><span class="sp-val" id="faceStat">SCAN</span></div>
    <div class="sp-row"><span class="sp-key">AUDIO</span><span class="sp-val" id="audioStat">OFF</span></div>
  </div>

  <div id="threatBox">
    <div class="tb-header">// TARGET ACQUIRED</div>
    <div id="threatLines"></div>
  </div>

  <div id="face-info">
    <span id="fi-0"></span><br><span id="fi-1"></span>
  </div>

  <div id="audioVizWrap">
    <canvas id="audioVisualizer"></canvas>
  </div>
  <div id="liveSpeechBox">...</div>
  <div id="terminal"><span id="cursor"></span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<script>
const video = document.getElementById('video');
const faceVideo = document.getElementById('faceVideo');
const hudCanvas = document.getElementById('hudCanvas');
const faceCanvas = document.getElementById('faceCanvas');
const hCtx = hudCanvas.getContext('2d');
const fCtx = faceCanvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const terminal = document.getElementById('terminal');
const cursor = document.getElementById('cursor');

let cocoModel, faceMeshModel, recognition;
let allPredictions = [];
let isSpeaking = false;
let currentLang = 'ru-RU';
let audioCtx, analyser, freqData;

/* --- LOGGER --- */
function addLog(msg, type = 'info') {
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  entry.innerHTML = `<span class="log-ts">${time}</span> <span>› ${msg}</span>`;
  terminal.insertBefore(entry, cursor);
  if (terminal.children.length > 12) terminal.removeChild(terminal.firstChild);
}

/* --- START --- */
startBtn.onclick = async () => {
  startBtn.style.display = 'none';
  document.getElementById('statusPanel').style.display = 'flex';
  document.getElementById('hudButtons').classList.add('visible');
  
  addLog('SYSTEM BOOT', 'info');

  const stream = await navigator.mediaDevices.getUserMedia({ 
    video: { facingMode: 'user', width: 1280, height: 720 }, 
    audio: true 
  });
  video.srcObject = stream;
  faceVideo.srcObject = stream;

  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  document.getElementById('audioVizWrap').classList.add('visible');
  document.getElementById('audioStat').textContent = 'ON';

  cocoModel = await cocoSsd.load();
  addLog('NEURAL NET ONLINE', 'info');

  initFaceMesh();
  initSpeech();
  
  requestAnimationFrame(mainLoop);
  detectObjects();
};

/* --- OBJECT DETECTION (COCO) --- */
async function detectObjects() {
  if (cocoModel && video.readyState >= 3) {
    allPredictions = await cocoModel.detect(video);
    allPredictions.forEach(p => {
      const cls = p.class.toLowerCase();
      if (['person', 'car', 'truck', 'bus', 'motorcycle'].includes(cls)) {
        addLog(`DETECTED: ${cls.toUpperCase()}`, 'threat');
      }
    });
  }
  setTimeout(detectObjects, 1500);
}

/* --- FACE MESH --- */
function initFaceMesh() {
  faceMeshModel = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMeshModel.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
  faceMeshModel.onResults(results => {
    fCtx.save();
    fCtx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
    
    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      document.getElementById('faceStat').textContent = 'LOCKED';
      const lm = results.multiFaceLandmarks[0];
      
      // Наложение сетки (Tesselation)
      fCtx.strokeStyle = isSpeaking ? '#00ff88' : '#00f5ff';
      fCtx.lineWidth = 0.5;
      fCtx.globalAlpha = 0.4;
      fCtx.beginPath();
      FACEMESH_TESSELATION.forEach(edge => {
        const a = lm[edge[0]], b = lm[edge[1]];
        fCtx.moveTo((1-a.x) * faceCanvas.width, a.y * faceCanvas.height);
        fCtx.lineTo((1-b.x) * faceCanvas.width, b.y * faceCanvas.height);
      });
      fCtx.stroke();

      // Биометрические точки
      fCtx.globalAlpha = 1;
      fCtx.fillStyle = '#00f5ff';
      [1, 4, 152, 33, 263].forEach(i => {
        const p = lm[i];
        fCtx.beginPath();
        fCtx.arc((1-p.x) * faceCanvas.width, p.y * faceCanvas.height, 2, 0, Math.PI*2);
        fCtx.fill();
      });
    } else {
      document.getElementById('faceStat').textContent = 'SCAN';
    }
    fCtx.restore();
  });

  const cam = new Camera(faceVideo, {
    onFrame: async () => { await faceMeshModel.send({image: faceVideo}); },
    width: 1280, height: 720
  });
  cam.start();
}

/* --- SPEECH --- */
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = currentLang;

  recognition.onresult = e => {
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) addLog(e.results[i][0].transcript, 'speech');
      else text = e.results[i][0].transcript;
    }
    const box = document.getElementById('liveSpeechBox');
    if (text) {
      box.textContent = text.toUpperCase();
      box.classList.add('visible', 'speaking');
      isSpeaking = true;
    }
  };
  recognition.onend = () => { isSpeaking = false; recognition.start(); };
  recognition.start();
}

/* --- MAIN HUD LOOP --- */
function mainLoop() {
  const dpr = window.devicePixelRatio;
  if (hudCanvas.width !== window.innerWidth * dpr) {
    hudCanvas.width = window.innerWidth * dpr;
    hudCanvas.height = window.innerHeight * dpr;
    faceCanvas.width = window.innerWidth;
    faceCanvas.height = window.innerHeight;
  }
  
  hCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  
  // Рисуем рамки COCO
  allPredictions.forEach(p => {
    const [x, y, w, h] = p.bbox;
    const sx = hudCanvas.width / video.videoWidth;
    const sy = hudCanvas.height / video.videoHeight;
    
    hCtx.strokeStyle = '#ff2020';
    hCtx.lineWidth = 2;
    hCtx.strokeRect(x*sx, y*sy, w*sx, h*sy);
    hCtx.fillStyle = '#ff2020';
    hCtx.font = "12px Share Tech Mono";
    hCtx.fillText(p.class.toUpperCase(), x*sx, y*sy - 5);
  });

  // EQ Audio
  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    const vCanvas = document.getElementById('audioVisualizer');
    const vCtx = vCanvas.getContext('2d');
    vCtx.clearRect(0,0, vCanvas.width, vCanvas.height);
    vCtx.fillStyle = '#00ff88';
    for(let i=0; i<60; i++) {
      const h = (freqData[i*2]/255) * vCanvas.height;
      vCtx.fillRect(i*5, vCanvas.height - h, 3, h);
    }
  }

  requestAnimationFrame(mainLoop);
}

document.getElementById('langBtn').onclick = () => {
  currentLang = currentLang === 'ru-RU' ? 'uk-UA' : 'ru-RU';
  document.getElementById('langBtn').textContent = currentLang === 'ru-RU' ? 'RU' : 'UK';
  recognition.lang = currentLang;
  addLog(`LANG SW: ${currentLang}`, 'info');
};
</script>
</body>
</html>
