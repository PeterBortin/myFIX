<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD AI Target System</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #overlay {
            position: absolute; top: 20px; left: 20px; color: #0f0; 
            text-shadow: 0 0 5px #0f0; font-size: 14px; z-index: 10;
        }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; background: none; border: 2px solid #0f0; color: #0f0;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 10px #0f0;
        }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">INITIALIZE SYSTEM</button>
    <div id="overlay">SYSTEM: STANDBY</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const overlay = document.getElementById('overlay');

let model;
let target = { x: 0, y: 0, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;

// 1. Запуск системы по кнопке (важно для iOS/Android)
startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    overlay.innerHTML = "SYSTEM: BOOTING...<br>AI: LOADING_MODEL";
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
        });
        video.srcObject = stream;
        
        model = await cocoSsd.load();
        overlay.innerHTML = "SYSTEM: ONLINE<br>AI: SCANNING";
        
        resize();
        detectFrame();
        draw();
    } catch (err) {
        overlay.innerHTML = "ERROR: ACCESS_DENIED";
        console.error(err);
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

// 2. Логика нейронки
async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        
        if (predictions.length > 0) {
            const p = predictions[0]; // Следим за первым объектом
            const [x, y, w, h] = p.bbox;
            
            // Расчет масштаба относительно видео
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            const sW = window.innerWidth;
            const sH = window.innerHeight;

            // Корректный маппинг координат object-fit: cover
            const videoRatio = vW / vH;
            const screenRatio = sW / sH;
            
            let finalX, finalY;
            if (videoRatio > screenRatio) {
                let realW = sH * videoRatio;
                finalX = (x + w/2) * (realW / vW) - (realW - sW) / 2;
                finalY = (y + h/2) * (sH / vH);
            } else {
                let realH = sW / videoRatio;
                finalX = (x + w/2) * (sW / vW);
                finalY = (y + h/2) * (realH / vH) - (realH - sH) / 2;
            }

            target.x = finalX;
            target.y = finalY;
            target.active = true;
            
            // Захват цели (дистанция до центра)
            let dist = Math.hypot(currentPos.x - target.x, currentPos.y - target.y);
            isLocked = dist < 60;
            
            overlay.innerHTML = `STATUS: ACTIVE<br>TARGET: ${p.class.toUpperCase()}<br>LOCK: ${isLocked ? 'YES' : 'NO'}`;
        } else {
            target.active = false;
            isLocked = false;
            overlay.innerHTML = "STATUS: ACTIVE<br>TARGET: SEARCHING...";
        }
    }
    requestAnimationFrame(() => setTimeout(detectFrame, 60)); 
}

// 3. Отрисовка прицела
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    const tx = target.active ? target.x : window.innerWidth / 2;
    const ty = target.active ? target.y : window.innerHeight / 2;

    // Сглаживание движения
    currentPos.x += (tx - currentPos.x) * 0.2;
    currentPos.y += (ty - currentPos.y) * 0.2;

    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;
    const color = isLocked ? "#ff3300" : "#ffffff";

    ctx.strokeStyle = color;
    ctx.lineWidth = 3 * dpr;
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;

    // Отрисовка центрального уголка (как на фото)
    const s = 25 * dpr;
    const g = 12 * dpr;
    
    ctx.beginPath();
    // 4 уголка
    ctx.moveTo(cx - s, cy - g); ctx.lineTo(cx - s, cy - s); ctx.lineTo(cx - g, cy - s);
    ctx.moveTo(cx + g, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy - g);
    ctx.moveTo(cx - s, cy + g); ctx.lineTo(cx - s, cy + s); ctx.lineTo(cx - g, cy + s);
    ctx.moveTo(cx + g, cy + s); ctx.lineTo(cx + s, cy + s); ctx.lineTo(cx + s, cy + g);
    ctx.stroke();

    // Боковые скобки
    ctx.beginPath();
    ctx.lineWidth = 2 * dpr;
    ctx.arc(cx, cy, 90 * dpr, 0.8 * Math.PI, 1.2 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 90 * dpr, -0.2 * Math.PI, 0.2 * Math.PI);
    ctx.stroke();

    // Горизонтальные черточки
    ctx.beginPath();
    ctx.moveTo(cx - 55 * dpr, cy); ctx.lineTo(cx - 35 * dpr, cy);
    ctx.moveTo(cx + 55 * dpr, cy); ctx.lineTo(cx + 35 * dpr, cy);
    ctx.stroke();

    requestAnimationFrame(draw);
}

window.onresize = resize;
</script>
</body>
</html>
