<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>myFIX v2</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #ff2020; --amber: #ffaa00; --cyan: #00f0ff; --green: #39ff14;
  --mono: 'Share Tech Mono', monospace;
}
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: var(--mono); user-select: none; cursor: crosshair; }

#video {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
object-fit: cover;
filter: brightness(0.5) contrast(1.3) saturate(0.1) hue-rotate(190deg);
z-index: 1;
}
#hud {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
z-index: 2; pointer-events: none;
}
#scanlines {
position: fixed; inset: 0; z-index: 3; pointer-events: none;
background: repeating-linear-gradient(0deg, transparent, transparent 3px,
rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px);
animation: scanScroll 8s linear infinite;
}
@keyframes scanScroll { to { background-position: 0 100px; } }
#vignette {
position: fixed; inset: 0; z-index: 3; pointer-events: none;
background: radial-gradient(ellipse 80% 80% at 50% 50%,
transparent 40%, rgba(0,0,0,0.82) 100%);
}
#flash {
position: fixed; inset: 0; z-index: 50; pointer-events: none; background: transparent;
}
#flash.go { animation: flashAnim 0.3s ease forwards; }
@keyframes flashAnim { 0% { background: rgba(0,240,255,0.2); } 100% { background: transparent; } }

/* UI */
#ui { position: fixed; inset: 0; z-index: 10; }

/* START */
#startScreen {
position: absolute; inset: 0; display: flex;
flex-direction: column; align-items: center; justify-content: center; gap: 28px;
}
#startBtn {
background: none; border: none; cursor: pointer;
display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 20px;
}
#startBtn:active { opacity: 0.7; }
.start-ring { width: 90px; height: 90px; position: relative;
display: flex; align-items: center; justify-content: center; }
.spin-svg { position: absolute; inset: 0; }
.s1 { animation: spin 4s linear infinite; }
.s2 { animation: spin 7s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.start-lbl { font-family: var(–mono); font-size: 11px; letter-spacing: 6px;
color: rgba(255,255,255,0.6); text-transform: uppercase; }
.start-sub { font-size: 8px; letter-spacing: 3px; color: rgba(0,240,255,0.35);
text-transform: uppercase; margin-top: -12px; }

/* TOPBAR */
#topbar {
position: absolute; top: 0; left: 0; right: 0; height: 40px;
background: linear-gradient(to bottom, rgba(0,0,0,0.72), transparent);
border-bottom: 1px solid rgba(0,240,255,0.07);
display: none; align-items: center; padding: 0 14px; gap: 10px;
}
.tb-brand { font-family: ‘Orbitron’, sans-serif; font-size: 11px; font-weight: 700;
letter-spacing: 5px; color: rgba(0,240,255,0.7); text-shadow: 0 0 12px rgba(0,240,255,0.4); }
.tb-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
.tb-chip { font-size: 7px; letter-spacing: 2px; padding: 2px 6px;
border: 1px solid rgba(0,240,255,0.2); color: rgba(0,240,255,0.45); text-transform: uppercase; }
.tb-chip.on { color: var(–green); border-color: rgba(57,255,20,0.3); text-shadow: 0 0 6px var(–green); }
.tb-r { margin-left: auto; display: flex; align-items: center; gap: 12px; }
#tbFps { font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
.rec { display: flex; align-items: center; gap: 5px; font-size: 7px; letter-spacing: 3px; color: var(–red); }
.recdot { width: 5px; height: 5px; border-radius: 50%;
background: var(–red); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* BOTBAR */
#botbar {
position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
border-top: 1px solid rgba(255,255,255,0.05);
display: none; align-items: center; justify-content: space-between; padding: 0 14px;
}
.coord { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 1.5px; }

/* TERMINAL */
#terminal {
position: absolute; bottom: 44px; left: 12px;
width: 290px; max-height: 195px; overflow: hidden; pointer-events: none;
}
.ll { font-size: 9px; letter-spacing: 1.5px; line-height: 2;
text-transform: uppercase; display: flex; gap: 7px;
animation: fi 0.2s ease; }
@keyframes fi { from { opacity: 0; transform: translateY(4px); } }
.ll.info  { color: rgba(255,255,255,0.38); }
.ll.threat{ color: var(–red); }
.ll.ok    { color: var(–green); }
.ll.sys   { color: var(–cyan); }
.ll.lock  { color: var(–amber); }
.lts { color: rgba(255,255,255,0.18); flex-shrink: 0; }
.larr { color: rgba(255,255,255,0.18); }
#cur { display: inline-block; width: 6px; height: 11px;
background: rgba(0,240,255,0.5); vertical-align: middle; margin-left: 2px;
animation: blink 0.8s steps(1) infinite; }

/* STAT PANEL */
#statPanel {
position: absolute; top: 48px; right: 12px;
width: 185px; display: none; flex-direction: column; gap: 4px;
}
.sr { display: flex; justify-content: space-between; align-items: center;
border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 3px; }
.sk { font-size: 7px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.22); }
.sv { font-size: 9px; letter-spacing: 1px; color: rgba(255,255,255,0.55); }
.sv.red   { color: var(–red);   text-shadow: 0 0 7px var(–red); }
.sv.green { color: var(–green); text-shadow: 0 0 7px var(–green); }
.sv.amber { color: var(–amber); text-shadow: 0 0 7px var(–amber); }
.sv.cyan  { color: var(–cyan);  text-shadow: 0 0 6px var(–cyan); }
.bw { width: 78px; height: 3px; background: rgba(255,255,255,0.07); }
.bf { height: 100%; transition: width 0.25s; background: rgba(0,240,255,0.55); }
.bf.red { background: var(–red); box-shadow: 0 0 5px var(–red); }

/* DETECT LIST */
#detectList {
position: absolute; top: 48px; left: 12px;
width: 210px; display: none; flex-direction: column; gap: 2px;
}
.dlh { font-size: 7px; letter-spacing: 3px; color: rgba(0,240,255,0.35);
border-bottom: 1px solid rgba(0,240,255,0.1);
padding-bottom: 4px; margin-bottom: 2px; text-transform: uppercase; }
.dli { display: flex; align-items: center; gap: 6px;
border-bottom: 1px solid rgba(255,255,255,0.04); padding: 2px 0; animation: fi 0.3s; }
.dldot { width: 7px; height: 7px; border-radius: 1px; flex-shrink: 0; }
.dlname { font-size: 8px; letter-spacing: 1px; width: 76px;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255,255,255,0.5); }
.dlbw { flex: 1; height: 2px; background: rgba(255,255,255,0.06); }
.dlbf { height: 100%; transition: width 0.3s; }
.dlpct { font-size: 8px; width: 28px; text-align: right; flex-shrink: 0; }

/* CAPTURE CARD */
#captureCard {
position: absolute; top: 48px; left: 12px; display: flex;
opacity: 0; pointer-events: none; transition: opacity 0.3s;
filter: drop-shadow(0 0 8px rgba(255,32,32,0.3));
}
#captureCard.show { opacity: 1; pointer-events: auto; }
#portWrap { width: 130px; height: 130px; flex-shrink: 0;
background: #000; border: 1px solid rgba(255,32,32,0.45); overflow: hidden; position: relative; }
#portCvs { display: block; width: 100%; height: 100%; filter: brightness(1.1) contrast(1.3) saturate(0.1); }
.pcorn { position: absolute; width: 9px; height: 9px; border-color: var(–red); border-style: solid; z-index: 2; }
.pcorn.tl { top:3px; left:3px; border-width: 1.5px 0 0 1.5px; }
.pcorn.tr { top:3px; right:3px; border-width: 1.5px 1.5px 0 0; }
.pcorn.bl { bottom:3px; left:3px; border-width: 0 0 1.5px 1.5px; }
.pcorn.br { bottom:3px; right:3px; border-width: 0 1.5px 1.5px 0; }
#pscans { position: absolute; inset: 0; pointer-events: none; z-index: 1;
background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px); }
#pstamp { position: absolute; bottom: 3px; left: 4px; right: 4px; z-index: 3;
font-size: 7px; color: rgba(255,32,32,0.55); letter-spacing: 0.8px; display: flex; justify-content: space-between; }
#capMeta { width: 158px; background: rgba(0,0,0,0.88);
border: 1px solid rgba(255,32,32,0.2); border-left: none; padding: 7px 8px; }
.cmhdr { font-family: ‘Orbitron’, sans-serif; font-size: 7px; letter-spacing: 3px; color: var(–red);
border-bottom: 1px solid rgba(255,32,32,0.25); padding-bottom: 4px; margin-bottom: 5px;
display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
.cmbl { width: 5px; height: 5px; border-radius: 50%; background: var(–red); animation: blink 0.65s steps(1) infinite; }
.cmrow { display: flex; justify-content: space-between;
border-bottom: 1px solid rgba(255,255,255,0.04); padding: 2px 0; }
.cmk { font-size: 7px; letter-spacing: 1.5px; color: rgba(255,255,255,0.2); text-transform: uppercase; }
.cmv { font-size: 8px; color: rgba(255,255,255,0.6); letter-spacing: 0.8px; }
.cmv.red { color: var(–red); text-shadow: 0 0 4px var(–red); }

/* TAP HINT */
#tapHint {
position: absolute; bottom: 110px; left: 0; right: 0; text-align: center;
font-size: 9px; letter-spacing: 5px; text-transform: uppercase;
color: rgba(255,255,255,0.25); pointer-events: none;
opacity: 0; transition: opacity 0.4s;
animation: tpulse 2.5s ease-in-out infinite;
}
#tapHint.show { opacity: 1; }
@keyframes tpulse { 0%,100%{opacity:0.25}50%{opacity:0.55} }
#tapHint::before { content: ’[ ‘; color: var(–cyan); }
#tapHint::after  { content: ’ ]’; color: var(–cyan); }

/* THREAT BOX */
#threatBox { position: absolute; top: 50%; right: 200px; transform: translateY(-50%);
width: 168px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
#threatBox.show { opacity: 1; }
.tbhdr { font-family: ‘Orbitron’, sans-serif; font-size: 8px; letter-spacing: 3px; color: var(–red);
border-bottom: 1px solid rgba(255,32,32,0.25); padding-bottom: 5px; margin-bottom: 7px;
display: flex; align-items: center; gap: 7px; text-transform: uppercase; }
.tbhdr::before { content:’’; width:5px; height:5px; border-radius:50%;
background:var(–red); flex-shrink:0; animation:blink 0.7s steps(1) infinite; }
.ti { font-size: 9px; color: rgba(255,255,255,0.55); letter-spacing: 1px; line-height: 2.1; }
.tik { color: rgba(255,255,255,0.22); margin-right: 4px; }

/* RADAR */
#radarWrap { position: absolute; bottom: 44px; right: 12px; display: none; }
</style>

</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="hud"></canvas>

<div id="scanlines"></div>
<div id="vignette"></div>
<div id="flash"></div>

<div id="ui">

  <!-- START -->

  <div id="startScreen">
    <button id="startBtn">
      <div class="start-ring">
        <svg class="spin-svg s1" viewBox="0 0 90 90" fill="none">
          <circle cx="45" cy="45" r="41" stroke="rgba(0,240,255,0.18)" stroke-width="1" stroke-dasharray="7 4"/>
          <circle cx="45" cy="45" r="41" stroke="rgba(0,240,255,0.6)" stroke-width="1.5" stroke-dasharray="22 160" stroke-linecap="round"/>
        </svg>
        <svg class="spin-svg s2" viewBox="0 0 70 70" fill="none" style="inset:10px">
          <circle cx="35" cy="35" r="31" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 7"/>
        </svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="2.5" fill="rgba(0,240,255,0.9)"/>
          <circle cx="12" cy="12" r="5" stroke="rgba(0,240,255,0.3)" stroke-width="0.8"/>
          <line x1="12" y1="2"  x2="12" y2="6"  stroke="rgba(0,240,255,0.65)" stroke-width="1.5"/>
          <line x1="12" y1="18" x2="12" y2="22" stroke="rgba(0,240,255,0.65)" stroke-width="1.5"/>
          <line x1="2"  y1="12" x2="6"  y2="12" stroke="rgba(0,240,255,0.65)" stroke-width="1.5"/>
          <line x1="18" y1="12" x2="22" y2="12" stroke="rgba(0,240,255,0.65)" stroke-width="1.5"/>
        </svg>
      </div>
      <span class="start-lbl">initialize system</span>
      <span class="start-sub">myFIX // NEURAL v2</span>
    </button>
  </div>

  <!-- TOPBAR -->

  <div id="topbar">
    <span class="tb-brand">myFIX</span>
    <div class="tb-sep"></div>
    <span class="tb-chip" id="tbModel">LOADING</span>
    <span class="tb-chip on" id="tbMode">PASSIVE</span>
    <div class="tb-r">
      <span id="tbFps">-- FPS</span>
      <div class="rec"><div class="recdot"></div>REC</div>
    </div>
  </div>

  <!-- DETECT LIST -->

  <div id="detectList">
    <div class="dlh">// detections</div>
    <div id="dlItems"></div>
  </div>

  <!-- CAPTURE CARD -->

  <div id="captureCard">
    <div id="portWrap">
      <canvas id="portCvs"></canvas>
      <div class="pcorn tl"></div><div class="pcorn tr"></div>
      <div class="pcorn bl"></div><div class="pcorn br"></div>
      <div id="pscans"></div>
      <div id="pstamp"><span id="pTime">--:--:--</span><span id="pId">ID:------</span></div>
    </div>
    <div id="capMeta">
      <div class="cmhdr"><span>SUBJ DATA</span><div class="cmbl"></div></div>
      <div id="cmRows"></div>
    </div>
  </div>

  <div id="tapHint">TAP TO CAPTURE</div>

  <!-- STAT PANEL -->

  <div id="statPanel">
    <div class="sr"><span class="sk">network</span><span class="sv green">ONLINE</span></div>
    <div class="sr"><span class="sk">model</span><span class="sv" id="sModel">--</span></div>
    <div class="sr"><span class="sk">objects</span><span class="sv" id="sObjs">00</span></div>
    <div class="sr"><span class="sk">primary</span><span class="sv" id="sPrimary">--</span></div>
    <div class="sr"><span class="sk">threat</span><span class="sv" id="sThreat">--</span></div>
    <div class="sr"><span class="sk">conf</span><div class="bw"><div class="bf" id="sConf" style="width:0%"></div></div></div>
    <div class="sr"><span class="sk">infer</span><span class="sv cyan" id="sInfer">--ms</span></div>
    <div class="sr"><span class="sk">captures</span><span class="sv" id="sCap">0</span></div>
    <div class="sr"><span class="sk">ew</span><div class="bw"><div class="bf" id="sEw" style="width:0%"></div></div></div>
  </div>

  <!-- THREAT BOX -->

  <div id="threatBox">
    <div class="tbhdr">TARGET ACQUIRED</div>
    <div id="tLines"></div>
  </div>

  <!-- RADAR -->

  <div id="radarWrap"><canvas id="radarCvs" width="100" height="100"></canvas></div>

  <!-- TERMINAL -->

  <div id="terminal"><span id="cur"></span></div>

  <!-- BOTBAR -->

  <div id="botbar">
    <span class="coord" id="coordL">LAT 00°00'00"N  LON 000°00'00"E</span>
    <span class="coord" id="coordR">ALT --m  SPD --kts  HDG --°</span>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
'use strict';

const THREAT_H = new Set(['person','car','truck','bus','motorcycle','airplane','boat','train']);
const THREAT_M = new Set(['bicycle','horse','cow','dog','cat','bird','sheep','bear','elephant']);
function tier(c){ return THREAT_H.has(c)?'HIGH':THREAT_M.has(c)?'MED':'LOW'; }
function tColor(t){ return t==='HIGH'?[255,32,32]:t==='MED'?[255,160,0]:[0,220,255]; }

// Elements
const video    = document.getElementById('video');
const hud      = document.getElementById('hud');
const hc       = hud.getContext('2d');
const flashEl  = document.getElementById('flash');
const tapHint  = document.getElementById('tapHint');
const threatBox= document.getElementById('threatBox');
const capCard  = document.getElementById('captureCard');
const detList  = document.getElementById('detectList');
const portCvs  = document.getElementById('portCvs');
const portCtx  = portCvs.getContext('2d');
const radarCvs = document.getElementById('radarCvs');
const rc       = radarCvs.getContext('2d');

// State
let model=null, preds=[], primary=null;
let curX=0,curY=0,tgtX=0,tgtY=0,tgtOn=false;
let locked=false,lockF=0;
let T=0,radarA=0,glitch=0,ewI=0,ewTick=0;
let capCount=0,cardVis=false;
let textTick=0,infoLines=[];
let inferMs=0,frameN=0,lastFpsT=Date.now(),fps=0;
let lat=55.7558,lon=37.6173;
let running=false,detecting=false;

function resize(){
  hud.width  = window.innerWidth*devicePixelRatio;
  hud.height = window.innerHeight*devicePixelRatio;
  curX=window.innerWidth/2; curY=window.innerHeight/2;
  tgtX=curX; tgtY=curY;
}
resize();
window.addEventListener('resize',resize);

function ts(){
  const d=new Date();
  return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

// Terminal
const logQ=[];let logBusy=false;
function log(msg,cls='info'){
  return new Promise(r=>{logQ.push({msg,cls,r});if(!logBusy)drain();});
}
async function drain(){
  if(!logQ.length){logBusy=false;return;}
  logBusy=true;
  const{msg,cls,r}=logQ.shift();
  const row=document.createElement('div');row.className='ll '+cls;
  const ts_=document.createElement('span');ts_.className='lts';ts_.textContent=ts();
  const ar=document.createElement('span');ar.className='larr';ar.textContent='›';
  const tx=document.createElement('span');
  row.append(ts_,ar,tx);
  const term=document.getElementById('terminal');
  term.insertBefore(row,document.getElementById('cur'));
  while(term.querySelectorAll('.ll').length>13)term.removeChild(term.querySelector('.ll'));
  for(let i=0;i<=msg.length;i++){tx.textContent=msg.slice(0,i);await new Promise(x=>setTimeout(x,14));}
  r();drain();
}

// Coords
setInterval(()=>{
  lat+=(Math.random()-.5)*0.00004;lon+=(Math.random()-.5)*0.00004;
  const f=v=>`${Math.floor(Math.abs(v))}°${String(Math.floor((Math.abs(v)%1)*60)).padStart(2,'0')}'${String(Math.floor((Math.abs(v)%1*60)%1*60)).padStart(2,'0')}"`;
  document.getElementById('coordL').textContent=`LAT ${f(lat)}${lat>0?'N':'S'}  LON ${f(lon)}${lon>0?'E':'W'}`;
  const hdg=(360+Math.round(45+Math.sin(Date.now()/10000)*20))%360;
  document.getElementById('coordR').textContent=`ALT ${180+Math.round(Math.sin(Date.now()/7000)*5)}m  SPD ${Math.round(12+Math.random()*2)}kts  HDG ${hdg}°`;
},1500);

// START
document.getElementById('startBtn').addEventListener('click',async()=>{
  const ss=document.getElementById('startScreen');
  ss.style.transition='opacity 0.4s';ss.style.opacity='0';
  setTimeout(()=>ss.style.display='none',400);

  document.getElementById('topbar').style.display='flex';
  document.getElementById('botbar').style.display='flex';
  document.getElementById('statPanel').style.display='flex';
  document.getElementById('detectList').style.display='flex';
  document.getElementById('radarWrap').style.display='block';

  await log('BOOT SEQUENCE v2.0','sys');
  await log('REQUESTING CAMERA..','info');

  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject=stream;
    await new Promise(res=>{
      video.onloadedmetadata=()=>{video.play();res();};
    });
    await log('CAMERA ONLINE','ok');
  }catch(e){
    await log('CAMERA ERROR: '+e.message.slice(0,30),'threat');
    return;
  }

  await log('LOADING NEURAL NET..','info');
  try{
    model=await cocoSsd.load({base:'mobilenet_v2'});
    document.getElementById('tbModel').textContent='COCO-SSD';
    document.getElementById('tbMode').textContent='ACTIVE';
    document.getElementById('sModel').textContent='COCO-SSD';
    await log('MODEL READY // 80 CLASSES','ok');
  }catch(e){
    await log('MODEL FAILED','threat');return;
  }

  await log('SCANNING...','sys');
  running=true;
  detectLoop();
  drawLoop();
  radarLoop();
});

// Detect
async function detectLoop(){
  if(!running)return;
  if(model&&video.readyState>=3&&!detecting){
    detecting=true;
    try{
      const t0=performance.now();
      preds=await model.detect(video);
      inferMs=Math.round(performance.now()-t0);
      primary=preds[0]||null;
    }catch(e){}
    detecting=false;
    onDetect();
  }
  setTimeout(detectLoop,80);
}

function onDetect(){
  const vw=video.videoWidth||window.innerWidth;
  const vh=video.videoHeight||window.innerHeight;
  const sX=window.innerWidth/vw, sY=window.innerHeight/vh;

  if(primary){
    const[bx,by,bw,bh]=primary.bbox;
    tgtX=(bx+bw/2)*sX; tgtY=(by+bh/2)*sY; tgtOn=true;
    const dist=Math.hypot(curX-tgtX,curY-tgtY);
    const wasL=locked; locked=dist<150;
    if(locked&&!wasL){
      buildInfo(primary); threatBox.classList.add('show'); glitch=10;
      const tv=tier(primary.class);
      log(`LOCK // ${primary.class.toUpperCase()} [${tv}]`,tv==='HIGH'?'threat':'lock');
      if(!cardVis)tapHint.classList.add('show');
    }
    if(!locked&&wasL){threatBox.classList.remove('show');tapHint.classList.remove('show');}
  }else{
    tgtOn=false;locked=false;
    threatBox.classList.remove('show');tapHint.classList.remove('show');
  }

  // Stat panel
  document.getElementById('sObjs').textContent=String(preds.length).padStart(2,'0');
  document.getElementById('sInfer').textContent=inferMs+'ms';
  document.getElementById('sCap').textContent=capCount;
  if(primary){
    const tv=tier(primary.class);
    const pc=tv==='HIGH'?'red':tv==='MED'?'amber':'cyan';
    const el=document.getElementById('sPrimary');
    el.textContent=primary.class.toUpperCase();el.className='sv '+pc;
    const te=document.getElementById('sThreat');
    te.textContent=tv;te.className='sv '+pc;
    document.getElementById('sConf').style.width=Math.round(primary.score*100)+'%';
    document.getElementById('sConf').className='bf'+(tv==='HIGH'?' red':'');
  }else{
    ['sPrimary','sThreat'].forEach(id=>{document.getElementById(id).textContent='--';document.getElementById(id).className='sv';});
    document.getElementById('sConf').style.width='0%';
  }

  // Detect list
  const el=document.getElementById('dlItems');el.innerHTML='';
  preds.slice(0,7).forEach(p=>{
    const tv=tier(p.class);const[r,g,b]=tColor(tv);const col=`rgb(${r},${g},${b})`;
    const pct=Math.round(p.score*100);
    const d=document.createElement('div');d.className='dli';
    d.innerHTML=`<div class="dldot" style="background:${col};box-shadow:0 0 4px ${col}"></div>
      <div class="dlname">${p.class.toUpperCase()}</div>
      <div class="dlbw"><div class="dlbf" style="width:${pct}%;background:${col}"></div></div>
      <div class="dlpct" style="color:${col}">${pct}%</div>`;
    el.appendChild(d);
  });
}

function buildInfo(p){
  const tv=tier(p.class);
  infoLines=[
    {k:'CLASS',v:p.class.toUpperCase()},{k:'THREAT',v:tv},
    {k:'CONF',v:Math.round(p.score*100)+'%'},
    {k:'ID',v:'0x'+Math.random().toString(16).slice(2,8).toUpperCase()},
    {k:'SECTOR',v:String.fromCharCode(65+Math.floor(Math.random()*6))+(Math.floor(Math.random()*9)+1)},
    {k:'STATUS',v:'LOCKED'},
  ];
  textTick=0;
  const tl=document.getElementById('tLines');tl.innerHTML='';
  infoLines.forEach(l=>{
    const d=document.createElement('div');d.className='ti';
    d.innerHTML=`<span class="tik">${l.k}</span>${l.v}`;
    tl.appendChild(d);
  });
}

// Capture
function capturePortrait(p){
  if(!video.videoWidth)return;
  const[bx,by,bw,bh]=p.bbox;
  const pad=0.18;
  const cx=Math.max(0,bx-bw*pad),cy=Math.max(0,by-bh*pad);
  const cw=Math.min(video.videoWidth-cx,bw*(1+pad*2));
  const ch=Math.min(video.videoHeight-cy,bh*(1+pad*2));
  portCvs.width=130;portCvs.height=130;
  portCtx.fillStyle='#000';portCtx.fillRect(0,0,130,130);
  portCtx.drawImage(video,cx,cy,cw,ch,0,0,130,130);
  const uid='0x'+Math.random().toString(16).slice(2,8).toUpperCase();
  document.getElementById('pTime').textContent=ts();
  document.getElementById('pId').textContent='ID:'+uid;
  const tv=tier(p.class);
  const rows=[
    {k:'CLASS',v:p.class.toUpperCase(),red:false},
    {k:'THREAT',v:tv,red:tv==='HIGH'},
    {k:'CONF',v:Math.round(p.score*100)+'%',red:false},
    {k:'UID',v:uid,red:false},
    {k:'INFER',v:inferMs+'ms',red:false},
    {k:'LAT',v:lat.toFixed(5)+'°',red:false},
    {k:'LON',v:lon.toFixed(5)+'°',red:false},
    {k:'STATUS',v:'LOCKED',red:true},
  ];
  const cm=document.getElementById('cmRows');cm.innerHTML='';
  rows.forEach(r=>{
    const d=document.createElement('div');d.className='cmrow';
    d.innerHTML=`<span class="cmk">${r.k}</span><span class="cmv${r.red?' red':''}">${r.v}</span>`;
    cm.appendChild(d);
  });
  capCount++;
}

// Flash
function doFlash(){
  flashEl.classList.remove('go');void flashEl.offsetWidth;flashEl.classList.add('go');
}

// Tap
document.getElementById('ui').addEventListener('pointerdown',e=>{
  if(!running)return;
  if(cardVis){
    const r=capCard.getBoundingClientRect();
    if(!(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)){
      capCard.classList.remove('show');
      detList.style.display='flex';
      cardVis=false;
    }
    return;
  }
  if(locked&&primary){
    capturePortrait(primary);
    capCard.classList.add('show');
    detList.style.display='none';
    cardVis=true;
    tapHint.classList.remove('show');
    doFlash();
    log(`CAPTURED // ${primary.class.toUpperCase()}`,'threat');
  }
});

// Radar
function radarLoop(){
  const R=46,cx=50,cy=50;
  rc.clearRect(0,0,100,100);
  rc.fillStyle='rgba(0,0,0,0.75)';
  rc.beginPath();rc.arc(cx,cy,R,0,Math.PI*2);rc.fill();
  rc.strokeStyle='rgba(0,240,255,0.12)';rc.lineWidth=1;
  rc.beginPath();rc.arc(cx,cy,R,0,Math.PI*2);rc.stroke();
  [0.4,0.7,1].forEach(f=>{
    rc.strokeStyle=`rgba(0,240,255,${0.04+0.03*f})`;rc.lineWidth=0.5;
    rc.beginPath();rc.arc(cx,cy,R*f,0,Math.PI*2);rc.stroke();
  });
  rc.strokeStyle='rgba(0,240,255,0.06)';rc.lineWidth=0.5;
  rc.beginPath();rc.moveTo(cx-R,cy);rc.lineTo(cx+R,cy);rc.moveTo(cx,cy-R);rc.lineTo(cx,cy+R);rc.stroke();
  radarA=(radarA+0.04)%(Math.PI*2);
  rc.save();rc.translate(cx,cy);rc.rotate(radarA);
  const sg=rc.createLinearGradient(0,-R,0,0);
  sg.addColorStop(0,'rgba(0,240,255,0)');sg.addColorStop(1,'rgba(0,240,255,0.18)');
  rc.fillStyle=sg;rc.beginPath();rc.moveTo(0,0);rc.arc(0,0,R,-0.5,0);rc.closePath();rc.fill();
  rc.strokeStyle='rgba(0,240,255,0.45)';rc.lineWidth=1;
  rc.beginPath();rc.moveTo(0,0);rc.lineTo(0,-R);rc.stroke();rc.restore();
  preds.slice(0,8).forEach((p,i)=>{
    const ang=(radarA+i*1.2)%(Math.PI*2);
    const d=(0.3+0.55*p.score)*R;
    const bx2=cx+Math.cos(ang)*d,by2=cy+Math.sin(ang)*d;
    const[r,g,b]=tColor(tier(p.class));
    rc.fillStyle=`rgba(${r},${g},${b},0.9)`;
    rc.shadowBlur=5;rc.shadowColor=`rgb(${r},${g},${b})`;
    rc.beginPath();rc.arc(bx2,by2,2.2,0,Math.PI*2);rc.fill();rc.shadowBlur=0;
  });
  rc.fillStyle='rgba(0,240,255,0.8)';
  rc.beginPath();rc.arc(cx,cy,1.8,0,Math.PI*2);rc.fill();
  requestAnimationFrame(radarLoop);
}

// HUD draw
function drawLoop(){
  hc.clearRect(0,0,hud.width,hud.height);
  const dpr=devicePixelRatio,W=hud.width,H=hud.height;

  frameN++;
  const now=Date.now();
  if(now-lastFpsT>600){
    fps=Math.round(frameN/(now-lastFpsT)*1000);frameN=0;lastFpsT=now;
    document.getElementById('tbFps').textContent=fps+' FPS';
  }

  T+=0.05;

  // Smooth tracking
  const dX=tgtOn?tgtX:window.innerWidth/2;
  const dY=tgtOn?tgtY:window.innerHeight/2;
  curX+=(dX-curX)*0.1;
  curY+=(dY-curY)*0.1;

  lockF=locked?Math.min(1,lockF+0.07):Math.max(0,lockF-0.04);

  let cr=0,cg=220,cb=255;
  if(locked&&primary){[cr,cg,cb]=tColor(tier(primary.class));}
  const cStr=`${cr},${cg},${cb}`;
  const alpha=0.55+0.45*lockF;
  const mainCol=`rgba(${cStr},${alpha})`;

  // EW
  ewTick++;
  if(ewTick%250===0)ewI=20;
  if(ewI>0){
    ewI=Math.max(0,ewI-0.6);
    document.getElementById('sEw').style.width=(ewI/20*100)+'%';
    document.getElementById('sEw').className='bf red';
  }else{
    document.getElementById('sEw').style.width='0%';
    document.getElementById('sEw').className='bf';
  }

  hc.save();
  if(glitch>0){hc.translate((Math.random()-.5)*12*dpr,(Math.random()-.5)*4*dpr);glitch--;}
  if(ewI>6)hc.translate((Math.random()-.5)*8*dpr*(ewI/20),0);

  const cx=curX*dpr,cy=curY*dpr;

  // Secondary boxes
  if(preds.length>1){
    hc.save();
    for(let i=1;i<preds.length;i++){
      const p=preds[i];
      const[bx,by,bw,bh]=p.bbox;
      const vw=video.videoWidth||window.innerWidth;
      const vh=video.videoHeight||window.innerHeight;
      const sX=window.innerWidth/vw,sY=window.innerHeight/vh;
      const rx=bx*sX*dpr,ry=by*sY*dpr,rw=bw*sX*dpr,rh=bh*sY*dpr;
      const tv=tier(p.class);const[r,g,b]=tColor(tv);const cc=`${r},${g},${b}`;
      hc.strokeStyle=`rgba(${cc},0.45)`;hc.shadowColor=`rgba(${cc},0.4)`;hc.shadowBlur=4;hc.lineWidth=1*dpr;
      const cL=Math.min(rw,rh)*0.2;hc.setLineDash([]);
      hc.beginPath();
      hc.moveTo(rx,ry+cL);hc.lineTo(rx,ry);hc.lineTo(rx+cL,ry);
      hc.moveTo(rx+rw-cL,ry);hc.lineTo(rx+rw,ry);hc.lineTo(rx+rw,ry+cL);
      hc.moveTo(rx+rw,ry+rh-cL);hc.lineTo(rx+rw,ry+rh);hc.lineTo(rx+rw-cL,ry+rh);
      hc.moveTo(rx+cL,ry+rh);hc.lineTo(rx,ry+rh);hc.lineTo(rx,ry+rh-cL);
      hc.stroke();
      hc.fillStyle=`rgba(${cc},0.55)`;hc.shadowBlur=0;
      hc.font=`${8*dpr}px 'Share Tech Mono'`;
      hc.fillText(p.class.toUpperCase()+' '+Math.round(p.score*100)+'%',rx+3*dpr,ry-5*dpr);
    }
    hc.restore();
  }

  // Primary box
  if(primary&&tgtOn){
    const[bx,by,bw,bh]=primary.bbox;
    const vw=video.videoWidth||window.innerWidth;
    const vh=video.videoHeight||window.innerHeight;
    const sX=window.innerWidth/vw,sY=window.innerHeight/vh;
    const rx=bx*sX*dpr,ry=by*sY*dpr,rw=bw*sX*dpr,rh=bh*sY*dpr;
    hc.save();
    hc.strokeStyle=mainCol;hc.shadowColor=mainCol;hc.shadowBlur=10*lockF;hc.lineWidth=2*dpr;
    const cL=Math.min(rw,rh)*0.22;hc.setLineDash([]);
    hc.beginPath();
    hc.moveTo(rx,ry+cL);hc.lineTo(rx,ry);hc.lineTo(rx+cL,ry);
    hc.moveTo(rx+rw-cL,ry);hc.lineTo(rx+rw,ry);hc.lineTo(rx+rw,ry+cL);
    hc.moveTo(rx+rw,ry+rh-cL);hc.lineTo(rx+rw,ry+rh);hc.lineTo(rx+rw-cL,ry+rh);
    hc.moveTo(rx+cL,ry+rh);hc.lineTo(rx,ry+rh);hc.lineTo(rx,ry+rh-cL);
    hc.stroke();
    hc.fillStyle=`rgba(${cStr},${0.03+0.04*lockF})`;hc.fillRect(rx,ry,rw,rh);
    // Scan line
    if(lockF>0.3){
      const sy=ry+((Date.now()/16)%rh);
      const sg2=hc.createLinearGradient(rx,sy-8*dpr,rx,sy+8*dpr);
      sg2.addColorStop(0,`rgba(${cStr},0)`);sg2.addColorStop(0.5,`rgba(${cStr},${0.18*lockF})`);sg2.addColorStop(1,`rgba(${cStr},0)`);
      hc.fillStyle=sg2;hc.fillRect(rx,sy-8*dpr,rw,16*dpr);
    }
    hc.shadowBlur=0;
    hc.font=`${9*dpr}px 'Share Tech Mono'`;
    const lbl=primary.class.toUpperCase()+' '+Math.round(primary.score*100)+'%';
    const tw=hc.measureText(lbl).width+8*dpr;
    hc.fillStyle='rgba(0,0,0,0.7)';hc.fillRect(rx,ry+rh+2*dpr,tw,13*dpr);
    hc.fillStyle=mainCol;hc.fillText(lbl,rx+4*dpr,ry+rh+11*dpr);
    hc.restore();
  }

  // Reticle
  drawReticle(cx,cy,dpr,lockF,cStr,mainCol,T);

  // Data block
  if(lockF>0.05){
    hc.globalAlpha=lockF;
    drawData(cx,cy,dpr,mainCol,cStr);
    hc.globalAlpha=1;
  }

  // EW noise
  if(ewI>4){
    for(let i=0;i<Math.round(ewI);i++){
      hc.fillStyle=`rgba(255,255,255,${Math.random()*0.1})`;
      hc.fillRect(Math.random()*W,Math.random()*H,(1+Math.random()*3)*dpr,dpr);
    }
  }

  drawCorners(W,H,dpr);
  hc.restore();
  if(running)requestAnimationFrame(drawLoop);
}

function drawReticle(cx,cy,dpr,lf,cStr,mainCol,time){
  hc.save();hc.translate(cx,cy);
  hc.strokeStyle=`rgba(${cStr},0.1)`;hc.lineWidth=0.5*dpr;hc.shadowBlur=0;
  hc.beginPath();hc.arc(0,0,118*dpr,0,Math.PI*2);hc.stroke();
  if(lf>0.1){
    const pulse=0.5+0.5*Math.sin(time*2.2);
    [55,78,98].forEach(r=>{
      hc.strokeStyle=`rgba(${cStr},${(0.06+0.07*pulse)*lf})`;hc.lineWidth=0.5*dpr;
      hc.beginPath();hc.arc(0,0,r*dpr,0,Math.PI*2);hc.stroke();
    });
  }
  if(lf>0.1){
    hc.save();hc.rotate(time*1.4);
    hc.strokeStyle=`rgba(${cStr},${0.3+0.3*lf})`;hc.lineWidth=2*dpr;
    hc.shadowBlur=8*lf;hc.shadowColor=mainCol;hc.setLineDash([20*dpr,55*dpr]);
    hc.beginPath();hc.arc(0,0,100*dpr,0,Math.PI*2);hc.stroke();hc.restore();
  }
  if(lf>0.25){
    hc.save();hc.rotate(-time*0.75);
    hc.strokeStyle=`rgba(${cStr},${0.15+0.15*lf})`;hc.lineWidth=0.8*dpr;hc.setLineDash([6*dpr,22*dpr]);
    hc.beginPath();hc.arc(0,0,80*dpr,0,Math.PI*2);hc.stroke();hc.restore();
  }
  hc.setLineDash([]);
  const bS=(30-9*lf)*dpr,bD=(10+16*lf)*dpr;
  hc.strokeStyle=mainCol;hc.lineWidth=2.5*dpr;hc.shadowBlur=10*lf;hc.shadowColor=mainCol;
  for(let i=0;i<4;i++){
    hc.save();hc.rotate(i*Math.PI/2);
    hc.beginPath();hc.moveTo(bS,-bS+bD);hc.lineTo(bS,-bS);hc.lineTo(bS-bD,-bS);
    hc.stroke();hc.restore();
  }
  hc.lineWidth=1.5*dpr;hc.shadowBlur=5;
  const g=5*dpr,c2=8*dpr;
  hc.fillStyle=mainCol;hc.beginPath();
  hc.moveTo(-c2,0);hc.lineTo(-g,0);hc.moveTo(g,0);hc.lineTo(c2,0);
  hc.moveTo(0,-c2);hc.lineTo(0,-g);hc.moveTo(0,g);hc.lineTo(0,c2);
  hc.stroke();
  hc.shadowBlur=12*lf;hc.beginPath();hc.arc(0,0,2.5*dpr,0,Math.PI*2);hc.fill();
  hc.strokeStyle=`rgba(${cStr},0.3)`;hc.lineWidth=0.8*dpr;hc.shadowBlur=0;
  for(let a=0;a<360;a+=10){
    const rad=a*Math.PI/180;
    const inn=(a%90===0?122:a%30===0?120:119.5)*dpr;
    hc.beginPath();hc.moveTo(Math.cos(rad)*inn,Math.sin(rad)*inn);
    hc.lineTo(Math.cos(rad)*126*dpr,Math.sin(rad)*126*dpr);hc.stroke();
  }
  if(lf<0.85){
    hc.save();hc.rotate(time*0.9);
    const sg=hc.createLinearGradient(0,-110*dpr,0,0);
    sg.addColorStop(0,`rgba(${cStr},0)`);sg.addColorStop(1,`rgba(${cStr},${0.08*(1-lf)})`);
    hc.fillStyle=sg;hc.beginPath();hc.moveTo(0,0);hc.arc(0,0,116*dpr,-0.5,0.5);hc.closePath();hc.fill();
    hc.restore();
  }
  hc.restore();
}

function drawData(cx,cy,dpr,mainCol,cStr){
  textTick+=0.5;
  hc.font=`${9*dpr}px 'Share Tech Mono'`;hc.shadowBlur=4;hc.shadowColor=mainCol;hc.fillStyle=mainCol;
  infoLines.forEach((l,i)=>{
    const chars=Math.floor(textTick-i*3.5);if(chars<=0)return;
    let line=('› '+l.k+': '+l.v).slice(0,chars);
    if(ewI>8&&Math.random()>0.7)
      line=line.replace(/[A-Z0-9]/g,ch=>Math.random()>0.65?String.fromCharCode(33+Math.random()*20):ch);
    hc.fillText(line,cx+128*dpr,cy-28*dpr+i*15.5*dpr);
  });
}

function drawCorners(W,H,dpr){
  const s=28*dpr;
  hc.strokeStyle='rgba(0,240,255,0.08)';hc.lineWidth=1*dpr;hc.shadowBlur=0;hc.setLineDash([]);
  [[0,0,1,1],[W,0,-1,1],[W,H,-1,-1],[0,H,1,-1]].forEach(([x,y,sx,sy])=>{
    hc.beginPath();hc.moveTo(x+sx*s,y);hc.lineTo(x,y);hc.lineTo(x,y+sy*s);hc.stroke();
  });
  hc.strokeStyle='rgba(255,255,255,0.03)';hc.lineWidth=0.5*dpr;hc.setLineDash([4*dpr,14*dpr]);
  hc.beginPath();hc.moveTo(0,H/2);hc.lineTo(W,H/2);hc.moveTo(W/2,0);hc.lineTo(W/2,H);hc.stroke();
  hc.setLineDash([]);
}
