<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD TACTICAL v14.0 // SMOOTH_LOCK</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.4) contrast(1.4) saturate(0); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #terminal {
            position: absolute; top: 20px; left: 20px; width: 380px; height: 180px;
            background: none; font-size: 11px; padding: 5px; overflow: hidden;
            z-index: 15; line-height: 2.0; text-transform: uppercase;
        }
        .log-entry { margin-bottom: 2px; letter-spacing: 1px; border-left: 3px solid; padding-left: 10px; }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 50px; background: none; border: 1px solid #fff; color: #fff;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 5px; transition: 0.4s;
        }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">INITIALIZE HUD v14</button>
    <div id="terminal"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const terminal = document.getElementById('terminal');

let model;
let targetPos = { x: window.innerWidth/2, y: window.innerHeight/2, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let lockFactor = 0; 
let pulseTime = 0;
let textTick = 0;
let infoLines = [];
let glitchActive = 0;
let ewIntensity = 0;

const RED_TARGETS = ['person', 'car', 'truck', 'bus', 'motorcycle'];
const GLITCH_CHARS = "$#@%&*+=?X";

function glitchText(text) {
    return text.split('').map(char => 
        (Math.random() > 0.94) ? GLITCH_CHARS[Math.floor(Math.random()*GLITCH_CHARS.length)] : char
    ).join('');
}

function logToTerminal(msg) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `[TRACK_LOG] > ${msg}`;
    terminal.appendChild(entry);
    if (terminal.children.length > 6) terminal.removeChild(terminal.firstChild);
    glitchActive = 15;
}

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    logToTerminal("BOOT_V14_PROCESSED...");
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        model = await cocoSsd.load();
        logToTerminal("NEURAL_SYNC_COMPLETE");
        resize();
        detectFrame();
        draw();
    } catch (err) {
        logToTerminal("HARDWARE_OFFLINE");
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
            const p = predictions[0];
            const [x, y, w, h] = p.bbox;
            const sX = window.innerWidth / video.videoWidth;
            const sY = window.innerHeight / video.videoHeight;

            targetPos.x = (x + w/2) * sX;
            targetPos.y = (y + h/2) * sY;
            targetPos.active = true;
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let wasLocked = isLocked;
            isLocked = dist < 150 && RED_TARGETS.includes(p.class.toLowerCase());

            if (isLocked && !wasLocked) {
                textTick = 0;
                infoLines = [
                    `OBJECT: ${p.class.toUpperCase()}`,
                    `ID_TAG: ${Math.random().toString(16).slice(2,8).toUpperCase()}`,
                    `PROB: ${Math.round(p.score * 100)}%`,
                    `EW_SENSE: ACTIVE`,
                    `LOCK: STABLE`
                ];
                logToTerminal(`ACQUIRED: ${p.class.toUpperCase()}`);
            }
        } else {
            targetPos.active = false;
            isLocked = false;
        }
    }
    setTimeout(detectFrame, 50);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    // Плавное следование (0.08 для эффекта "тяжелого" наведения)
    const destX = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const destY = targetPos.active ? targetPos.y : window.innerHeight / 2;
    currentPos.x += (destX - currentPos.x) * 0.08;
    currentPos.y += (destY - currentPos.y) * 0.08;

    if (isLocked) { lockFactor = Math.min(1, lockFactor + 0.1); } 
    else { lockFactor = Math.max(0, lockFactor - 0.06); }

    pulseTime += 0.1;
    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;
    
    const r = 255;
    const gb = Math.floor(255 * (1 - lockFactor));
    const mainColor = `rgb(${r}, ${gb}, ${gb})`;
    terminal.style.color = mainColor;

    ctx.save();
    
    // Эффекты помех
    if (Math.random() > 0.99) ewIntensity = 8;
    if (ewIntensity > 0 || glitchActive > 0) {
        ctx.translate((Math.random()-0.5)*10*dpr, (Math.random()-0.5)*3*dpr);
        ewIntensity--;
        if(glitchActive > 0) glitchActive--;
    }

    ctx.strokeStyle = mainColor;
    ctx.fillStyle = mainColor;
    ctx.shadowBlur = 5 * lockFactor;
    ctx.shadowColor = mainColor;

    drawSmoothReticle(cx, cy, dpr, lockFactor);

    if (lockFactor > 0.1) {
        ctx.globalAlpha = lockFactor;
        drawDataBlock(cx, cy, dpr);
        ctx.globalAlpha = 1;
    }

    ctx.restore();
    requestAnimationFrame(draw);
}

function drawSmoothReticle(cx, cy, dpr, lf) {
    ctx.save();
    ctx.translate(cx, cy);
    
    // 1. Внешние скобки (двойные линии)
    const s = (45 - (15 * lf)) * dpr;
    const l = (15 + (5 * lf)) * dpr;
    ctx.lineWidth = 1.5 * dpr;
    for(let i=0; i<4; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI/2);
        // Основной угол
        ctx.beginPath();
        ctx.moveTo(s, -s+l); ctx.lineTo(s, -s); ctx.lineTo(s-l, -s);
        ctx.stroke();
        // Вторая линия (декор)
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.moveTo(s+5*dpr, -s+l); ctx.lineTo(s+5*dpr, -s-5*dpr); ctx.lineTo(s-l, -s-5*dpr);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    // 2. Линейки отклонения (подвижные)
    ctx.lineWidth = 1 * dpr;
    const devX = (cx - (canvas.width/2)) / 10;
    const devY = (cy - (canvas.height/2)) / 10;
    
    // X-Axis
    ctx.beginPath(); ctx.moveTo(-100*dpr, 120*dpr); ctx.lineTo(100*dpr, 120*dpr); ctx.stroke();
    ctx.fillRect(devX, 115*dpr, 2*dpr, 10*dpr);
    
    // Y-Axis
    ctx.beginPath(); ctx.moveTo(-120*dpr, -100*dpr); ctx.lineTo(-120*dpr, 100*dpr); ctx.stroke();
    ctx.fillRect(-125*dpr, devY, 10*dpr, 2*dpr);

    // 3. Центральный визир
    ctx.setLineDash([5*dpr, 15*dpr]);
    ctx.beginPath(); ctx.arc(0, 0, 85*dpr, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    
    // Перекрестие
    const cross = 10 * dpr;
    ctx.beginPath();
    ctx.moveTo(-cross, 0); ctx.lineTo(cross, 0);
    ctx.moveTo(0, -cross); ctx.lineTo(0, cross);
    ctx.stroke();

    ctx.restore();
}

function drawDataBlock(cx, cy, dpr) {
    textTick += 0.45;
    const fontSize = 13 * dpr;
    ctx.font = `bold ${fontSize}px 'Courier New'`;
    
    infoLines.forEach((line, i) => {
        let len = Math.floor(textTick - (i * 3));
        if (len > 0) {
            let txt = "» " + line.substring(0, len);
            if (Math.random() > 0.92) txt = glitchText(txt);
            ctx.fillText(txt, cx + 160 * dpr, cy - 60 * dpr + (i * fontSize * 2.3));
        }
    });

    // Мини-индикатор состояния под текстом
    ctx.strokeRect(cx + 160 * dpr, cy + 80 * dpr, 60 * dpr, 8 * dpr);
    ctx.fillRect(cx + 160 * dpr, cy + 80 * dpr, (Math.random()*60) * dpr, 8 * dpr);
}

window.onresize = resize;
</script>
</body>
</html>
