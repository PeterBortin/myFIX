<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD AI Target System v2.1</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.7) contrast(1.1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #overlay {
            position: absolute; top: 20px; left: 20px; color: #0f0; 
            text-shadow: 0 0 5px #0f0; font-size: 14px; z-index: 10;
        }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; background: none; border: 2px solid #0f0; color: #0f0;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 10px #0f0;
            transition: 0.3s;
        }
        #startBtn:hover { background: rgba(0,255,0,0.2); }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">INITIALIZE SYSTEM</button>
    <div id="overlay">SYSTEM: STANDBY</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const overlay = document.getElementById('overlay');

let model;
let currentTarget = null; // Полный объект детекции
let targetPos = { x: 0, y: 0, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let pulseTime = 0; // Для анимации пульсации
let infoLines = []; // Строки текста

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    overlay.innerHTML = "SYSTEM: BOOTING...<br>AI: LOADING_MODEL";
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
        });
        video.srcObject = stream;
        
        model = await cocoSsd.load();
        overlay.innerHTML = "SYSTEM: ONLINE<br>AI: SCANNING";
        
        resize();
        detectFrame();
        draw();
    } catch (err) {
        overlay.innerHTML = "ERROR: ACCESS_DENIED";
        console.error(err);
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        
        if (predictions.length > 0) {
            const p = predictions[0];
            const [x, y, w, h] = p.bbox;
            
            const vW = video.videoWidth;
            const vH = video.videoHeight;
            const sW = window.innerWidth;
            const sH = window.innerHeight;

            const videoRatio = vW / vH;
            const screenRatio = sW / sH;
            
            let finalX, finalY;
            if (videoRatio > screenRatio) {
                let realW = sH * videoRatio;
                finalX = (x + w/2) * (realW / vW) - (realW - sW) / 2;
                finalY = (y + h/2) * (sH / vH);
            } else {
                let realH = sW / videoRatio;
                finalX = (x + w/2) * (sW / vW);
                finalY = (y + h/2) * (realH / vH) - (realH - sH) / 2;
            }

            targetPos.x = finalX;
            targetPos.y = finalY;
            targetPos.active = true;
            currentTarget = p; // Сохраняем весь объект
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let prevLock = isLocked;
            isLocked = dist < 70; // Увеличил радиус захвата
            
            // Если статус захвата изменился, генерируем текст
            if (isLocked && !prevLock) {
                generateInfoText(p);
            }

            overlay.innerHTML = `STATUS: ACTIVE<br>TARGET: ${p.class.toUpperCase()}<br>LOCK: ${isLocked ? 'YES' : 'NO'}`;
        } else {
            targetPos.active = false;
            isLocked = false;
            currentTarget = null;
            overlay.innerHTML = "STATUS: ACTIVE<br>TARGET: SEARCHING...";
        }
    }
    setTimeout(detectFrame, 60); 
}

// Генерация 4 строк фейкового описания
function generateInfoText(pred) {
    const cls = pred.class.toUpperCase();
    const conf = Math.round(pred.score * 100);
    const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
    
    // Создаем разные варианты "описания" для разных типов объектов
    let type = 'OBJECT';
    if (['person', 'cat', 'dog'].includes(pred.class)) type = 'BIOMETRIC';
    if (['cell phone', 'laptop', 'tv'].includes(pred.class)) type = 'DIGITAL_NODE';
    if (['cup', 'bottle', 'bowl'].includes(pred.class)) type = 'PASSIVE_GEAR';

    infoLines = [
        `> ID: ${cls}_${conf}`,
        `> TYPE: ${type}`,
        `> STATUS: TRACKED`,
        `> TS: ${time}`
    ];
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    const tx = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const ty = targetPos.active ? targetPos.y : window.innerHeight / 2;

    currentPos.x += (tx - currentPos.x) * 0.2;
    currentPos.y += (ty - currentPos.y) * 0.2;

    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;
    
    // --- Анимация пульсации ---
    pulseTime += 0.15; // Скорость пульсации
    // Pulse value от 0.95 до 1.05
    const pulseScale = isLocked ? (1 + Math.sin(pulseTime) * 0.05) : 1; 

    // Основной цвет (белый -> красный)
    const color = isLocked ? "#ff3300" : "#ffffff";

    ctx.strokeStyle = color;
    ctx.lineWidth = 3 * dpr;
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;

    // --- Отрисовка прицела с учетом пульсации ---
    const s = 25 * dpr * pulseScale;
    const g = 12 * dpr * pulseScale;
    const r = 90 * dpr * pulseScale; // Радиус дуг

    ctx.beginPath();
    // 4 уголка
    ctx.moveTo(cx - s, cy - g); ctx.lineTo(cx - s, cy - s); ctx.lineTo(cx - g, cy - s);
    ctx.moveTo(cx + g, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy - g);
    ctx.moveTo(cx - s, cy + g); ctx.lineTo(cx - s, cy + s); ctx.lineTo(cx - g, cy + s);
    ctx.moveTo(cx + g, cy + s); ctx.lineTo(cx + s, cy + s); ctx.lineTo(cx + s, cy + g);
    ctx.stroke();

    // Боковые дуги
    ctx.beginPath();
    ctx.lineWidth = 2 * dpr;
    ctx.arc(cx, cy, r, 0.8 * Math.PI, 1.2 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, r, -0.2 * Math.PI, 0.2 * Math.PI);
    ctx.stroke();

    // Горизонтальные черточки
    const cSize = 55 * dpr * pulseScale;
    const cGap = 35 * dpr * pulseScale;
    ctx.beginPath();
    ctx.moveTo(cx - cSize, cy); ctx.lineTo(cx - cGap, cy);
    ctx.moveTo(cx + cSize, cy); ctx.lineTo(cx + cGap, cy);
    ctx.stroke();

    // --- Отрисовка Информационного блока ---
    if (isLocked) {
        drawInfoBlock(cx, cy, dpr, color);
    }

    requestAnimationFrame(draw);
}

// Функция отрисовки текста слева
function drawInfoBlock(cx, cy, dpr, color) {
    const fontSize = 16 * dpr;
    ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
    ctx.fillStyle = color;
    ctx.shadowBlur = 10;
    ctx.textAlign = 'left';

    // Отступ влево от края прицела
    const offsetX = -130 * dpr;
    const offsetY = -40 * dpr; // Центр текста

    infoLines.forEach((line, index) => {
        // Эффект "печатной машинки" через Math.min
        const textToDraw = line.substring(0, Math.floor(pulseTime * 5));
        ctx.fillText(textToDraw, cx + offsetX, cy + offsetY + (index * fontSize * 1.3));
    });
    
    // Дополнительный декор: вертикальная линия
    ctx.beginPath();
    ctx.lineWidth = 1.5 * dpr;
    ctx.moveTo(cx + offsetX - 10 * dpr, cy + offsetY - 10 * dpr);
    ctx.lineTo(cx + offsetX - 10 * dpr, cy + offsetY + (infoLines.length * fontSize * 1.3));
    ctx.stroke();
}

window.onresize = resize;
</script>
</body>
</html>
