<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD TACTICAL AI v5.1</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.6) contrast(1.2) saturate(0.8); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #overlay {
            position: absolute; top: 20px; left: 20px; color: #0f0; 
            text-shadow: 0 0 10px #0f0; font-size: 11px; z-index: 10; letter-spacing: 2px;
        }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 40px; background: none; border: 1px solid #0f0; color: #0f0;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 15px rgba(0,255,0,0.4);
            text-transform: uppercase; letter-spacing: 3px; transition: 0.3s;
        }
        #startBtn:hover { background: rgba(0,255,0,0.1); }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">Initialize CORE_V5</button>
    <div id="overlay">NEURAL_LINK [BOOTING] // OS_STATUS: STANDBY</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const overlay = document.getElementById('overlay');

let model;
let targetPos = { x: 0, y: 0, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let pulseTime = 0;
let textTick = 0;
let infoLines = [];
let allPredictions = []; // Хранилище для всех объектов в кадре

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    overlay.innerHTML = "OS: RECOGNITION_CORE_LOADED [SCANNING]";
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        model = await cocoSsd.load();
        overlay.innerHTML = "OS: ACTIVE // LINK: STABLE // SCANNING_MODE";
        resize();
        detectFrame();
        draw();
    } catch (err) {
        overlay.innerHTML = "FATAL_ERROR: SENSOR_ACCESS_DENIED";
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        allPredictions = predictions; // Сохраняем все детекции

        if (predictions.length > 0) {
            const p = predictions[0]; // Следим за первым (самым вероятным)
            const [x, y, w, h] = p.bbox;
            const sX = window.innerWidth / video.videoWidth;
            const sY = window.innerHeight / video.videoHeight;

            targetPos.x = (x + w/2) * sX;
            targetPos.y = (y + h/2) * sY;
            targetPos.active = true;
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let wasLocked = isLocked;
            isLocked = dist < 85; // Увеличил радиус захвата

            if (isLocked && !wasLocked) {
                textTick = 0;
                generateInfoText(p, targetPos);
            }
        } else {
            targetPos.active = false;
            isLocked = false;
        }
    }
    setTimeout(detectFrame, 60);
}

// Генерация более детализированного текста справа
function generateInfoText(pred, pos) {
    const cls = pred.class.toUpperCase();
    const conf = Math.round(pred.score * 100);
    const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
    
    // Генерируем фейковые векторы/координаты
    const vec = `[${(Math.random()*10).toFixed(2)}, ${(Math.random()*10).toFixed(2)}, ${(Math.random()*10).toFixed(2)}]`;
    const coord = `${Math.floor(pos.x)}:${Math.floor(pos.y)}`;

    infoLines = [
        `ID: ${cls}_${conf}`,
        `MODE: LOCK_ENGAGED`,
        `VECTOR: ${vec}`,
        `COORD: ${coord}`,
        `TS: ${time}`
    ];
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    // Плавное следование за целью или возврат в центр
    const tx = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const ty = targetPos.active ? targetPos.y : window.innerHeight / 2;
    currentPos.x += (tx - currentPos.x) * 0.15;
    currentPos.y += (ty - currentPos.y) * 0.15;

    // Глитч и мерцание при захвате
    let shakeX = isLocked ? (Math.random() - 0.5) * 5 : 0;
    let shakeY = isLocked ? (Math.random() - 0.5) * 3 : 0;
    let flickeringOpacity = isLocked ? 1 - Math.random() * 0.2 : 1;

    const cx = (currentPos.x + shakeX) * dpr;
    const cy = (currentPos.y + shakeY) * dpr;
    
    pulseTime += 0.1;
    const pulseScale = isLocked ? (1 + Math.sin(pulseTime * 2) * 0.05) : 1;
    const color = isLocked ? "#ff1100" : "#ffffff";

    ctx.globalAlpha = flickeringOpacity;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2 * dpr;
    ctx.shadowBlur = isLocked ? 20 : 8;
    ctx.shadowColor = color;
    ctx.textAlign = 'left';

    // --- 1. Отрисовка подсветок ВСЕХ объектов (Standby режим) ---
    drawAllObjects(dpr);

    // --- 2. Отрисовка динамических шкал по бокам ---
    drawSideScales(cx, cy, dpr);

    // --- 3. Отрисовка центрального прицела (Режимы Standby и Lock) ---
    drawMainReticle(cx, cy, dpr, pulseScale, color);

    // --- 4. Отрисовка текста справа ---
    if (isLocked) {
        drawInfoText(cx, cy, dpr);
    }

    requestAnimationFrame(draw);
}

// 1. Функция подсветки всех объектов
function drawAllObjects(dpr) {
    ctx.lineWidth = 1 * dpr;
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
    ctx.font = `${10 * dpr}px 'Courier New'`;

    const vW = video.videoWidth;
    const vH = video.videoHeight;
    const sW = window.innerWidth;
    const sH = window.innerHeight;

    allPredictions.forEach((p, index) => {
        // Пропускаем объект, который уже захвачен прицелом, чтобы не дублировать
        if (isLocked && index === 0) return; 

        const [x, y, w, h] = p.bbox;
        const scaleX = sW / vW;
        const scaleY = sH / vH;

        ctx.strokeStyle = "rgba(0, 255, 65, 0.2)"; // Полупрозрачный зеленый
        ctx.fillStyle = "rgba(0, 255, 65, 0.4)";
        ctx.strokeRect(x * scaleX * dpr, y * scaleY * dpr, w * scaleX * dpr, h * scaleY * dpr);
        ctx.fillText(`${p.class.toUpperCase()}`, x * scaleX * dpr, y * scaleY * dpr - 5 * dpr);
    });
}

// 2. Функция отрисовки боковых шкал
function drawSideScales(cx, cy, dpr) {
    ctx.shadowBlur = 8 * dpr;
    ctx.lineWidth = 1 * dpr;
    const xOff = 135 * dpr;
    const ySize = 100 * dpr;
    
    // Слева (высота)
    ctx.beginPath();
    ctx.moveTo(cx - xOff, cy - ySize);
    ctx.lineTo(cx - xOff, cy + ySize);
    ctx.stroke();

    // Справа (азимут)
    ctx.beginPath();
    ctx.moveTo(cx + xOff, cy - ySize);
    ctx.lineTo(cx + xOff, cy + ySize);
    ctx.stroke();

    // Маркеры шкал (пульсирующие черточки)
    for (let i = -4; i <= 4; i++) {
        let yOffset = cy + (i * 22 * dpr);
        let opacity = 1 - Math.abs(i) * 0.15;
        let lineLength = (i % 2 === 0) ? 15 : 10;
        
        ctx.strokeStyle = `rgba(${isLocked ? '255,17,0' : '255,255,255'}, ${opacity})`;
        ctx.beginPath();
        ctx.moveTo(cx - xOff, yOffset); ctx.lineTo(cx - xOff + lineLength * dpr, yOffset);
        ctx.moveTo(cx + xOff, yOffset); ctx.lineTo(cx + xOff - lineLength * dpr, yOffset);
        ctx.stroke();
    }
}

// 3. Функция центрального прицела
function drawMainReticle(cx, cy, dpr, pulseScale, color) {
    ctx.lineWidth = 2 * dpr;
    const s = 25 * dpr * pulseScale;
    const g = 10 * dpr * pulseScale;
    
    // Внутренний прицел (Крестик всегда)
    const smallS = 5 * dpr;
    ctx.beginPath();
    ctx.moveTo(cx - smallS, cy); ctx.lineTo(cx + smallS, cy);
    ctx.moveTo(cx, cy - smallS); ctx.lineTo(cx, cy + smallS);
    ctx.stroke();

    ctx.beginPath();
    if (isLocked) {
        // Режим Lock: Уголки-стрелки указывающие внутрь
        for(let i=0; i<4; i++) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(i * Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(s, -s); ctx.lineTo(s - g, -s); ctx.lineTo(s, -s); ctx.lineTo(s, -s + g);
            ctx.stroke();
            ctx.restore();
        }
    } else {
        // Режим Standby: Обычные уголки
        ctx.moveTo(cx - s, cy - g); ctx.lineTo(cx - s, cy - s); ctx.lineTo(cx - g, cy - s);
        ctx.moveTo(cx + g, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy - g);
        ctx.moveTo(cx - s, cy + g); ctx.lineTo(cx - s, cy + s); ctx.lineTo(cx - g, cy + s);
        ctx.moveTo(cx + g, cy + s); ctx.lineTo(cx + s, cy + s); ctx.lineTo(cx + s, cy + g);
    }
    ctx.stroke();

    // Сегментированные дуги
    ctx.lineWidth = 3 * dpr;
    ctx.beginPath();
    ctx.setLineDash([15 * dpr, 10 * dpr]); // Пунктир
    ctx.arc(cx, cy, 95 * dpr * pulseScale, 0.8 * Math.PI, 1.2 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 95 * dpr * pulseScale, -0.2 * Math.PI, 0.2 * Math.PI);
    ctx.stroke();
    ctx.setLineDash([]); // Сброс пунктира

    // Горизонтальные черточки
    ctx.lineWidth = 1.5 * dpr;
    const cSize = 65 * dpr * pulseScale;
    const cGap = 35 * dpr * pulseScale;
    ctx.beginPath();
    ctx.moveTo(cx - cSize, cy); ctx.lineTo(cx - cGap, cy);
    ctx.moveTo(cx + cSize, cy); ctx.lineTo(cx + cGap, cy);
    ctx.stroke();
}

// 4. Функция текста справа
function drawInfoText(cx, cy, dpr) {
    ctx.textAlign = 'left';
    textTick += 0.35; // Скорость печати
    const fontSize = 13 * dpr;
    ctx.font = `bold ${fontSize}px 'Courier New'`;

    infoLines.forEach((line, index) => {
        let count = Math.floor(textTick - (index * 4)); // Задержка для каждой строки
        if (count > 0) {
            let txt = "> " + line.substring(0, count);
            ctx.fillText(txt, cx + 130 * dpr, cy - 40 * dpr + (index * fontSize * 1.5));
        }
    });
    
    // Мигающий курсор
    if (Math.floor(pulseTime * 3) % 2 === 0) {
        ctx.fillRect(cx + 130 * dpr, cy + 55 * dpr, 10 * dpr, 2 * dpr);
    }
}

window.onresize = resize;
</script>
</body>
</html>
