<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD TACTICAL v12.0 // FULL_SYNC</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.4) contrast(1.3) saturate(0); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #terminal {
            position: absolute; top: 20px; left: 20px; width: 380px; height: 350px;
            background: none; font-size: 11px; padding: 5px; overflow: hidden;
            z-index: 15; line-height: 1.6; text-transform: uppercase;
        }
        .log-entry { margin-bottom: 8px; letter-spacing: 1px; border-left: 2px solid; padding-left: 8px; }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 50px; background: none; border: 1px solid #fff; color: #fff;
            font-family: inherit; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 5px; transition: 0.4s;
        }
    </style>
</head>
<body>

<div id="container">
    <button id="startBtn">ENGAGE NEURAL_LINK</button>
    <div id="terminal"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('hudCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const terminal = document.getElementById('terminal');

let model;
let targetPos = { x: window.innerWidth/2, y: window.innerHeight/2, active: false };
let currentPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let isLocked = false;
let lockFactor = 0; 
let pulseTime = 0;
let textTick = 0;
let infoLines = [];
let glitchActive = 0;
let ewIntensity = 0;
let ewTimer = 0;

const RED_TARGETS = ['person', 'car', 'truck', 'bus', 'motorcycle'];

function logToTerminal(msg) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `[SYS_LOG] > ${msg}`;
    terminal.appendChild(entry);
    if (terminal.children.length > 12) terminal.removeChild(terminal.firstChild);
    if (lockFactor > 0.5) glitchActive = 8;
}

startBtn.onclick = async () => {
    startBtn.style.display = 'none';
    logToTerminal("INIT_SEQUENCER_V12...");
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        model = await cocoSsd.load();
        logToTerminal("COCO_SSD_V2: OPERATIONAL");
        resize();
        detectFrame();
        draw();
    } catch (err) {
        logToTerminal("CRITICAL_LINK_ERROR");
    }
};

function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
}

async function detectFrame() {
    if (model && video.readyState === 4) {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
            const p = predictions[0];
            const [x, y, w, h] = p.bbox;
            const sX = window.innerWidth / video.videoWidth;
            const sY = window.innerHeight / video.videoHeight;

            targetPos.x = (x + w/2) * sX;
            targetPos.y = (y + h/2) * sY;
            targetPos.active = true;
            
            let dist = Math.hypot(currentPos.x - targetPos.x, currentPos.y - targetPos.y);
            let wasLocked = isLocked;
            isLocked = dist < 130 && RED_TARGETS.includes(p.class.toLowerCase());

            if (isLocked && !wasLocked) {
                textTick = 0;
                const id = "0x" + Math.random().toString(16).slice(2,8).toUpperCase();
                const prob = Math.round(p.score * 100);
                infoLines = [
                    `TARGET: ${p.class.toUpperCase()}`,
                    `UID: ${id}`,
                    `PROB: ${prob}%`,
                    `DIST: CALCULATING...`,
                    `STATE: STABLE_LOCK`
                ];
                logToTerminal(`LOCK: ${p.class.toUpperCase()} | ID:${id} | CONF:${prob}%`);
            }
        } else {
            if (isLocked) logToTerminal("SIGNAL_LOST: SEARCHING...");
            targetPos.active = false;
            isLocked = false;
        }
    }
    setTimeout(detectFrame, 60);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio;

    const destX = targetPos.active ? targetPos.x : window.innerWidth / 2;
    const destY = targetPos.active ? targetPos.y : window.innerHeight / 2;
    currentPos.x += (destX - currentPos.x) * 0.15;
    currentPos.y += (destY - currentPos.y) * 0.15;

    if (isLocked) {
        if (lockFactor < 1) lockFactor += 0.12;
    } else {
        if (lockFactor > 0) lockFactor -= 0.08;
    }

    pulseTime += 0.1;
    const cx = currentPos.x * dpr;
    const cy = currentPos.y * dpr;
    
    const r = 255;
    const gb = Math.floor(255 * (1 - lockFactor));
    const mainColor = `rgb(${r}, ${gb}, ${gb})`;
    terminal.style.color = mainColor;

    ctx.save();
    
    // Эффект РЭБ
    ewTimer++;
    if (ewTimer % 180 === 0) ewIntensity = 20;
    if (ewIntensity > 0) {
        ctx.translate((Math.random()-0.5)*30*dpr*(ewIntensity/20), 0);
        if (Math.random() > 0.8) {
            ctx.fillStyle = `rgba(255, 255, 255, 0.15)`;
            ctx.fillRect(0, Math.random()*canvas.height, canvas.width, 4*dpr);
        }
        ewIntensity--;
    }

    // Глитч
    if (glitchActive > 0) {
        ctx.translate((Math.random()-0.5)*20, (Math.random()-0.5)*20);
        glitchActive--;
    }

    ctx.strokeStyle = mainColor;
    ctx.fillStyle = mainColor;
    ctx.shadowBlur = 12 * lockFactor;
    ctx.shadowColor = mainColor;

    drawAdvancedReticle(cx, cy, dpr, lockFactor);

    if (lockFactor > 0.1) {
        ctx.globalAlpha = lockFactor;
        drawDataBlock(cx, cy, dpr);
        ctx.globalAlpha = 1;
    }

    ctx.restore();
    requestAnimationFrame(draw);
}

function drawAdvancedReticle(cx, cy, dpr, lf) {
    ctx.save();
    ctx.translate(cx, cy);
    
    // Вращение двух орбит
    ctx.save();
    ctx.rotate(pulseTime);
    ctx.lineWidth = 1 * dpr;
    ctx.setLineDash([20*dpr, 30*dpr]);
    ctx.beginPath();
    ctx.arc(0, 0, 110 * dpr, 0, Math.PI * 2);
    ctx.stroke();
    
    if (lf > 0.5) {
        ctx.rotate(-pulseTime * 2.5);
        ctx.setLineDash([5*dpr, 15*dpr]);
        ctx.beginPath();
        ctx.arc(0, 0, 125 * dpr, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();

    // Сканирующая полоса (анимация)
    if (lf > 0.3) {
        const scanY = (Math.sin(pulseTime * 2) * 100) * dpr;
        ctx.lineWidth = 1 * dpr;
        ctx.beginPath();
        ctx.moveTo(-70 * dpr, scanY);
        ctx.lineTo(70 * dpr, scanY);
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    // Центральное перекрестие
    ctx.lineWidth = 2 * dpr;
    const c = 8 * dpr;
    ctx.beginPath();
    ctx.moveTo(-c, 0); ctx.lineTo(c, 0);
    ctx.moveTo(0, -c); ctx.lineTo(0, c);
    ctx.stroke();

    // Динамические углы
    const size = (35 - (15 * lf)) * dpr; 
    const depth = (10 + (20 * lf)) * dpr; 
    for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(size, -size + depth);
        ctx.lineTo(size, -size);
        ctx.lineTo(size - depth, -size);
        ctx.stroke();
        ctx.restore();
    }

    // Боковые шкалы
    const barWidth = 4 * dpr;
    const barHeight = 60 * dpr;
    const barOffset = (90 + (10 * lf)) * dpr;
    ctx.fillRect(-barOffset, -barHeight/2, barWidth, barHeight * lf);
    ctx.fillRect(barOffset - barWidth, -barHeight/2, barWidth, barHeight * lf);

    ctx.restore();
}

function drawDataBlock(cx, cy, dpr) {
    textTick += 0.5;
    const fontSize = 14 * dpr;
    ctx.font = `bold ${fontSize}px 'Courier New'`;
    
    infoLines.forEach((line, i) => {
        let len = Math.floor(textTick - (i * 3));
        if (len > 0) {
            let txt = "» " + line.substring(0, len);
            // Микро-глитч для текста
            let offX = (ewIntensity > 10) ? (Math.random()-0.5)*10 : 0;
            ctx.fillText(txt, cx + 140 * dpr + offX, cy - 45 * dpr + (i * fontSize * 2));
        }
    });

    // Декоративный прогресс-бар внизу текста
    ctx.fillRect(cx + 140 * dpr, cy + 85 * dpr, 100 * dpr * Math.min(1, textTick/30), 2 * dpr);
}

window.onresize = resize;
</script>
</body>
</html>
